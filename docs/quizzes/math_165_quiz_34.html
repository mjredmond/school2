<!doctype html><html><head><meta charset="utf-8"><title>Arithmetic 4 — Quiz 34 Practice</title><style>
:root{--ink:#20242b;--line:#d7dce3;--blue:#175f9b;--good:#237241;--bad:#a5342a;--paper:#fff;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial,sans-serif;color:var(--ink);line-height:1.4}.wrap{max-width:1050px;margin:auto;padding:20px}.top,.tools,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.top h1{font-size:25px;margin:0}.sub{color:#5f6976;margin:4px 0 0}button{font:inherit;background:#fff;border:1px solid #b9c3cf;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.section{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:15px;margin:15px 0}.section h2{font-size:18px;margin:0 0 3px}.directions{color:#5f6976;margin:0 0 10px}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-of-type{border:0}.stem{font-weight:700;margin-bottom:8px}.subitem{display:grid;grid-template-columns:1fr minmax(145px,330px);gap:10px;align-items:center;margin:8px 0}.subitem label{white-space:pre-wrap}.subitem input,input{font:inherit;border:1px solid #aab6c4;border-radius:5px;padding:7px;width:100%}.visual{border:1px solid #d5dce4;border-radius:8px;background:#fbfdff;padding:10px;margin:10px 0;overflow:auto}.feedback{font-weight:700}.correct .feedback{color:var(--good)}.missed .feedback{color:var(--bad)}.answer{background:#fff4dc;border:1px solid #ebd3a3;border-radius:6px;padding:8px;margin-top:8px}.chart text{font:13px Arial}.chart .axis{stroke:#344150}.chart .grid{stroke:#dfe5eb}.chart .bar{fill:#4c83b2}.chart .dot{fill:#316f9f}.chart .circle{fill:none;stroke:#344150;stroke-width:2}.chart .ray{stroke:#344150;stroke-width:2}.chart .angle{stroke:#344150;stroke-width:3}@media(max-width:650px){.subitem{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="tools"><button class="primary" onclick="checkAll()">Check All</button><button onclick="resetQuiz()">Reset / New Version</button></div></div><div id="score"></div><div id="app"></div></main><script>const PRACTICE={"title":"Arithmetic 4 \u2014 Quiz 34 Practice","subtitle":"Lesson 165 \u2022 Five randomly selected practice versions","source":{"pdf":"abeka_math_docs.pdf"},"sections":[{"id":"s1","title":"1. Write the quotient.","directions":"Write each answer in simplest form.","items":[{"id":"q1","num":1,"variants":[{"prompt":"Write the quotient.","items":[{"label":"a.","prompt":"9360 \u00f7 84","answer":"111 r36"},{"label":"b.","prompt":"648 \u00f7 72","answer":"9"},{"label":"c.","prompt":"72.01 \u2212 12.151","answer":"59.859"},{"label":"d.","prompt":"26.134 + 67.3","answer":"93.434"}]},{"prompt":"Write the quotient.","items":[{"label":"a.","prompt":"9693 \u00f7 87","answer":"111 r36"},{"label":"b.","prompt":"750 \u00f7 75","answer":"10"},{"label":"c.","prompt":"73.01 \u2212 12.251","answer":"60.759"},{"label":"d.","prompt":"26.234 + 68.3","answer":"94.534"}]},{"prompt":"Write the quotient.","items":[{"label":"a.","prompt":"10026 \u00f7 90","answer":"111 r36"},{"label":"b.","prompt":"858 \u00f7 78","answer":"11"},{"label":"c.","prompt":"74.01 \u2212 12.351","answer":"61.659"},{"label":"d.","prompt":"26.334 + 69.3","answer":"95.634"}]},{"prompt":"Write the quotient.","items":[{"label":"a.","prompt":"10359 \u00f7 93","answer":"111 r36"},{"label":"b.","prompt":"972 \u00f7 81","answer":"12"},{"label":"c.","prompt":"75.01 \u2212 12.451","answer":"62.559"},{"label":"d.","prompt":"26.434 + 70.3","answer":"96.734"}]},{"prompt":"Write the quotient.","items":[{"label":"a.","prompt":"10692 \u00f7 96","answer":"111 r36"},{"label":"b.","prompt":"1092 \u00f7 84","answer":"13"},{"label":"c.","prompt":"76.01 \u2212 12.551","answer":"63.459"},{"label":"d.","prompt":"26.534 + 71.3","answer":"97.834"}]}]}]},{"id":"s2","title":"2. Write the product.","directions":"Write each answer in simplest form.","items":[{"id":"q2","num":2,"variants":[{"prompt":"Write the product.","items":[{"label":"a.","prompt":"64 \u00d7 83","answer":"5312"},{"label":"b.","prompt":"901 \u00d7 402","answer":"362202"}]},{"prompt":"Write the product.","items":[{"label":"a.","prompt":"65 \u00d7 82","answer":"5330"},{"label":"b.","prompt":"891 \u00d7 403","answer":"359073"}]},{"prompt":"Write the product.","items":[{"label":"a.","prompt":"66 \u00d7 81","answer":"5346"},{"label":"b.","prompt":"881 \u00d7 404","answer":"355924"}]},{"prompt":"Write the product.","items":[{"label":"a.","prompt":"67 \u00d7 80","answer":"5360"},{"label":"b.","prompt":"871 \u00d7 405","answer":"352755"}]},{"prompt":"Write the product.","items":[{"label":"a.","prompt":"68 \u00d7 79","answer":"5372"},{"label":"b.","prompt":"861 \u00d7 406","answer":"349566"}]}]}]},{"id":"s3","title":"3. Reduce each fraction to lowest terms.","directions":"Divide the numerator and denominator by their greatest common factor. Write any answer greater than 1 as a mixed number, not an improper fraction.","items":[{"id":"q3","num":3,"variants":[{"prompt":"Reduce each fraction to lowest terms.","items":[{"label":"a.","prompt":"3/4","answer":"3/4"},{"label":"b.","prompt":"1/6","answer":"1/6"},{"label":"c.","prompt":"4/5","answer":"4/5"},{"label":"d.","prompt":"12/1","answer":"12"},{"label":"e.","prompt":"23/2","answer":"11 1/2"}]},{"prompt":"Reduce each fraction to lowest terms.","items":[{"label":"a.","prompt":"7/10","answer":"7/10"},{"label":"b.","prompt":"1/6","answer":"1/6"},{"label":"c.","prompt":"18/25","answer":"18/25"},{"label":"d.","prompt":"13/1","answer":"13"},{"label":"e.","prompt":"12/1","answer":"12"}]},{"prompt":"Reduce each fraction to lowest terms.","items":[{"label":"a.","prompt":"2/3","answer":"2/3"},{"label":"b.","prompt":"1/6","answer":"1/6"},{"label":"c.","prompt":"2/3","answer":"2/3"},{"label":"d.","prompt":"14/1","answer":"14"},{"label":"e.","prompt":"25/2","answer":"12 1/2"}]},{"prompt":"Reduce each fraction to lowest terms.","items":[{"label":"a.","prompt":"9/14","answer":"9/14"},{"label":"b.","prompt":"1/6","answer":"1/6"},{"label":"c.","prompt":"22/35","answer":"22/35"},{"label":"d.","prompt":"15/1","answer":"15"},{"label":"e.","prompt":"13/1","answer":"13"}]},{"prompt":"Reduce each fraction to lowest terms.","items":[{"label":"a.","prompt":"5/8","answer":"5/8"},{"label":"b.","prompt":"1/6","answer":"1/6"},{"label":"c.","prompt":"3/5","answer":"3/5"},{"label":"d.","prompt":"16/1","answer":"16"},{"label":"e.","prompt":"27/2","answer":"13 1/2"}]}]}]},{"id":"s4","title":"4. Write each fraction as a decimal or decimal as a fraction.","directions":"Use the place value of the last digit for the denominator. Do not reduce.","items":[{"id":"q4","num":4,"variants":[{"prompt":"Write each fraction as a decimal or decimal as a fraction.","items":[{"label":"a.","prompt":"3/1,000","answer":"0.003"},{"label":"b.","prompt":"12 65/100","answer":"12.65"},{"label":"c.","prompt":"9.84","answer":"9 84/100"},{"label":"d.","prompt":"0.005","answer":"5/1,000"}]},{"prompt":"Write each fraction as a decimal or decimal as a fraction.","items":[{"label":"a.","prompt":"4/1,000","answer":"0.004"},{"label":"b.","prompt":"13 64/100","answer":"13.64"},{"label":"c.","prompt":"10.83","answer":"10 83/100"},{"label":"d.","prompt":"0.006","answer":"6/1,000"}]},{"prompt":"Write each fraction as a decimal or decimal as a fraction.","items":[{"label":"a.","prompt":"5/1,000","answer":"0.005"},{"label":"b.","prompt":"14 63/100","answer":"14.63"},{"label":"c.","prompt":"11.82","answer":"11 82/100"},{"label":"d.","prompt":"0.007","answer":"7/1,000"}]},{"prompt":"Write each fraction as a decimal or decimal as a fraction.","items":[{"label":"a.","prompt":"6/1,000","answer":"0.006"},{"label":"b.","prompt":"15 62/100","answer":"15.62"},{"label":"c.","prompt":"12.81","answer":"12 81/100"},{"label":"d.","prompt":"0.008","answer":"8/1,000"}]},{"prompt":"Write each fraction as a decimal or decimal as a fraction.","items":[{"label":"a.","prompt":"7/1,000","answer":"0.007"},{"label":"b.","prompt":"16 61/100","answer":"16.61"},{"label":"c.","prompt":"13.80","answer":"13 80/100"},{"label":"d.","prompt":"0.009","answer":"9/1,000"}]}]}]},{"id":"s5","title":"5. Write the sum or difference.","directions":"Write each answer in lowest terms, and write any answer greater than 1 as a mixed number.","items":[{"id":"q5","num":5,"variants":[{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"9 3/4 + 21 1/3 + 16 1/2","answer":"47 7/12"},{"label":"b.","prompt":"90 3/5 \u2212 8 1/3","answer":"82 4/15"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"10 3/4 + 22 1/3 + 16 1/2","answer":"49 7/12"},{"label":"b.","prompt":"91 3/5 \u2212 9 1/3","answer":"82 4/15"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"11 3/4 + 23 1/3 + 16 1/2","answer":"51 7/12"},{"label":"b.","prompt":"92 3/5 \u2212 10 1/3","answer":"82 4/15"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"12 3/4 + 24 1/3 + 16 1/2","answer":"53 7/12"},{"label":"b.","prompt":"93 3/5 \u2212 11 1/3","answer":"82 4/15"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"13 3/4 + 25 1/3 + 16 1/2","answer":"55 7/12"},{"label":"b.","prompt":"94 3/5 \u2212 12 1/3","answer":"82 4/15"}]}]}]}]};let state={pick:{},answers:{},checked:{},wrong:{},reveal:{}};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const items=()=>PRACTICE.sections.flatMap(s=>s.items);function active(i){return i.variants[state.pick[i.id]??0]}function norm(s){return String(s??'').toLowerCase().replace(/[\s,$.]/g,'').replace(/½/g,'1/2').replace(/¼/g,'1/4').replace(/¾/g,'3/4')}
function ok(i){const v=active(i),a=state.answers[i.id]||[];return (v.items||[]).every((x,n)=>{let want=Array.isArray(x.answer)?x.answer:[x.answer];return want.some(w=>norm(a[n])===norm(w))})}function visual(g){if(!g)return'';if(g.type==='bar'){let m=Math.max(...g.values),w=620,h=210;return `<div class="visual"><strong>${esc(g.title)}</strong><svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">${g.labels.map((x,i)=>{let x0=105+i*95,b=130*g.values[i]/m;return `<rect class="bar" x="${x0}" y="${180-b}" width="48" height="${b}"/><text x="${x0+24}" y="${196}" text-anchor="middle">${esc(x)}</text><text x="${x0+24}" y="${175-b}" text-anchor="middle">${g.values[i]}</text>`}).join('')}<line class="axis" x1="75" y1="180" x2="590" y2="180"/></svg></div>`}if(g.type==='dot'){let w=650;return `<div class="visual"><strong>${esc(g.title)}</strong><svg class="chart" viewBox="0 0 ${w} 220" width="100%">${g.labels.map((x,i)=>{let x0=75+i*125;return Array.from({length:g.values[i]},(_,j)=>`<circle class="dot" cx="${x0}" cy="${175-j*19}" r="7"/>`).join('')+`<text x="${x0}" y="205" text-anchor="middle">${esc(x)}</text>`}).join('')}</svg><small>Each dot = 1 event.</small></div>`}if(g.type==='circle'){let angles=[-90,-35,0,35,90],rays=g.points.map((p,i)=>{let a=angles[i]*Math.PI/180,x=170+105*Math.cos(a),y=130+105*Math.sin(a);return `<line class="ray" x1="170" y1="130" x2="${x}" y2="${y}"/><text x="${x}" y="${y-7}" text-anchor="middle">${p}</text>`}).join('');return `<div class="visual"><svg class="chart" viewBox="0 0 340 260" width="340"><circle class="circle" cx="170" cy="130" r="105"/>${rays}<circle cx="170" cy="130" r="5"/><text x="178" y="125">${esc(g.center)}</text></svg></div>`}if(g.type==='angle'){let a=g.degree*Math.PI/180,x=90+150*Math.cos(-a),y=170+150*Math.sin(-a);return `<div class="visual"><svg class="chart" viewBox="0 0 350 220" width="350"><line class="angle" x1="90" y1="170" x2="260" y2="170"/><line class="angle" x1="90" y1="170" x2="${x}" y2="${y}"/><circle cx="90" cy="170" r="5"/><text x="78" y="190">${esc(g.vertex)}</text><text x="262" y="190">${esc(g.right)}</text><text x="${x}" y="${y-6}">${esc(g.left)}</text></svg></div>`}return''}
function render(){title.textContent=PRACTICE.title;subtitle.textContent=PRACTICE.subtitle||'';app.innerHTML=PRACTICE.sections.map(s=>`<section class="section"><h2>${esc(s.title)}</h2><p class="directions">${esc(s.directions||'')}</p>${s.items.map(i=>{let v=active(i),checked=state.checked[i.id],good=checked&&ok(i),ans=state.answers[i.id]||[];return `<article class="item ${checked?(good?'correct':'missed'):''}"><div class="stem">${i.num}. ${esc(v.prompt||i.prompt||'')}</div>${visual(v.graphic)}${v.items.map((x,n)=>`<div class="subitem"><label>${esc(x.label||String.fromCharCode(97+n)+'.')} ${esc(x.prompt||'')}</label><input data-id="${i.id}" data-n="${n}" value="${esc(ans[n]||'')}" autocomplete="off"></div>`).join('')}<div class="actions"><button onclick="checkOne('${i.id}')">${checked?'Check Again':'Check'}</button>${checked?`<span class="feedback">${good?'Correct.':'Try again.'}</span>`:''}${state.reveal[i.id]?`<span class="answer">Answer: ${v.items.map(x=>Array.isArray(x.answer)?x.answer[0]:x.answer).join('; ')}</span>`:''}${(state.wrong[i.id]||0)>=5&&!state.reveal[i.id]?`<button onclick="state.reveal['${i.id}']=1;render()">Show Answer</button>`:''}</div></article>`}).join('')}</section>`).join('');document.querySelectorAll('input').forEach(e=>e.oninput=()=>{let a=state.answers[e.dataset.id]||[];a[+e.dataset.n]=e.value;state.answers[e.dataset.id]=a})}
function checkOne(id){let i=items().find(x=>x.id===id);state.checked[id]=1;if(!ok(i))state.wrong[id]=(state.wrong[id]||0)+1;else state.wrong[id]=0;render()}function checkAll(){items().forEach(i=>{state.checked[i.id]=1;if(!ok(i))state.wrong[i.id]=(state.wrong[i.id]||0)+1});let n=items().filter(ok).length;score.innerHTML=`<section class="section"><strong>Score: ${n} of ${items().length} numbered questions correct.</strong></section>`;render()}function resetQuiz(){state={pick:{},answers:{},checked:{},wrong:{},reveal:{}};items().forEach(i=>state.pick[i.id]=Math.floor(Math.random()*5));score.innerHTML='';render()}resetQuiz();</script></body></html>

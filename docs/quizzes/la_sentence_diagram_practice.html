<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Diagram Practice</title>
<style>
  :root {
    --bg: #eef2f5;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --ink: #1f2933;
    --muted: #667085;
    --line: #d8dee8;
    --blue: #2563a8;
    --green: #2f855a;
    --amber: #b7791f;
    --red: #c2413a;
    --teal: #087f8c;
    --plum: #7b3f76;
    --shadow: 0 2px 10px rgba(31,41,51,.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
  }

  button, select {
    font: inherit;
  }

  #app {
    min-height: 100vh;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: #263241;
    color: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
  }

  .topbar h1 {
    flex: 1;
    min-width: 180px;
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 4px 10px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    background: rgba(255,255,255,.08);
    white-space: nowrap;
    font-size: 13px;
  }

  .progress-track {
    width: 150px;
    height: 8px;
    background: rgba(255,255,255,.22);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #5ee0a0;
    transition: width .25s ease;
  }

  main {
    width: min(1180px, calc(100% - 28px));
    margin: 18px auto 56px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) auto auto auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }

  .nav-group, .button-group {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    padding: 7px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .08s;
  }

  .btn:hover { background: #f3f6fa; border-color: #b9c4d2; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1f5592; }
  .btn.success { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { background: #fff5f5; border-color: #f0b7b3; color: var(--red); }
  .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); }

  .exercise-select {
    min-height: 38px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    padding: 6px 10px;
    color: var(--ink);
    width: 100%;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel + .panel { margin-top: 14px; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: #fbfcfe;
  }

  .panel-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }

  .panel-body {
    padding: 14px;
  }

  .sentence-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    color: #243447;
    background: #e8eef7;
  }

  .badge.complete { background: #dff3e8; color: #276749; }

  .sentence {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
    padding: 14px;
    border: 1px solid #dbe3ed;
    border-radius: 8px;
    background: #f8fbff;
    min-height: 84px;
  }

  .word-token {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    min-height: 52px;
    padding: 7px 8px 6px;
    border: 1px solid #c8d3df;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    user-select: none;
  }

  .word-token:hover { border-color: var(--blue); }
  .word-token.virtual { border-style: dashed; color: #516173; background: #fbfbf7; }
  .word-token.active-role { outline: 2px solid rgba(37,99,168,.28); }

  .word-text {
    font-weight: 700;
    white-space: nowrap;
  }

  .role-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    max-width: 96px;
    min-height: 18px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 18px;
    padding: 1px 5px;
    border-radius: 999px;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0;
  }

  .role-toolbar {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .role-btn {
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    padding: 5px;
    text-align: center;
  }

  .role-btn strong {
    display: block;
    font-size: 13px;
  }

  .role-btn span {
    display: block;
    margin-top: 1px;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .role-btn.selected {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(37,99,168,.18);
    background: #f4f8ff;
  }

  .patterns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .pattern-btn {
    min-height: 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: 700;
  }

  .pattern-btn.selected {
    background: #e8f3ee;
    border-color: var(--green);
    color: #276749;
  }

  .mark-mode {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .toggle-control {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .toggle-control input {
    width: 16px;
    height: 16px;
    margin: 0;
  }

  .link-controls {
    display: grid;
    grid-template-columns: minmax(180px, 240px) 1fr auto;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }

  .link-select {
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    padding: 6px 9px;
  }

  .link-status {
    color: var(--muted);
    font-size: 13px;
  }

  .link-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    min-height: 32px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fbfcfe;
  }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 28px;
    border: 1px solid #bed0e3;
    border-radius: 999px;
    background: #f3f8ff;
    color: #244967;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
  }

  .link-remove {
    border: none;
    background: transparent;
    color: #8a2f2a;
    cursor: pointer;
    font-weight: 900;
    padding: 0 2px;
  }

  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 58px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f7f8fa;
  }

  .word-card {
    min-height: 30px;
    border: 1px solid #b8c3d1;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    padding: 5px 9px;
    cursor: grab;
    user-select: none;
    font-weight: 700;
  }

  .word-card.selected {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px rgba(183,121,31,.22);
    background: #fffaf0;
  }

  .word-card:active { cursor: grabbing; }

  .diagram-choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }

  .diagram-choice {
    min-height: 106px;
    border: 1px solid #b8c3d1;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    padding: 5px;
  }

  .diagram-choice.selected {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(47,111,166,.22);
    background: #f7fbff;
  }

  .diagram-choice svg {
    display: block;
    width: 100%;
    height: 96px;
    pointer-events: none;
  }

  .diagram-choice .target-hit {
    display: none;
  }

  .diagram-workspace {
    display: grid;
    gap: 12px;
  }

  .canvas-wrap {
    min-width: 0;
  }

  .diagram-canvas {
    width: 100%;
    height: 430px;
    border: 1px solid #b8c4d2;
    border-radius: 8px;
    background:
      linear-gradient(#edf1f6 1px, transparent 1px),
      linear-gradient(90deg, #edf1f6 1px, transparent 1px),
      #fff;
    background-size: 24px 24px;
    touch-action: none;
  }

  .diagram-target {
    cursor: pointer;
    pointer-events: all;
  }

  .diagram-target.selected .target-hit,
  .diagram-target.drop-hover .target-hit {
    fill: rgba(183,121,31,.14);
    stroke: var(--amber);
    stroke-width: 3;
  }

  .diagram-target.drop-hover .diagram-line,
  .diagram-target.drop-hover rect:not(.target-hit) {
    stroke: var(--amber);
    stroke-width: 3;
  }

  .diagram-target.filled .target-hit {
    stroke-width: 3;
  }

  .target-hit {
    fill: transparent;
    stroke: transparent;
    stroke-width: 18;
    pointer-events: all;
  }

  .diagram-line {
    stroke: #1f2933;
    stroke-width: 2.4;
    stroke-linecap: square;
  }

  .diagram-divider {
    stroke: #1f2933;
    stroke-width: 2.4;
    stroke-linecap: square;
  }

  .diagram-branch {
    stroke: #1f2933;
    stroke-width: 2;
    stroke-linecap: square;
    fill: none;
  }

  .diagram-conj-guide {
    stroke: #667085;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-dasharray: 4 5;
    fill: none;
  }

  .diagram-text {
    font: 700 14px "Segoe UI", Tahoma, Arial, sans-serif;
    fill: #111827;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .diagram-notice {
    fill: #667085;
    font-weight: 700;
  }

  .diagram-modifier-text {
    font-size: 13px;
    text-anchor: middle;
  }

  .diagram-canvas.answer-diagram {
    height: 360px;
  }

  .feedback {
    display: grid;
    gap: 8px;
  }

  .message {
    border-radius: 7px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: #f8fafc;
  }

  .message.good {
    border-color: #b7dfc8;
    background: #f0fbf5;
    color: #276749;
  }

  .message.bad {
    border-color: #f0c0ba;
    background: #fff7f6;
    color: #9f2f2a;
  }

  .message.warn {
    border-color: #ecd39a;
    background: #fffaf0;
    color: #805d16;
  }

  .feedback-list {
    margin: 8px 0 0;
    padding-left: 20px;
  }

  .feedback-list li + li { margin-top: 4px; }

  .progress-history {
    display: grid;
    gap: 10px;
  }

  .progress-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .progress-pill {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #f8fafc;
    padding: 7px 8px;
    color: var(--muted);
    font-size: 11px;
  }

  .progress-pill strong {
    display: block;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.1;
  }

  .progress-list {
    display: grid;
    gap: 6px;
    max-height: 420px;
    overflow: auto;
    padding-right: 2px;
  }

  .progress-row {
    width: 100%;
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    padding: 7px 8px;
    cursor: pointer;
  }

  .progress-row:hover {
    border-color: #b9c4d2;
    background: #f8fbff;
  }

  .progress-row.current {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(37,99,168,.12);
  }

  .progress-row.correct { background: #f0fbf5; }
  .progress-row.started { background: #fffaf0; }
  .progress-row.not-started { background: #f8fafc; color: var(--muted); }

  .progress-dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: #aeb9c7;
    margin-top: 5px;
  }

  .progress-row.correct .progress-dot { background: var(--green); }
  .progress-row.started .progress-dot { background: var(--amber); }

  .progress-row-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 800;
  }

  .progress-row-meta {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  .answer-panel {
    display: none;
  }

  .answer-panel.open {
    display: block;
  }

  .answer-line {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .answer-token {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 7px;
    border-radius: 6px;
    background: #f4f6f8;
  }

  .answer-diagram {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }

  .answer-slot {
    display: grid;
    grid-template-columns: 145px minmax(0, 1fr);
    gap: 8px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fbfcfe;
  }

  .answer-slot strong {
    color: #465464;
  }

  .tip-box {
    margin-top: 12px;
    border-left: 4px solid var(--teal);
    background: #f1fbfc;
    padding: 10px 12px;
    color: #24535a;
  }

  .role-s { background: var(--blue); }
  .role-av { background: var(--green); }
  .role-lv { background: var(--teal); }
  .role-bv { background: #596477; }
  .role-do { background: var(--amber); }
  .role-pn { background: var(--plum); }
  .role-pa { background: #a34863; }
  .role-adj { background: #6b7d2a; }
  .role-adv { background: #8a5c1a; }
  .role-conj { background: #4b6f91; }
  .role-pp { background: #6b7280; }
  .role-prep { background: #4f46a5; }
  .role-op { background: #9b4d2f; }

  @media (max-width: 900px) {
    .topbar { position: static; flex-wrap: wrap; }
    .toolbar { grid-template-columns: 1fr; }
    .layout { grid-template-columns: 1fr; }
    .role-toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .link-controls { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    main { width: calc(100% - 16px); margin-top: 10px; }
    .role-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { width: 100%; justify-content: space-between; }
    .progress-track { flex: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Sentence Diagram Practice</h1>
    <div class="stat"><span id="completeText">0/0 complete</span><div class="progress-track"><div id="completeBar" class="progress-fill"></div></div></div>
    <button class="btn ghost" id="resetProgressBtn" type="button">Reset Progress</button>
  </header>

  <main>
    <div class="toolbar">
      <select id="exerciseSelect" class="exercise-select" aria-label="Exercise"></select>
      <div class="nav-group">
        <button class="btn" id="prevBtn" type="button">Previous</button>
        <button class="btn" id="nextBtn" type="button">Next</button>
      </div>
      <div class="button-group">
        <button class="btn" id="tryAgainBtn" type="button">Try Again</button>
        <button class="btn" id="showAnswerBtn" type="button">Show Answer</button>
      </div>
      <div class="sentence-meta" id="exerciseMeta"></div>
    </div>

    <div class="layout">
      <section>
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">1. Mark the Sentence</h2>
            <button class="btn primary" id="checkMarkingBtn" type="button">Check Marking</button>
          </div>
          <div class="panel-body">
            <div id="sentenceTokens" class="sentence"></div>
            <div class="role-toolbar" id="roleToolbar"></div>
            <div class="patterns" id="patternButtons"></div>
            <div class="mark-mode">
              <button class="btn primary" id="roleModeBtn" type="button">Mark Roles</button>
              <button class="btn" id="linkModeBtn" type="button">Link Words</button>
              <label class="toggle-control">
                <input id="ignorePrepPhrasesToggle" type="checkbox">
                <span>Ignore prep. phrases</span>
              </label>
            </div>
            <div class="link-controls">
              <select id="linkTypeSelect" class="link-select" aria-label="Relationship type"></select>
              <div id="linkStatus" class="link-status">Use Link Words to connect modifiers and complements.</div>
              <button class="btn danger" id="clearLinksBtn" type="button">Clear Links</button>
            </div>
            <div id="linkList" class="link-list"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">2. Build the Diagram</h2>
            <div class="button-group">
              <button class="btn" id="returnCardBtn" type="button">Clear Target</button>
              <button class="btn danger" id="clearConnectionsBtn" type="button">Reset Diagram</button>
              <button class="btn primary" id="checkDiagramBtn" type="button">Check Diagram</button>
            </div>
          </div>
          <div class="panel-body">
            <div id="diagramChoices" class="diagram-choices" aria-label="Diagram choices"></div>
            <div id="modifierChoices" class="diagram-choices" aria-label="Modifier pattern choices"></div>
            <div id="wordBank" class="word-bank" aria-label="Diagram word bank"></div>
            <div style="height:12px"></div>
            <div class="diagram-workspace">
              <div class="canvas-wrap">
                <svg id="diagramCanvas" class="diagram-canvas" viewBox="0 0 760 430" role="img" aria-label="Sentence diagram canvas"></svg>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside>
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Feedback</h2>
          </div>
          <div class="panel-body">
            <div id="feedback" class="feedback">
              <div class="message">Choose roles, mark the pattern, then build the diagram.</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Progress</h2>
          </div>
          <div class="panel-body">
            <div id="progressHistory" class="progress-history"></div>
          </div>
        </div>

        <div class="panel answer-panel" id="answerPanel">
          <div class="panel-header">
            <h2 class="panel-title">Correct Answer</h2>
          </div>
          <div class="panel-body" id="answerBody"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<script>
const STORAGE_KEY = "sentence_diagram_practice_v1";

const ROLES = [
  { id: "S", label: "Subject", className: "role-s" },
  { id: "AV", label: "Action Verb", className: "role-av" },
  { id: "LV", label: "Linking Verb", className: "role-lv" },
  { id: "BV", label: "Being Verb", className: "role-bv" },
  { id: "DO", label: "Direct Object", className: "role-do" },
  { id: "PN", label: "Pred. Nom.", className: "role-pn" },

<!doctype html><html><head><meta charset="utf-8"><title>Arithmetic 4 — Quiz 33 Practice</title><style>
:root{--ink:#20242b;--line:#d7dce3;--blue:#175f9b;--good:#237241;--bad:#a5342a;--paper:#fff;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial,sans-serif;color:var(--ink);line-height:1.4}.wrap{max-width:1050px;margin:auto;padding:20px}.top,.tools,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.top h1{font-size:25px;margin:0}.sub{color:#5f6976;margin:4px 0 0}button{font:inherit;background:#fff;border:1px solid #b9c3cf;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.section{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:15px;margin:15px 0}.section h2{font-size:18px;margin:0 0 3px}.directions{color:#5f6976;margin:0 0 10px}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-of-type{border:0}.stem{font-weight:700;margin-bottom:8px}.subitem{display:grid;grid-template-columns:1fr minmax(145px,330px);gap:10px;align-items:center;margin:8px 0}.subitem label{white-space:pre-wrap}.subitem input,input{font:inherit;border:1px solid #aab6c4;border-radius:5px;padding:7px;width:100%}.visual{border:1px solid #d5dce4;border-radius:8px;background:#fbfdff;padding:10px;margin:10px 0;overflow:auto}.feedback{font-weight:700}.correct .feedback{color:var(--good)}.missed .feedback{color:var(--bad)}.answer{background:#fff4dc;border:1px solid #ebd3a3;border-radius:6px;padding:8px;margin-top:8px}.chart text{font:13px Arial}.chart .axis{stroke:#344150}.chart .grid{stroke:#dfe5eb}.chart .bar{fill:#4c83b2}.chart .dot{fill:#316f9f}.chart .circle{fill:none;stroke:#344150;stroke-width:2}.chart .ray{stroke:#344150;stroke-width:2}.chart .angle{stroke:#344150;stroke-width:3}@media(max-width:650px){.subitem{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="tools"><button class="primary" onclick="checkAll()">Check All</button><button onclick="resetQuiz()">Reset / New Version</button></div></div><div id="score"></div><div id="app"></div></main><script>const PRACTICE={"title":"Arithmetic 4 \u2014 Quiz 33 Practice","subtitle":"Lesson 162 \u2022 Five randomly selected practice versions","source":{"pdf":"abeka_math_docs.pdf"},"sections":[{"id":"operations","title":"1. Write the sum or difference.","directions":"Write each answer in simplest form.","items":[{"id":"q1","num":1,"variants":[{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"2.35 + 3.10 + 4.06 + 1.49","answer":"11.00"},{"label":"b.","prompt":"4 + 22 + 5 1/3","answer":"31 1/3"},{"label":"c.","prompt":"3 1/5 \u2212 3/4","answer":"2 9/20"},{"label":"d.","prompt":"23.4 \u2212 1.75","answer":"21.65"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"3.35 + 3.10 + 4.06 + 1.49","answer":"12.00"},{"label":"b.","prompt":"4 1/3 + 22 + 5 2/3","answer":"32"},{"label":"c.","prompt":"3 2/5 \u2212 1","answer":"2 2/5"},{"label":"d.","prompt":"24.4 \u2212 2.00","answer":"22.40"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"4.35 + 3.10 + 4.06 + 1.49","answer":"13.00"},{"label":"b.","prompt":"4 2/3 + 22 + 6","answer":"32 2/3"},{"label":"c.","prompt":"3 3/5 \u2212 1 1/4","answer":"2 7/20"},{"label":"d.","prompt":"25.4 \u2212 2.25","answer":"23.15"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"5.35 + 3.10 + 4.06 + 1.49","answer":"14.00"},{"label":"b.","prompt":"5 + 22 + 6 1/3","answer":"33 1/3"},{"label":"c.","prompt":"3 4/5 \u2212 1 1/2","answer":"2 3/10"},{"label":"d.","prompt":"26.4 \u2212 2.50","answer":"23.90"}]},{"prompt":"Write the sum or difference.","items":[{"label":"a.","prompt":"6.35 + 3.10 + 4.06 + 1.49","answer":"15.00"},{"label":"b.","prompt":"5 1/3 + 22 + 6 2/3","answer":"34"},{"label":"c.","prompt":"4 \u2212 1 3/4","answer":"2 1/4"},{"label":"d.","prompt":"27.4 \u2212 2.75","answer":"24.65"}]}]}]},{"id":"equations","title":"2. Solve and check each equation.","directions":"Type the value of the variable.","items":[{"id":"q2","num":2,"variants":[{"prompt":"Solve and check each equation.","items":[{"label":"a.","prompt":"a \u2212 (30 \u00f7 6) = 70","answer":"75"},{"label":"b.","prompt":"b + (72 \u00f7 9) = 400","answer":"392"},{"label":"c.","prompt":"c \u2212 (10 \u00d7 6) = (8 \u00d7 11)","answer":"148"},{"label":"d.","prompt":"d + (6 \u00d7 4) = 28 + 5","answer":"9"}]},{"prompt":"Solve and check each equation.","items":[{"label":"a.","prompt":"a \u2212 (36 \u00f7 6) = 73","answer":"79"},{"label":"b.","prompt":"b + (81 \u00f7 9) = 405","answer":"396"},{"label":"c.","prompt":"c \u2212 (11 \u00d7 6) = (9 \u00d7 11)","answer":"165"},{"label":"d.","prompt":"d + (7 \u00d7 4) = 29 + 5","answer":"6"}]},{"prompt":"Solve and check each equation.","items":[{"label":"a.","prompt":"a \u2212 (42 \u00f7 6) = 76","answer":"83"},{"label":"b.","prompt":"b + (90 \u00f7 9) = 410","answer":"400"},{"label":"c.","prompt":"c \u2212 (12 \u00d7 6) = (10 \u00d7 11)","answer":"182"},{"label":"d.","prompt":"d + (8 \u00d7 4) = 30 + 5","answer":"3"}]},{"prompt":"Solve and check each equation.","items":[{"label":"a.","prompt":"a \u2212 (48 \u00f7 6) = 79","answer":"87"},{"label":"b.","prompt":"b + (99 \u00f7 9) = 415","answer":"404"},{"label":"c.","prompt":"c \u2212 (13 \u00d7 6) = (11 \u00d7 11)","answer":"199"},{"label":"d.","prompt":"d + (9 \u00d7 4) = 31 + 5","answer":"0"}]},{"prompt":"Solve and check each equation.","items":[{"label":"a.","prompt":"a \u2212 (54 \u00f7 6) = 82","answer":"91"},{"label":"b.","prompt":"b + (108 \u00f7 9) = 420","answer":"408"},{"label":"c.","prompt":"c \u2212 (14 \u00d7 6) = (12 \u00d7 11)","answer":"216"},{"label":"d.","prompt":"d + (10 \u00d7 4) = 32 + 5","answer":"-3"}]}]}]},{"id":"data","title":"3\u20134. Read the dot plot.","directions":"Use the graph for both numbered questions.","items":[{"id":"q3","num":3,"variants":[{"prompt":"Find the range, mode, mean, and median of the dot plot.","items":[{"label":"a.","prompt":"Range","answer":"7"},{"label":"b.","prompt":"Mode","answer":"3"},{"label":"c.","prompt":"Mean","answer":"4"},{"label":"d.","prompt":"Median","answer":"3"}],"graphic":{"type":"dot","title":"Parker Family Activities for June","labels":["Games","Library visits","Practices","Music lessons","Birthdays"],"values":[1,3,8,5,3]}},{"prompt":"Find the range, mode, mean, and median of the dot plot.","items":[{"label":"a.","prompt":"Range","answer":"7"},{"label":"b.","prompt":"Mode","answer":"3"},{"label":"c.","prompt":"Mean","answer":"4"},{"label":"d.","prompt":"Median","answer":"3"}],"graphic":{"type":"dot","title":"Rivera Family Activities for June","labels":["Trips","Appointments","Club meetings","Rehearsals","Parties"],"values":[3,8,5,3,1]}},{"prompt":"Find the range, mode, mean, and median of the dot plot.","items":[{"label":"a.","prompt":"Range","answer":"7"},{"label":"b.","prompt":"Mode","answer":"3"},{"label":"c.","prompt":"Mean","answer":"4"},{"label":"d.","prompt":"Median","answer":"3"}],"graphic":{"type":"dot","title":"Mason Family Activities for June","labels":["Movies","Picnics","Practices","Programs","Birthdays"],"values":[8,5,3,1,3]}},{"prompt":"Find the range, mode, mean, and median of the dot plot.","items":[{"label":"a.","prompt":"Range","answer":"7"},{"label":"b.","prompt":"Mode","answer":"3"},{"label":"c.","prompt":"Mean","answer":"4"},{"label":"d.","prompt":"Median","answer":"3"}],"graphic":{"type":"dot","title":"Bennett Family Activities for June","labels":["Hikes","Lessons","Practices","Recitals","Guests"],"values":[5,3,1,3,8]}},{"prompt":"Find the range, mode, mean, and median of the dot plot.","items":[{"label":"a.","prompt":"Range","answer":"7"},{"label":"b.","prompt":"Mode","answer":"3"},{"label":"c.","prompt":"Mean","answer":"4"},{"label":"d.","prompt":"Median","answer":"3"}],"graphic":{"type":"dot","title":"Taylor Family Activities for June","labels":["Walks","Chores","Practices","Classes","Celebrations"],"values":[3,1,3,8,5]}}]},{"id":"q4","num":4,"variants":[{"prompt":"Use the dot plot above to answer each question.","items":[{"label":"a.","prompt":"How many games and birthdays are planned?","answer":"4"},{"label":"b.","prompt":"The family has two extra music lessons to attend. How many music lessons will they attend?","answer":"7"},{"label":"c.","prompt":"The Green family has twice as many practices as this family. How many do they have?","answer":"16"}],"graphic":{"type":"dot","title":"Parker Family Activities for June","labels":["Games","Library visits","Practices","Music lessons","Birthdays"],"values":[1,3,8,5,3]}},{"prompt":"Use the dot plot above to answer each question.","items":[{"label":"a.","prompt":"How many trips and parties are planned?","answer":"4"},{"label":"b.","prompt":"The family has two extra rehearsals to attend. How many rehearsals will they attend?","answer":"5"},{"label":"c.","prompt":"The Green family has twice as many club meetings as this family. How many do they have?","answer":"10"}],"graphic":{"type":"dot","title":"Rivera Family Activities for June","labels":["Trips","Appointments","Club meetings","Rehearsals","Parties"],"values":[3,8,5,3,1]}},{"prompt":"Use the dot plot above to answer each question.","items":[{"label":"a.","prompt":"How many movies and birthdays are planned?","answer":"11"},{"label":"b.","prompt":"The family has two extra programs to attend. How many programs will they attend?","answer":"3"},{"label":"c.","prompt":"The Green family has twice as many practices as this family. How many do they have?","answer":"6"}],"graphic":{"type":"dot","title":"Mason Family Activities for June","labels":["Movies","Picnics","Practices","Programs","Birthdays"],"values":[8,5,3,1,3]}},{"prompt":"Use the dot plot above to answer each question.","items":[{"label":"a.","prompt":"How many hikes and guests are planned?","answer":"13"},{"label":"b.","prompt":"The family has two extra recitals to attend. How many recitals will they attend?","answer":"5"},{"label":"c.","prompt":"The Green family has twice as many practices as this family. How many do they have?","answer":"2"}],"graphic":{"type":"dot","title":"Bennett Family Activities for June","labels":["Hikes","Lessons","Practices","Recitals","Guests"],"values":[5,3,1,3,8]}},{"prompt":"Use the dot plot above to answer each question.","items":[{"label":"a.","prompt":"How many walks and celebrations are planned?","answer":"8"},{"label":"b.","prompt":"The family has two extra classes to attend. How many classes will they attend?","answer":"10"},{"label":"c.","prompt":"The Green family has twice as many practices as this family. How many do they have?","answer":"6"}],"graphic":{"type":"dot","title":"Taylor Family Activities for June","labels":["Walks","Chores","Practices","Classes","Celebrations"],"values":[3,1,3,8,5]}}]}]}]};let state={pick:{},answers:{},checked:{},wrong:{},reveal:{}};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const items=()=>PRACTICE.sections.flatMap(s=>s.items);function active(i){return i.variants[state.pick[i.id]??0]}function norm(s){return String(s??'').toLowerCase().replace(/[\s,$.]/g,'').replace(/½/g,'1/2').replace(/¼/g,'1/4').replace(/¾/g,'3/4')}
function ok(i){const v=active(i),a=state.answers[i.id]||[];return (v.items||[]).every((x,n)=>{let want=Array.isArray(x.answer)?x.answer:[x.answer];return want.some(w=>norm(a[n])===norm(w))})}function visual(g){if(!g)return'';if(g.type==='bar'){let m=Math.max(...g.values),w=620,h=210;return `<div class="visual"><strong>${esc(g.title)}</strong><svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">${g.labels.map((x,i)=>{let x0=105+i*95,b=130*g.values[i]/m;return `<rect class="bar" x="${x0}" y="${180-b}" width="48" height="${b}"/><text x="${x0+24}" y="${196}" text-anchor="middle">${esc(x)}</text><text x="${x0+24}" y="${175-b}" text-anchor="middle">${g.values[i]}</text>`}).join('')}<line class="axis" x1="75" y1="180" x2="590" y2="180"/></svg></div>`}if(g.type==='dot'){let w=650;return `<div class="visual"><strong>${esc(g.title)}</strong><svg class="chart" viewBox="0 0 ${w} 220" width="100%">${g.labels.map((x,i)=>{let x0=75+i*125;return Array.from({length:g.values[i]},(_,j)=>`<circle class="dot" cx="${x0}" cy="${175-j*19}" r="7"/>`).join('')+`<text x="${x0}" y="205" text-anchor="middle">${esc(x)}</text>`}).join('')}</svg><small>Each dot = 1 event.</small></div>`}if(g.type==='circle'){let angles=[-90,-35,0,35,90],rays=g.points.map((p,i)=>{let a=angles[i]*Math.PI/180,x=170+105*Math.cos(a),y=130+105*Math.sin(a);return `<line class="ray" x1="170" y1="130" x2="${x}" y2="${y}"/><text x="${x}" y="${y-7}" text-anchor="middle">${p}</text>`}).join('');return `<div class="visual"><svg class="chart" viewBox="0 0 340 260" width="340"><circle class="circle" cx="170" cy="130" r="105"/>${rays}<circle cx="170" cy="130" r="5"/><text x="178" y="125">${esc(g.center)}</text></svg></div>`}if(g.type==='angle'){let a=g.degree*Math.PI/180,x=90+150*Math.cos(-a),y=170+150*Math.sin(-a);return `<div class="visual"><svg class="chart" viewBox="0 0 350 220" width="350"><line class="angle" x1="90" y1="170" x2="260" y2="170"/><line class="angle" x1="90" y1="170" x2="${x}" y2="${y}"/><circle cx="90" cy="170" r="5"/><text x="78" y="190">${esc(g.vertex)}</text><text x="262" y="190">${esc(g.right)}</text><text x="${x}" y="${y-6}">${esc(g.left)}</text></svg></div>`}return''}
function render(){title.textContent=PRACTICE.title;subtitle.textContent=PRACTICE.subtitle||'';app.innerHTML=PRACTICE.sections.map(s=>`<section class="section"><h2>${esc(s.title)}</h2><p class="directions">${esc(s.directions||'')}</p>${s.items.map(i=>{let v=active(i),checked=state.checked[i.id],good=checked&&ok(i),ans=state.answers[i.id]||[];return `<article class="item ${checked?(good?'correct':'missed'):''}"><div class="stem">${i.num}. ${esc(v.prompt||i.prompt||'')}</div>${visual(v.graphic)}${v.items.map((x,n)=>`<div class="subitem"><label>${esc(x.label||String.fromCharCode(97+n)+'.')} ${esc(x.prompt||'')}</label><input data-id="${i.id}" data-n="${n}" value="${esc(ans[n]||'')}" autocomplete="off"></div>`).join('')}<div class="actions"><button onclick="checkOne('${i.id}')">${checked?'Check Again':'Check'}</button>${checked?`<span class="feedback">${good?'Correct.':'Try again.'}</span>`:''}${state.reveal[i.id]?`<span class="answer">Answer: ${v.items.map(x=>Array.isArray(x.answer)?x.answer[0]:x.answer).join('; ')}</span>`:''}${(state.wrong[i.id]||0)>=5&&!state.reveal[i.id]?`<button onclick="state.reveal['${i.id}']=1;render()">Show Answer</button>`:''}</div></article>`}).join('')}</section>`).join('');document.querySelectorAll('input').forEach(e=>e.oninput=()=>{let a=state.answers[e.dataset.id]||[];a[+e.dataset.n]=e.value;state.answers[e.dataset.id]=a})}
function checkOne(id){let i=items().find(x=>x.id===id);state.checked[id]=1;if(!ok(i))state.wrong[id]=(state.wrong[id]||0)+1;else state.wrong[id]=0;render()}function checkAll(){items().forEach(i=>{state.checked[i.id]=1;if(!ok(i))state.wrong[i.id]=(state.wrong[i.id]||0)+1});let n=items().filter(ok).length;score.innerHTML=`<section class="section"><strong>Score: ${n} of ${items().length} numbered questions correct.</strong></section>`;render()}function resetQuiz(){state={pick:{},answers:{},checked:{},wrong:{},reveal:{}};items().forEach(i=>state.pick[i.id]=Math.floor(Math.random()*5));score.innerHTML='';render()}resetQuiz();</script></body></html>

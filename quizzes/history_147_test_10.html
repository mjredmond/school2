":"auto","answer":"Oklahoma City Bombing","choices":["Cuban invasion of Grenada","Oklahoma City Bombing","Operation Desert Storm","Persian Gulf War"],"accept":["Oklahoma City bombing"]},{"num":"14","page":"408","question":"Who was the first woman to serve as a Supreme Court justice?","type":"auto","answer":"Sandra Day O'Connor","choices":["Madeleine Albright","Hillary Clinton","Ruth Bader Ginsburg","Sandra Day O'Connor"],"accept":["O'Connor","Justice Sandra Day O'Connor"]},{"num":"15","page":"439","question":"The World Wide Web was the first what?","type":"auto","answer":"internet browser","choices":["DVD","internet browser","MP3","space station"],"accept":["Internet browser","Internet Browser","web browser"]},{"num":"16","page":"419","question":"Who made the first personal computer?","type":"auto","answer":"IBM","choices":["Bill Gates","IBM","Roy Tomlinson","Steve Jobs"],"accept":["International Business Machines"]},{"num":"17","page":"416","question":"What was designed to be a defensive system to destroy missiles before they reached the United States?","type":"auto","answer":"Strategic Defense Initiative","choices":["B-1 bomber","Peacekeeper missile","Stealth bomber","Strategic Defense Initiative"],"accept":["SDI"]},{"num":"18","page":"416","question":"What was the first space shuttle?","type":"auto","answer":"Columbia","choices":["Atlantis","Challenger","Columbia","Mir"],"accept":["Space Shuttle Columbia"]},{"num":"19","page":"438","question":"What was sent to the surface of Mars to gather data and send photos back to Earth?","type":"auto","answer":"Mars Sojourner","choices":["Apollo 13","Mars Pathfinder","Mars Sojourner","Voyager 1"],"accept":["Sojourner","Mars Pathfinder Sojourner"]},{"num":"20","page":"437","question":"Who led the terrorist group al-Qaeda?","type":"auto","answer":"Osama bin Laden","choices":["Osama bin Laden","Mikhail Gorbachev","Saddam Hussein","Manuel Noriega"],"accept":["bin Laden","Usama bin Laden"]},{"num":"21","page":"420","question":"What event resulted in a massive oil spill?","type":"auto","answer":"Exxon Valdez hitting a reef","choices":["Exxon Valdez hitting a reef","Mount St. Helens eruption","San Francisco earthquake of 1989","Three Mile Island accident"],"accept":["Exxon Valdez","Exxon Valdez oil spill"]},{"num":"22","page":"427","question":"Who was Chairman of the Joint Chiefs of Staff during the Persian Gulf War?","type":"auto","answer":"Colin Powell","choices":["Colin Powell","Norman Schwarzkopf","George H. W. Bush","Jerry Falwell"],"accept":["Powell","General Colin Powell"]},{"num":"23","page":"427","question":"Who led troops during the Persian Gulf War?","type":"auto","answer":"Norman Schwarzkopf","choices":["Norman Schwarzkopf","Colin Powell","George H. W. Bush","James Dobson"],"accept":["Schwarzkopf","General Norman Schwarzkopf"]},{"num":"24","page":"406","question":"Who was the founder of the Moral Majority?","type":"auto","answer":"Jerry Falwell","choices":["Jerry Falwell","James Dobson","Richard Nixon","Ronald Reagan"],"accept":["Falwell"]},{"num":"25","page":"388–389","question":"Which president resigned after the Watergate Affair?","type":"auto","answer":"Richard Nixon","choices":["Richard Nixon","Gerald Ford","Jimmy Carter","Ronald Reagan"],"accept":["Nixon","President Nixon","Richard M. Nixon"]},{"num":"26","page":"394","question":"Which president withdrew the United States from the 1980 Olympics?","type":"auto","answer":"Jimmy Carter","choices":["Jimmy Carter","Ronald Reagan","George H. W. Bush","Richard Nixon"],"accept":["Carter","President Carter","James Carter"]},{"num":"27","page":"407","question":"Who was known as the “Great Communicator”?","type":"auto","answer":"Ronald Reagan","choices":["Ronald Reagan","Richard Nixon","Gerald Ford","Jimmy Carter"],"accept":["Reagan","President Reagan"]},{"num":"28","page":"427","question":"Who was president during the Persian Gulf War?","type":"auto","answer":"George H. W. Bush","choices":["George H. W. Bush","Ronald Reagan","Jimmy Carter","Bill Clinton"],"accept":["George Bush","Bush","President George H. W. Bush","George Herbert Walker Bush"]},{"num":"29","page":"533–535","question":"Be able to identify Illinois on a map.","type":"map"},{"num":"30","page":"533–535","question":"Be able to identify Indiana on a map.","type":"map"},{"num":"31","page":"533–535","question":"Be able to identify Missouri on a map.","type":"map"},{"num":"32","page":"533–535","question":"Be able to identify Nebraska on a map.","type":"map"},{"num":"33","page":"533–535","question":"Be able to identify New Mexico on a map.","type":"map"},{"num":"34","page":"533–535","question":"Be able to identify Oklahoma on a map.","type":"map"},{"num":"35","page":"533–535","question":"Be able to identify Wisconsin on a map.","type":"map"},{"num":"36","page":"550–551","question":"What is the capital of Arizona?","type":"auto","answer":"Phoenix","choices":["Phoenix","Tucson","Austin","Santa Fe"]},{"num":"37","page":"550–551","question":"What is the capital of Iowa?","type":"auto","answer":"Des Moines","choices":["Des Moines","Cedar Rapids","Lincoln","Bismarck"]},{"num":"38","page":"550–551","question":"What is the capital of Michigan?","type":"auto","answer":"Lansing","choices":["Lansing","Detroit","Columbus","St. Paul"]},{"num":"39","page":"550–551","question":"What is the capital of Minnesota?","type":"auto","answer":"St. Paul","choices":["St. Paul","Minneapolis","Des Moines","Pierre"],"accept":["Saint Paul"]},{"num":"40","page":"550–551","question":"What is the capital of Nebraska?","type":"auto","answer":"Lincoln","choices":["Lincoln","Omaha","Topeka","Bismarck"]},{"num":"41","page":"550–551","question":"What is the capital of Ohio?","type":"auto","answer":"Columbus","choices":["Columbus","Cleveland","Cincinnati","Lansing"]},{"num":"42","page":"550–551","question":"What is the capital of South Dakota?","type":"auto","answer":"Pierre","choices":["Pierre","Rapid City","Bismarck","Sioux Falls"]},{"num":"43","page":"550–551","question":"What is the capital of Texas?","type":"auto","answer":"Austin","choices":["Austin","Dallas","Houston","Phoenix"]},{"num":"44","page":"420–421","question":"Explain the results of the Exxon Valdez disaster, including what Congress did because of the disaster. (Give at least 4 facts with explanation in 4–6 complete sentences.)","type":"written"}]}</script><script>
const STUDY=JSON.parse(document.getElementById('study-data').textContent),VERSION='392a666372b0',KEY='abeka-practice:'+STUDY.id+':'+VERSION,SKIP_PASSWORD='abc123';
const fresh=()=>({answers:{},reviews:{},stats:{study:{},quiz:{}},quiz:{queue:[],current:null,started:false},tough:{queue:[],current:null,started:false,cleared:[]}});let state=fresh();
function load(){try{const value=JSON.parse(localStorage.getItem(KEY));if(value&&value.stats&&value.stats.study&&value.stats.quiz)state={...fresh(),...value,stats:{...fresh().stats,...value.stats}}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function byNum(n){return STUDY.questions.find(q=>q.num===String(n))}function auto(){return STUDY.questions.filter(q=>q.type==='auto')}function stat(mode,n){const group=state.stats[mode],s=group[n]||(group[n]={correct:0,wrong:0,format:0,spelling:0});return s}function mastered(q){return (stat('study',q.num).correct||0)>0}function unlocked(){return STUDY.questions.every(q=>q.type==='auto'?mastered(q):state.reviews[q.num])}
function norm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}function distance(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function accepted(q){return [q.answer].concat(q.accept||[])}function caseNorm(s){return s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'')}function dropArticle(s){return s.replace(/^\s*(?:a|an|the)\s+/i,'')}function grade(q,value){const all=accepted(q);if(all.some(x=>value===x))return 'correct';const c=caseNorm(value);if(all.some(x=>c===caseNorm(x)))return 'correct';const ca=caseNorm(dropArticle(value));if(ca&&all.some(x=>ca===caseNorm(dropArticle(x))))return 'correct';const a=norm(value);if(all.some(x=>a===norm(x)))return 'format';let best='wrong';for(const x of all){const b=norm(x);const threshold=b.length<=4?1:b.length<=10?2:Math.min(4,Math.floor(b.length*.2));if(a&&distance(a,b)<=threshold){best='spelling';break}}return best}function text(result){return {correct:'Correct — mastered!',format:'Formatting error — check capitalization, punctuation, spacing, or accents.',spelling:'Spelling error — check the spelling carefully.',wrong:'Not correct. Try again.'}[result]}function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function feedback(el,result){el.className='feedback '+result;el.textContent=text(result)}function controls(){const ready=unlocked(),button=document.getElementById('quizMode');button.disabled=!ready;button.title=ready?'':'Master every study item first.'}function studyCount(){return auto().filter(mastered).length}
function renderStudy(){controls();const root=document.getElementById('content');root.innerHTML='';const status=document.createElement('div');status.className=unlocked()?'status mastered':'status lock';status.textContent=unlocked()?'Study phase complete. Multiple-choice quiz is unlocked.':'Mastered '+studyCount()+' of '+auto().length+' recall questions. Also confirm every map/written prompt.';root.append(status);STUDY.questions.forEach(q=>{const c=document.createElement('section');c.className='card '+(q.type==='auto'&&mastered(q)?'mastered':state.reviews[q.num]?'reviewed':'');c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');if(q.type==='auto'){if(mastered(q)){c.innerHTML+='<p class="correct"><strong>Mastered</strong></p>'}else{const input=document.createElement('input');input.type='text';input.value=state.answers[q.num]||'';input.setAttribute('aria-label','Answer for question '+q.num);input.oninput=()=>{state.answers[q.num]=input.value;save()};const submit=document.createElement('button');submit.textContent='Check answer';const f=document.createElement('div');const check=()=>{if(!input.value){f.className='feedback wrong';f.textContent='Enter an answer first.';return}const result=grade(q,input.value);stat('study',q.num)[result]++;save();feedback(f,result);if(result==='correct')setTimeout(renderStudy,450)};submit.onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};c.append(input,submit,f)}}else{const note=document.createElement('p');note.textContent=q.type==='map'?'Map-identification item: review it on a map, then confirm.':'Written-response item: review your response independently, then confirm.';const review=document.createElement('button');review.className='secondary';review.textContent=state.reviews[q.num]?'Reviewed':'I reviewed this';review.onclick=()=>{state.reviews[q.num]=!state.reviews[q.num];save();renderStudy()};c.append(note,review)}root.append(c)})}
function renderQuiz(){controls();const root=document.getElementById('content');if(!unlocked()){root.innerHTML='<div class="lock">Quiz mode is locked until every study answer is exact and all self-review prompts are confirmed.</div>';return}if(!state.quiz.started){state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save()}if(!state.quiz.current)state.quiz.current=state.quiz.queue.shift()||null;root.innerHTML='';const completed=auto().filter(q=>(stat('quiz',q.num).correct||0)>0).length;root.innerHTML='<div class="status">Quiz correct: '+completed+' of '+auto().length+'. Choose the correct answer before moving to the next question.</div>';if(!state.quiz.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>Quiz complete!</h2><p>Use Toughest questions to review what took the most attempts.</p>';const restart=document.createElement('button');restart.textContent='Start another quiz';restart.onclick=()=>{state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save();renderQuiz()};done.append(restart);root.append(done);return}const q=byNum(state.quiz.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const f=document.createElement('div');shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{const result=choice===q.answer?'correct':'wrong';stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){state.quiz.current=null;save();setTimeout(renderQuiz,500)}else{save()}};c.append(b)});c.append(f);root.append(c)}
function toughRows(){return auto().map(q=>{const a=stat('study',q.num),b=stat('quiz',q.num),study=a.wrong+a.format+a.spelling,quiz=b.wrong;return {q,study,quiz,total:study+quiz}}).filter(row=>row.total).sort((a,b)=>b.total-a.total)}function startTough(){const nums=toughRows().map(r=>r.q.num);state.tough={queue:shuffle(nums),current:null,started:true,cleared:[]};save();renderTough()}function renderTough(){controls();const root=document.getElementById('content');const rows=toughRows();root.innerHTML='';if(!rows.length){root.innerHTML='<section class="card"><h2>Toughest questions</h2><p>No missed attempts yet.</p></section>';return}const t=state.tough||(state.tough={queue:[],current:null,started:false,cleared:[]});if(!t.started){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Toughest questions</h2><p>'+rows.length+' question'+(rows.length===1?'':'s')+' missed so far, hardest first.</p><ol>'+rows.map(row=>'<li><strong>'+row.q.num+'.</strong> '+row.q.question+' <small>— '+row.total+' miss(es): study '+row.study+', quiz '+row.quiz+'</small></li>').join('')+'</ol>';const go=document.createElement('button');go.className='primary';go.textContent='Drill these '+rows.length+' question'+(rows.length===1?'':'s');go.onclick=startTough;card.append(go);root.append(card);return}if(!t.current){t.current=t.queue.shift()||null;save()}const remaining=t.queue.length+(t.current?1:0);const status=document.createElement('div');status.className='status';status.textContent=t.current?('Cleared '+t.cleared.length+' of '+(t.cleared.length+remaining)+'. A miss goes back into the queue.'):'';root.append(status);if(!t.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>All clear!</h2><p>Every tough question answered correctly.</p>';const again=document.createElement('button');again.textContent='Drill again';again.onclick=startTough;const back=document.createElement('button');back.className='secondary';back.textContent='Back to the list';back.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};done.append(again,back);root.append(done);return}const q=byNum(t.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const input=document.createElement('input');input.type='text';input.autofocus=true;input.setAttribute('aria-label','Answer for question '+q.num);const f=document.createElement('div');const submit=document.createElement('button');submit.textContent='Check answer';const check=()=>{if(!input.value){f.className='feedback wrong';f.textContent='Enter an answer first.';return}const result=grade(q,input.value);stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){if(t.cleared.indexOf(q.num)<0)t.cleared.push(q.num);t.current=null;save();setTimeout(renderTough,550)}else{const pos=Math.floor(Math.random()*(t.queue.length+1));t.queue.splice(pos,0,q.num);t.current=null;save();setTimeout(renderTough,900)}};submit.onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};const quit=document.createElement('button');quit.className='secondary';quit.textContent='Stop drilling';quit.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};c.append(input,submit,f,quit);root.append(c)}
function setMode(mode){if(mode==='quiz'&&!unlocked()){renderStudy();return}document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));document.getElementById(mode+'Mode').classList.add('active');if(mode==='study')renderStudy();else if(mode==='quiz')renderQuiz();else renderTough()}function skipStudy(){if(prompt('Enter the password to skip directly to quiz mode:')!==SKIP_PASSWORD){alert('Incorrect password.');return}auto().forEach(q=>{stat('study',q.num).correct=1});STUDY.questions.filter(q=>q.type!=='auto').forEach(q=>{state.reviews[q.num]=true});save();setMode('quiz')}document.getElementById('title').textContent=STUDY.title;document.getElementById('studyMode').onclick=()=>setMode('study');document.getElementById('quizMode').onclick=()=>setMode('quiz');document.getElementById('toughMode').onclick=()=>setMode('tough');document.getElementById('skipStudy').onclick=skipStudy;document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({studyId:STUDY.id,version:VERSION,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=STUDY.id+'_progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(value.studyId!==STUDY.id||value.version!==VERSION||!value.state)throw Error();state={...fresh(),...value.state};save();setMode('study')}catch(error){alert('This progress file belongs to a different study or is invalid.')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(confirm('Reset all saved answers and statistics?')){localStorage.removeItem(KEY);state=fresh();setMode('study')}};load();setMode('study');

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Diagram Builder</title>
<style>
:root{--ink:#202124;--muted:#636a73;--line:#d7dbe2;--paper:#fff;--bg:#f4f6f8;--accent:#245d8f;--accent2:#477a43;--bad:#a3372a;--good:#217044;--warn:#b7791f;--soft:#eaf2fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.35}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.title h1{font-size:24px;margin:0 0 4px}
.title p{margin:0;color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:#9aa6b5}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.section{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:14px 0;padding:14px}
.section h2{font-size:16px;margin:0 0 6px}
.directions{margin:0 0 12px;color:var(--muted)}
.sentence-strip{font-size:20px;font-family:Georgia,"Times New Roman",serif;margin:6px 0 14px;line-height:1.6}
.step{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;flex:none}
.step-label{font-weight:700;font-size:13px}
.step-hint{color:var(--muted);font-size:13px}
/* role toolbar */
.role-toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;margin:8px 0}
.role-btn{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #c8d3df;background:#fff;border-radius:6px}
.role-btn strong{font-size:13px}
.role-btn span{font-size:11px;color:var(--muted)}
.role-btn.selected{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px rgba(36,93,143,.15)}
/* word bank */
.word-bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.word-token{position:relative;display:inline-flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-width:58px;min-height:50px;border:1px solid #c8d3df;border-radius:6px;padding:6px 8px;background:#fff;cursor:pointer;user-select:none}
.word-token:hover{border-color:var(--accent)}
.word-token.selected{outline:3px solid rgba(36,93,143,.35);border-color:var(--accent);background:var(--soft)}
.word-token.placed{background:#f2f7ef;border-color:rgba(53,122,84,.55);opacity:.6}
.word-token.synthetic{border-style:dashed;font-style:italic}
.word-token.v-ok{border-color:var(--good);box-shadow:inset 0 -3px 0 var(--good)}
.word-token.v-wrongRole{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.word-token.v-misplaced,.word-token.v-extra{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.word-token.v-missing{border-color:var(--bad);border-style:dashed}
.word-text{font-family:Georgia,"Times New Roman",serif;font-size:15px}
.role-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:16px}
.chip{display:inline-flex;align-items:center;min-height:16px;border-radius:999px;padding:1px 5px;color:#fff;font-size:10px;font-weight:800}
.role-s{background:#2f5f98}.role-av,.role-lv,.role-bv,.role-hv{background:#9b5f1a}
.role-do,.role-pn,.role-pa{background:#357a54}.role-adj{background:#6b5ca5}
.role-adv{background:#7f4b77}.role-conj{background:#b34d37}
.role-prep,.role-op{background:#637083}
.role-io{background:#1f7a7a}.role-int{background:#8a6d1f}
/* diagram canvas */
.diagram-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.diagram-svg{display:block;height:auto;max-width:none}
.diagram-line{stroke:#263241;stroke-width:2;stroke-linecap:round;fill:none}
.diagram-guide{stroke:#6e7b8a;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.diagram-text{font-size:17px;font-family:Georgia,"Times New Roman",serif;fill:#1c2633;text-anchor:middle}
.small-text{font-size:13px}
.diagram-target{cursor:pointer;pointer-events:all}
.target-hit{fill:transparent;stroke:transparent}
.diagram-target:hover .target-hit{fill:rgba(155,106,23,.12);stroke:#bc7f1a;stroke-width:2}
.ghost{fill:#fbfcfd;stroke:#8ea3bb;stroke-width:1.5;stroke-dasharray:5 4}
.ghost-label{font-size:12px;fill:#5b6b7e;text-anchor:middle;font-family:Arial,Helvetica,sans-serif;pointer-events:none}
.ghost-g{cursor:pointer}
.ghost-g:hover .ghost{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.word-box{fill:#f8fafc;stroke:#667085;stroke-width:1.6}
.word-box.v-ok{stroke:var(--good);stroke-width:2.5}
.word-box.v-wrongRole{stroke:var(--warn);stroke-width:2.5}
.word-box.v-misplaced{stroke:var(--bad);stroke-width:2.5}
.hint{margin-top:8px;color:var(--bad);font-weight:700;min-height:20px}
.feedback{margin-top:10px;padding:10px;border-radius:6px;background:#f8efe0;border:1px solid #ecd8b9;color:#3e2e13}
.feedback.all-ok{background:#e6f4ec;border-color:#bfe0cd;color:#14532d}
.feedback ul{margin:6px 0 0;padding-left:20px}
.feedback li{margin:2px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend b{font-weight:700}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav .count{color:var(--muted);font-size:13px}
@media(max-width:640px){.wrap{padding:12px}.title h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>Sentence Diagram Builder</h1>
      <p>Build each diagram yourself &mdash; no shapes to choose from.</p>
    </div>
    <div class="nav">
      <button data-action="prev">&larr; Back</button>
      <span class="count" id="count"></span>
      <button data-action="next">Next &rarr;</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>

const STORAGE_KEY="sentence_diagram_builder_v2";

const DIAGRAM_ROLES=[
  {id:'S',   label:'Subject',      className:'role-s'},
  {id:'AV',  label:'Action Verb',  className:'role-av'},
  {id:'LV',  label:'Linking Verb', className:'role-lv'},
  {id:'HV',  label:'Helping Verb', className:'role-hv'},
  {id:'DO',  label:'Direct Object',className:'role-do'},
  {id:'IO',  label:'Indirect Obj.',className:'role-io'},
  {id:'PN',  label:'Pred. Nom.',   className:'role-pn'},
  {id:'PA',  label:'Pred. Adj.',   className:'role-pa'},
  {id:'ADJ', label:'Adjective',    className:'role-adj'},
  {id:'ADV', label:'Adverb',       className:'role-adv'},
  {id:'CONJ',label:'Conjunction',  className:'role-conj'},
  {id:'PREP',label:'Preposition',  className:'role-prep'},
  {id:'OP',  label:'Obj. of Prep.',className:'role-op'},
  {id:'INT', label:'Interjection', className:'role-int'}
];
const ROLE_MAP=Object.fromEntries(DIAGRAM_ROLES.map(r=>[r.id,r]));
const VERB_ROLES=['AV','LV','HV'];
const NOUN_ROLES=['S','DO','IO','PN','OP'];

/* Layout constants. The slant proportions (48 run / 74 drop / 126 arm / -58 deg
   text) are carried over from the existing practice file so the diagrams read
   the same. SLANT_CLEAR is the vertical band a slant owns: the old code proved
   that anything closer than ~88 steals the modifier's clicks. */
const BASE_X=90, BASE_Y=150;
const SEG_MIN=132, SEG_PAD=26, DIVIDER_H=46, HALF_DIV=23;
/* MOD_PITCH must exceed the slant hit polygon's full width (2*15 pad + the
   48 run) or two modifiers under one word fight over the same clicks. */
const SLANT_RUN=48, SLANT_DROP=74, SLANT_CLEAR=88, MOD_PITCH=84;
const DIVIDER_GAP=44, FORK_RISE=54, FORK_RUN=40;
/* Vertical distance between the baselines of two clauses in a compound
   sentence -- enough that the upper clause's modifiers clear the lower one. */
const CLAUSE_GAP=210;
const PREP_ARM=126, ARM_LIFT=16;
/* Space between the words of a verb phrase sharing one baseline spot. */
const PHRASE_GAP=18;
/* How far down its (invisible) slant a joining conjunction sits, as a fraction
   of a full modifier slant. Two-thirds puts it below the modifiers' words with
   the dashed guide still crossing their slants rather than passing their feet. */
const CONJ_LEVEL=0.72;
/* An indirect object hangs under the verb on a slant with a horizontal shelf at
   its foot -- the same shape as a prepositional phrase with the preposition left
   off, which is exactly what "gave [to] him the book" means. */
const IO_ARM=118;
/* An interjection stands apart from the sentence on its own short line, above
   and to the left of the baseline: it modifies nothing and is separated from
   everything else. */
const INTERJ_LIFT=86, INTERJ_W=112, INTERJ_DX=-6;
const CHAR_W=9.2, TEXT_PAD=30;

/* ============================================================ state
   Three authored collections. `line` is the baseline the student built, in the
   order they chose; `nodes` holds every word plus what it hangs off; `dividers`
   and forks are things the student drew, not things the app inferred. */
let state=freshState(0);

function freshState(index){
  return {index, nodes:[], line:[], dividers:[], roles:{},
          clauseStarts:[],     // indices in `line` where a NEW clause begins
          clauseConj:null,     // node id of the conjunction joining the clauses
          sel:null,            // {kind:'role'|'word'|'tool', ...} -- one at a time
          pending:null,        // first word clicked while a 2-click tool is armed
          conjWord:null,       // the word being used as a joining conjunction
          feedback:null, hint:'', seq:1};
}
function sentence(){return SENTENCES[state.index];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tokenText(i){return sentence().tokens[i]||'';}
function isSynthetic(i){return (sentence().synthetic||[]).includes(i);}
function textWidth(s){return Math.max(56, String(s).length*CHAR_W+TEXT_PAD);}

function save(){
  try{
    const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    // persist only declared fields -- layout geometry lives in a side map now
    all[sentence().id]={
      nodes:state.nodes.map(n=>({id:n.id,tokenIndex:n.tokenIndex,attach:n.attach,parentId:n.parentId})),
      line:state.line, dividers:state.dividers, roles:state.roles, seq:state.seq,
      clauseStarts:state.clauseStarts, clauseConj:state.clauseConj};
    all._last=state.index;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(all));
  }catch(e){/* locked-down profile: run without persistence */}
}
function load(index){
  const s=freshState(index);
  try{
    const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const v=all[SENTENCES[index].id];
    if(v){s.nodes=v.nodes||[];s.line=v.line||[];s.dividers=v.dividers||[];
          s.roles=v.roles||{};s.seq=v.seq||1;}
  }catch(e){}
  return s;
}

/* ============================================================ tree ops */
function nodeById(id){return state.nodes.find(n=>n.id===id)||null;}
function nodeForToken(t){return state.nodes.find(n=>n.tokenIndex===t)||null;}
function childrenOf(id){return state.nodes.filter(n=>n.parentId===id);}
function roleOf(t){return state.roles[t]||null;}
function newId(p){return p+(state.seq++);}

function addNode(tokenIndex,attach,parentId){
  const n={id:newId('n'), tokenIndex, attach, parentId:parentId==null?null:parentId};
  state.nodes.push(n);
  return n;
}
/* A cell is one baseline position, in one of three shapes: a plain node id; a
   fork holding two arms plus the conjunction that joins them; or a PHRASE -- a
   run of words written side by side in one spot. A verb phrase ("has been
   helping") is one predicate, so it takes one spot, but the student still has
   to assemble it from three separate words rather than being handed it whole. */
function cellAt(i){return state.line[i];}
function isFork(c){return c&&typeof c==='object'&&c.kind==='fork';}
/* Which way a compound's V points. The vertex sits on the side the sentence
   carries on: a compound SUBJECT is entered from its arms and converges right
   into the verb (vertex right, flipped), while a compound object or complement
   hangs off the verb to its left (vertex left). `flip` overrides the guess, so
   the student can point it either way. */
function forkFlipped(cell,index,count){
  if(cell&&cell.flip!=null)return !!cell.flip;
  return index===0&&count>1;      // first cell on the line -> converge rightward
}
function isPhrase(c){return c&&typeof c==='object'&&c.kind==='phrase';}
function phraseIds(c){return isPhrase(c)?c.ids.filter(Boolean):[];}
/* The word that a phrase's modifiers and dividers hang off: by convention the
   MAIN verb, which is the last word of the phrase. */
function cellHeadId(c){
  if(isPhrase(c)){const ids=phraseIds(c); return ids[ids.length-1]||null;}
  return isFork(c)?(c.arms.filter(Boolean)[0]||null):c;
}
function cellTokens(c){
  if(!c)return [];
  if(isFork(c))return c.arms.filter(Boolean).map(id=>nodeById(id)).filter(Boolean).map(n=>n.tokenIndex);
  if(isPhrase(c))return phraseIds(c).map(id=>nodeById(id)).filter(Boolean).map(n=>n.tokenIndex);
  const n=nodeById(c); return n?[n.tokenIndex]:[];
}
function cellIndexOfNode(id){
  return state.line.findIndex(c=>isFork(c)?c.arms.includes(id):isPhrase(c)?c.ids.includes(id):c===id);
}
function lineNodeIds(){
  const out=[];
  state.line.forEach(c=>{
    if(isFork(c))c.arms.filter(Boolean).forEach(a=>out.push(a));
    else if(isPhrase(c))phraseIds(c).forEach(a=>out.push(a));
    else if(c)out.push(c);
  });
  return out;
}
function isOnLine(id){return lineNodeIds().includes(id);}

/* Removing a word takes its subtree, its place on the line, and any divider or
   conjunction that named it -- a dangling id would crash layout, and silently
   re-binding one would rewrite the student's answer. */
function removeNode(id){
  const doomed=[id];
  for(let i=0;i<doomed.length;i++)childrenOf(doomed[i]).forEach(c=>doomed.push(c.id));
  const gone=new Set(doomed);
  state.nodes=state.nodes.filter(n=>!gone.has(n.id));
  state.line=state.line.map(c=>{
    if(isFork(c)){
      const arms=c.arms.map(a=>gone.has(a)?null:a);
      const kept=arms.filter(Boolean);
      if(!kept.length)return null;
      if(kept.length===1&&gone.has(c.conjId))return kept[0];   // fork collapses
      return {...c, arms, conjId:gone.has(c.conjId)?null:c.conjId};
    }
    if(isPhrase(c)){
      const ids=c.ids.filter(id=>!gone.has(id));
      if(!ids.length)return null;
      if(ids.length===1)return ids[0];        // a one-word phrase is just a word
      return {...c, ids};
    }
    return gone.has(c)?null:c;
  }).filter(Boolean);
  state.dividers=state.dividers.filter(d=>!gone.has(d.leftId)&&!gone.has(d.rightId));
}
function removeDivider(id){state.dividers=state.dividers.filter(d=>d.id!==id);}

/* ============================================================ layout
   measure() reports a subtree's footprint bottom-up. Because modifiers hang
   down AND to the left it returns left/right extents separately -- one
   symmetric width lets a word with three adjectives collide with whatever sits
   to its left. Geometry goes into a side map keyed by node id, never grafted
   onto the nodes themselves (v1 did that and serialized it to localStorage). */
/* A conjunction joining two modifiers takes a slot of its own in the fan,
   between the two words it joins -- same spacing as a modifier, but its slant
   is invisible and its word is written upright, with the dashed guide running
   out to the slants either side. */
function modChildren(id){
  return childrenOf(id).filter(n=>n.attach==='mod'||n.attach==='prep'||
                                  n.attach==='indirect'||n.attach==='conj')
    .sort((a,b)=>a.tokenIndex-b.tokenIndex);
}
function prepObjectWidth(prepNode){
  const obj=childrenOf(prepNode.id).find(c=>c.attach==='prepObject');
  return obj?Math.max(PREP_ARM,textWidth(tokenText(obj.tokenIndex))+30):PREP_ARM;
}
/* The indirect object writes its own word ON the shelf, so the shelf has to be
   wide enough for it -- unlike a prep phrase, whose slant carries the
   preposition and whose shelf carries a separate word. */
function ioArmWidth(node){
  return Math.max(IO_ARM,textWidth(tokenText(node.tokenIndex))+34);
}
function measure(node,slots){
  const kids=modChildren(node.id);
  const m={own:textWidth(tokenText(node.tokenIndex)), left:0, right:0, depth:0};
  slots.set(node.id,[]);
  if(!kids.length)return m;
  let cursor=0;
  const list=[];
  kids.forEach(k=>{
    const km=measure(k,slots);
    const objW=(k.attach==='prep')?prepObjectWidth(k):(k.attach==='indirect')?ioArmWidth(k):0;
    const need=(k.attach==='prep'||k.attach==='indirect')
      ?Math.max(MOD_PITCH,SLANT_RUN+objW+km.right+16):MOD_PITCH;
    list.push({node:k, offset:cursor, m:km, need});
    cursor+=need;
    // A prep phrase reaches further down than its own slant: the object sits
    // at the slant's foot and carries modifiers of ITS own. Measuring only the
    // slant under-reports the depth, which let an upper fork arm's phrase hang
    // into the arm below it.
    let kd=(km.depth?SLANT_CLEAR:SLANT_DROP)+km.depth;
    if(k.attach==='prep'){
      const obj=childrenOf(k.id).find(c=>c.attach==='prepObject');
      if(obj){
        const om=measure(obj,slots);
        kd=Math.max(kd, SLANT_DROP+(om.depth?SLANT_CLEAR+om.depth:0)+ARM_LIFT);
      }
    }else if(k.attach==='indirect'){
      // The word sits on the shelf and its own modifiers hang beneath THAT, so
      // measuring only the slant under-reports how far down the branch reaches.
      kd=Math.max(kd, SLANT_DROP+(km.depth?SLANT_CLEAR+km.depth:0)+ARM_LIFT);
    }
    m.depth=Math.max(m.depth,kd);
  });
  const shift=(cursor-list[list.length-1].need)/2;   // centre the fan on the head
  list.forEach(s=>{s.offset-=shift;});
  list.forEach(s=>{
    m.left =Math.max(m.left,  -s.offset+SLANT_RUN+s.m.left);
    m.right=Math.max(m.right,  s.offset+s.need);
  });
  slots.set(node.id,list);
  return m;
}
function clampReadable(d){ if(d>90)d-=180; else if(d<-90)d+=180; return d; }

function placeSlant(node,anchorX,anchorY,out,maxDrop){
  const drop=(maxDrop==null)?SLANT_DROP:Math.max(34,Math.min(SLANT_DROP,maxDrop));
  const run=Math.round(SLANT_RUN*(drop/SLANT_DROP));
  const x2=anchorX-run, y2=anchorY+drop;
  const deg=clampReadable(Math.atan2(drop,-run)*180/Math.PI);
  // Sit the word beside the slant, not on it: text-anchor is middle, so a point
  // taken on the line itself puts the glyphs straight across the stroke.
  const len=Math.hypot(run,drop)||1, nx=drop/len, ny=run/len;
  const mx=anchorX-run*0.5, my=anchorY+drop*0.5;
  out.geom.set(node.id,{line:{x1:anchorX,y1:anchorY,x2:x2,y2:y2},
    textX:mx+nx*15, textY:my+ny*15+4, rotation:deg, hit:'slant', attach:node.attach});
  out.targets.push(node);
  return {x2:x2,y2:y2};
}
function placeMods(head,centerX,anchorY,out,maxDrop){
  const slots=out.slots.get(head.id)||[];
  slots.forEach((s,si)=>{
    const ax=centerX+s.offset;
    if(s.node.attach==='conj'){
      // The conjunction rides an INVISIBLE slant in its own slot, so it lands
      // midway between the two words it joins and its word stays upright. The
      // dashed guide then runs out to the slants either side.
      // Sit at the same height the neighbouring slants are at two-thirds down,
      // so the dashed guide runs level and meets each slant square on its face
      // rather than angling down to its foot.
      const run=SLANT_RUN*CONJ_LEVEL, drop=SLANT_DROP*CONJ_LEVEL;
      const fx=ax-run, fy=anchorY+drop;
      out.geom.set(s.node.id,{line:{x1:ax,y1:anchorY,x2:fx,y2:fy},
        textX:fx, textY:fy+5, rotation:0, hit:'box', bare:true,
        box:{x:fx-Math.max(20,textWidth(tokenText(s.node.tokenIndex))/2+8),y:fy-15,
             w:Math.max(20,textWidth(tokenText(s.node.tokenIndex))/2+8)*2,h:30},
        attach:'conj', joinAt:{x:fx,y:fy}});
      out.targets.push(s.node);
      return;
    }
    if(s.node.attach==='indirect'){
      // Slant down from the verb, then a horizontal shelf carrying the word.
      // The slant itself is bare -- there is no preposition written on it.
      const drop=SLANT_DROP, run=SLANT_RUN;
      const fx=ax-run, fy=anchorY+drop;
      const w=ioArmWidth(s.node);
      out.geom.set(s.node.id,{line:{x1:fx,y1:fy,x2:fx+w,y2:fy},
        stem:{x1:ax,y1:anchorY,x2:fx,y2:fy},
        textX:fx+34+(w-34)/2, textY:fy-ARM_LIFT, rotation:0, hit:'arm', attach:'indirect'});
      out.targets.push(s.node);
      placeMods(s.node,out.geom.get(s.node.id).textX,fy,out,null);
      return;
    }
    const foot=placeSlant(s.node,ax,anchorY,out,maxDrop);
    if(s.node.attach==='prep'){
      const obj=childrenOf(s.node.id).find(c=>c.attach==='prepObject');
      if(obj){
        const w=prepObjectWidth(s.node);
        out.geom.set(obj.id,{line:{x1:foot.x2,y1:foot.y2,x2:foot.x2+w,y2:foot.y2},
          textX:foot.x2+34+(w-34)/2, textY:foot.y2-ARM_LIFT, rotation:0, hit:'arm', attach:'prepObject'});
        out.targets.push(obj);
        // The object of a preposition takes modifiers of its own ("to the
        // treehouse"), but measure() never descends through a prepObject, so
        // its slot list is empty until we build it here.
        measure(obj,out.slots);
        placeMods(obj,out.geom.get(obj.id).textX,foot.y2,out,null);
      }
    }else{
      placeMods(s.node,out.geom.get(s.node.id).textX,anchorY+SLANT_CLEAR,out,null);
    }
  });
}

/* The baseline is a left-to-right walk over the cells the student built. No
   groups, no inferred structure: a cell sits where it was placed, and a divider
   appears only in the gap the student named. */
function layout(){
  const out={geom:new Map(), slots:new Map(), targets:[], lines:[], dividers:[],
             gaps:[], slotsOpen:[], width:760, height:320, minX:0, top:0};
  const y=BASE_Y;
  let x=BASE_X, maxDepth=0, minX=BASE_X, topY=y;

  // A compound sentence is two independent clauses stacked, each on its own
  // baseline, joined by a dotted vertical between their verbs. clauseStarts
  // records where each new clause begins in `line`.
  const starts=(state.clauseStarts||[]).filter(k=>k>0&&k<state.line.length).sort((a,b)=>a-b);
  const clauseOfCell=i=>{let c=0;starts.forEach(st=>{if(i>=st)c++;});return c;};
  const clauseCount=starts.length+1;
  const clauseY=k=>BASE_Y+k*CLAUSE_GAP;

  const cells=state.line.map(c=>{
    const ids=isFork(c)?c.arms.filter(Boolean):isPhrase(c)?phraseIds(c):[c];
    const ms=ids.map(id=>{const n=nodeById(id);
      return n?measure(n,out.slots):{own:SEG_MIN,left:0,right:0,depth:0};});
    if(!ms.length)ms.push({own:SEG_MIN,left:0,right:0,depth:0});
    // Fork arms are stacked, so they share a width; a phrase's words are
    // written side by side, so its words' widths ADD.
    const own=isPhrase(c)
      ?ms.reduce((a,m)=>a+m.own,0)+PHRASE_GAP*Math.max(0,ms.length-1)
      :Math.max.apply(null,ms.map(m=>m.own));
    // A phrase word's modifiers hang from ITS OWN centre, at a fixed offset
    // inside the phrase -- so the cell must reserve the widest reach measured
    // from that offset, not the sum of each word's spread. Summing let the
    // last word's prepositional phrase run out past the cell and collide with
    // the next word's hit target.
    let spread;
    if(isPhrase(c)){
      let cur=0, lo=0, hi=own;
      ms.forEach(m=>{
        const centre=cur+m.own/2;
        lo=Math.min(lo,centre-m.left);
        hi=Math.max(hi,centre+m.right);
        cur+=m.own+PHRASE_GAP;
      });
      spread=hi-lo;
    }else{
      spread=Math.max.apply(null,ms.map(m=>Math.max(m.own,m.left+m.right)));
    }
    return {cell:c, ids:ids, ms:ms,
            w:Math.max(SEG_MIN,own+SEG_PAD),
            reserve:Math.max(SEG_MIN,spread+SEG_PAD),
            depth:Math.max.apply(null,ms.map(m=>m.depth)),
            left:isPhrase(c)?(ms[0]?ms[0].left:0):Math.max.apply(null,ms.map(m=>m.left)),
            phraseW:isPhrase(c)?own:0};
  });

  // A divider claims room in the gap between the two cells it names. Endpoints
  // inside one cell (both arms of a fork) name no gap and are drawn dangling.
  const gapOf=d=>{
    const a=cellIndexOfNode(d.leftId), b=cellIndexOfNode(d.rightId);
    if(a<0||b<0)return -1;
    if(a===b)return -1;
    return Math.max(a,b);
  };
  const byGap=new Map();
  state.dividers.forEach(d=>{
    const g=gapOf(d);
    if(g<1)return;
    const arr=byGap.get(g)||[]; arr.push(d); byGap.set(g,arr);
  });

  let curClause=0;
  cells.forEach((c,i)=>{
    const ck=clauseOfCell(i);
    if(ck!==curClause){curClause=ck; x=BASE_X;}    // each clause starts at the left
    const y=clauseY(ck);
    c.clause=ck; c.y=y;
    const here=byGap.get(i)||[];
    if(i>0&&ck===clauseOfCell(i-1))x+=here.length?here.length*DIVIDER_GAP:14;
    const slack=Math.max(0,c.reserve-c.w);
    const x1=x+slack/2, x2=x1+c.w, mid=(x1+x2)/2;
    c.x1=x1; c.x2=x2; c.mid=mid;
    here.forEach((d,k)=>{
      const dx=Math.round(x - (here.length-k)*DIVIDER_GAP + DIVIDER_GAP/2);
      const a=cellIndexOfNode(d.leftId), b=cellIndexOfNode(d.rightId);
      out.dividers.push({d:d, dx:dx, y:y, adjacent:Math.abs(a-b)===1});
    });
    if(isFork(c.cell)){
      const rise=Math.max(FORK_RISE,(c.ms[0]?c.ms[0].depth:0)+34);
      const topArm=y-rise, botArm=y+FORK_RISE;
      // Which way the V points. The vertex belongs on the side the sentence
      // CONTINUES: a compound subject converges rightward into the verb, while
      // a compound object opens rightward off the verb. Default from the cell's
      // position, but the student can flip it -- and must be able to, since a
      // compound can sit anywhere.
      const flipped=forkFlipped(c.cell,i,cells.length);
      const vx=flipped?x2:x1;                    // vertex
      const bx=flipped?x2-FORK_RUN:x1+FORK_RUN;  // where the arms turn horizontal
      const armA=flipped?x1:x2;                  // the arms' far end
      out.lines.push({cls:'diagram-line',x1:bx,y1:topArm,x2:armA,y2:topArm});
      out.lines.push({cls:'diagram-line',x1:bx,y1:botArm,x2:armA,y2:botArm});
      out.lines.push({cls:'diagram-line',x1:vx,y1:y,x2:bx,y2:topArm});
      out.lines.push({cls:'diagram-line',x1:vx,y1:y,x2:bx,y2:botArm});
      const gx=bx+(flipped?-24:24);
      out.lines.push({cls:'diagram-guide',x1:gx,y1:topArm,x2:gx,y2:botArm});
      const armMid=(bx+armA)/2;
      c.cell.arms.forEach((id,ai)=>{
        const ay=ai===0?topArm:botArm;
        // An empty arm needs a visible, clickable slot or the fork is a dead
        // end: the student can split a spot but has nowhere to put the second
        // word. Draw the arm plus an open slot on it.
        if(!id){
          out.slotsOpen.push({forkId:c.cell.id, arm:ai,
            x:Math.min(bx,armA), x2:Math.max(bx,armA), y:ay, mid:armMid});
          return;
        }
        const n=nodeById(id); if(!n)return;
        out.geom.set(id,{line:{x1:Math.min(bx,armA),y1:ay,x2:Math.max(bx,armA),y2:ay},
          textX:armMid, textY:ay-ARM_LIFT, rotation:0, hit:'seg', attach:'line'});
        out.targets.push(n);
        // Keep a modifier's fan clear of the conjunction guide, but always
        // anchored ON the arm. The clearance pushes away from the guide (which
        // sits at the vertex end), then is clamped to the arm's own span -- an
        // anchor past the arm's edge leaves the modifier visibly floating off
        // the compound, which is what happened to "her" under "brother".
        const aL=Math.min(bx,armA), aR=Math.max(bx,armA);
        const need=(c.ms[ai]?c.ms[ai].left:0)+42;
        const want=flipped?Math.min(armMid,aR-14):Math.max(armMid,gx+need);
        const anchor=Math.max(aL+10,Math.min(aR-10,want));
        placeMods(n,anchor,ay,out, ai===0?(y-ay-30):null);
      });
      if(c.cell.conjId){
        const cj=nodeById(c.cell.conjId);
        if(cj){
          out.geom.set(cj.id,{box:{x:gx-34,y:y-14,w:68,h:28},
            textX:gx, textY:y+5, rotation:0, hit:'box', attach:'conj'});
          out.targets.push(cj);
        }
      }
      topY=Math.min(topY,topArm-26);
      maxDepth=Math.max(maxDepth,FORK_RISE+(c.ms[1]?c.ms[1].depth:0));
      minX=Math.min(minX,x1-c.left);
    }else if(isPhrase(c.cell)){
      // The words of a verb phrase share one segment of line, written side by
      // side. Each word is separately clickable so it can be taken back off,
      // and every one of them can carry its own modifier ("has NOT been going").
      const ids=phraseIds(c.cell);
      const total=c.phraseW||
        (c.ms.reduce((a,m)=>a+m.own,0)+PHRASE_GAP*Math.max(0,ids.length-1));
      // Centre the phrase on the space its modifiers actually need, not on the
      // words alone: a prep phrase under the LAST word pushes the whole run
      // left so the branch stays inside this cell.
      let lo=0, hi=total, cur=0;
      c.ms.forEach(m=>{
        const centre=cur+m.own/2;
        lo=Math.min(lo,centre-m.left); hi=Math.max(hi,centre+m.right);
        cur+=m.own+PHRASE_GAP;
      });
      let wx=mid-(lo+hi)/2;
      ids.forEach((id,pi)=>{
        const n=nodeById(id); if(!n)return;
        const ow=c.ms[pi]?c.ms[pi].own:SEG_MIN;
        const cx=wx+ow/2;
        out.geom.set(id,{line:{x1:x1,y1:y,x2:x2,y2:y},
          textX:cx, textY:y-ARM_LIFT, rotation:0, hit:'word',
          span:{x:wx-6,w:ow+12}, attach:'line'});
        out.targets.push(n);
        placeMods(n,cx,y,out,null);
        wx+=ow+PHRASE_GAP;
      });
      maxDepth=Math.max(maxDepth,c.depth);
      minX=Math.min(minX,x1-c.left);
    }else if(c.cell){
      const n=nodeById(c.cell);
      if(n){
        out.geom.set(n.id,{line:{x1:x1,y1:y,x2:x2,y2:y},textX:mid,textY:y-ARM_LIFT,
          rotation:0,hit:'seg',attach:'line'});
        out.targets.push(n);
        placeMods(n,mid,y,out,null);
        maxDepth=Math.max(maxDepth,c.depth);
        minX=Math.min(minX,x1-c.left);
      }
    }
    out.gaps.push({index:i, x:x1-slack/2-8});
    x=x1-slack/2+Math.max(c.w,c.reserve);
  });
  out.gaps.push({index:cells.length, x:x+12});

  // An interjection is grammatically independent: it hangs off nothing and is
  // written on its own short line above and to the left of the sentence, so it
  // is visibly separate from the diagram proper.
  state.nodes.filter(n=>n.attach==='interj').forEach((ij,k)=>{
    const w=Math.max(INTERJ_W,textWidth(tokenText(ij.tokenIndex))+30);
    const ix=BASE_X+INTERJ_DX, iy=BASE_Y-INTERJ_LIFT-k*40;
    out.lines.push({cls:'diagram-line',x1:ix,y1:iy,x2:ix+w,y2:iy});
    out.geom.set(ij.id,{line:{x1:ix,y1:iy,x2:ix+w,y2:iy},
      textX:ix+w/2, textY:iy-ARM_LIFT, rotation:0, hit:'seg', attach:'interj'});
    out.targets.push(ij);
    topY=Math.min(topY,iy-34);
  });

  // A conjunction joining two MODIFIERS sits in its own slot in the fan (placed
  // by placeMods, on an invisible slant so its word stays upright). All that is
  // left is the dashed guide running out to the slant either side of it.
  state.nodes.filter(n=>n.attach==='conj'&&n.parentId).forEach(cj=>{
    const cg=out.geom.get(cj.id);
    const sibs=childrenOf(cj.parentId)
      .filter(k=>k.attach!=='conj'&&out.geom.get(k.id)&&out.geom.get(k.id).line);
    if(!cg||!cg.joinAt){
      // Its head word is not on the diagram, so it never got a slot. Park it
      // under that word rather than leaving a placed word invisible.
      const pg=out.geom.get(cj.parentId);
      if(pg){
        const px=pg.textX, py=pg.box?pg.box.y+pg.box.h:Math.max(pg.line.y1,pg.line.y2);
        out.geom.set(cj.id,{box:{x:px-34,y:py+30,w:68,h:28},
          textX:px, textY:py+49, rotation:0, hit:'box', attach:'conj'});
        out.targets.push(cj);
        maxDepth=Math.max(maxDepth,py+62-y);
      }
      return;
    }
    // Reach to the nearest slant on each side -- the two words it joins.
    const before=sibs.filter(k=>k.tokenIndex<cj.tokenIndex)
                     .sort((a,b)=>b.tokenIndex-a.tokenIndex)[0];
    const after=sibs.filter(k=>k.tokenIndex>cj.tokenIndex)
                    .sort((a,b)=>a.tokenIndex-b.tokenIndex)[0];
    const gap=cg.box?cg.box.w/2+6:22;
    const gy=cg.joinAt.y;
    [[before,-1],[after,1]].forEach(([sib,dir])=>{
      if(!sib)return;
      const sg=out.geom.get(sib.id); if(!sg||!sg.line)return;
      const L=sg.line;
      // Run level with the word, out to the point where that slant crosses this
      // height -- so the dash meets the slant square instead of angling down to
      // its foot and cutting across the word written on it.
      const dyS=L.y2-L.y1;
      const t=dyS?Math.max(0,Math.min(1,(gy-L.y1)/dyS)):1;
      const hitX=L.x1+(L.x2-L.x1)*t;
      out.lines.push({cls:'diagram-guide',
        x1:cg.joinAt.x+dir*gap, y1:gy, x2:hitX, y2:gy});
    });
    maxDepth=Math.max(maxDepth,cg.joinAt.y+30-y);
  });

  // The baseline stops where a compound forks: the two arms carry the sentence
  // from there, so a line running between them would cut straight through the
  // fork. Draw it in segments, skipping each fork's span.
  // One baseline PER CLAUSE, each skipping its own forks.
  let lineEnd=BASE_X+3*SEG_MIN;
  for(let k=0;k<clauseCount;k++){
    const mine=cells.filter(c=>c.clause===k);
    if(!mine.length)continue;
    const cy=clauseY(k);
    const right=Math.max.apply(null,mine.map(c=>c.x2));
    const end=Math.max(right+40,BASE_X+3*SEG_MIN);
    lineEnd=Math.max(lineEnd,end);
    const skips=mine.filter(c=>isFork(c.cell)).map(c=>({a:c.x1,b:c.x2})).sort((p,q)=>p.a-q.a);
    let cursor=BASE_X-4;
    // A compound whose V points RIGHT is entered through its arms, not along
    // the baseline: the line begins at its vertex. Starting at BASE_X left a
    // stray stub floating to the left of the fork, and skipping its span again
    // would then re-skip a stretch the line never covered.
    const firstCell=mine[0];
    if(firstCell&&isFork(firstCell.cell)&&
       forkFlipped(firstCell.cell,cells.indexOf(firstCell),cells.length)){
      cursor=Math.max(cursor,firstCell.x2);
      if(skips.length&&skips[0].a===firstCell.x1)skips.shift();
    }
    skips.forEach(sk=>{
      if(sk.a>cursor)out.lines.unshift({cls:'diagram-line',x1:cursor,y1:cy,x2:sk.a,y2:cy});
      cursor=Math.max(cursor,sk.b);
    });
    // Only continue past a fork if something is actually there, or a compound
    // at the end of a clause leaves a stub hanging past the conjunction.
    const last=mine[mine.length-1];
    if(cursor<end&&!isFork(last.cell))
      out.lines.unshift({cls:'diagram-line',x1:cursor,y1:cy,x2:end,y2:cy});
  }

  // The clauses of a compound sentence are joined by a dotted vertical between
  // their verbs, with the conjunction written on it.
  if(clauseCount>1){
    // Meet the verb cell just inside its LEFT edge. Aiming at the midpoint puts
    // the elbow on top of the word -- and squarely between the words of a verb
    // phrase, where "may play" had the dotted joiner running through "play".
    const verbX=k=>{
      const mine=cells.filter(c=>c.clause===k);
      const c=mine.length>1?mine[1]:mine[0];
      if(!c)return BASE_X+SEG_MIN;
      if(!isPhrase(c.cell))return c.mid;
      // Meet the phrase just BEFORE its first word. "may play" is one predicate
      // occupying one spot, so a line dropping into the gap between its words
      // reads as if it split the verb phrase in two -- which is exactly what a
      // verb phrase must never look like.
      const ids=phraseIds(c.cell);
      const first=out.geom.get(ids[0]);
      return (first&&first.span)?Math.min(first.span.x-8,c.x1+10):c.x1+8;
    };
    for(let k=0;k+1<clauseCount;k++){
      const xTop=verbX(k), xBot=verbX(k+1);
      // Run the dotted guide down the LEFT of both verb spots rather than at
      // their midpoint: a midpoint can sit directly above a word, and the
      // elbow then grazes its letters on the way down.
      const jx=Math.round(Math.min(xTop,xBot)-14);
      const yTop=clauseY(k), yBot=clauseY(k+1);
      out.lines.push({cls:'diagram-line',x1:xTop,y1:yTop,x2:jx,y2:yTop+26});
      out.lines.push({cls:'diagram-guide',x1:jx,y1:yTop+26,x2:jx,y2:yBot-26});
      out.lines.push({cls:'diagram-line',x1:jx,y1:yBot-26,x2:xBot,y2:yBot});
      const cj=state.clauseConj?nodeById(state.clauseConj):null;
      if(cj&&!out.geom.get(cj.id)){
        out.geom.set(cj.id,{box:{x:jx-36,y:(yTop+yBot)/2-15,w:72,h:30},
          textX:jx, textY:(yTop+yBot)/2+5, rotation:0, hit:'box', attach:'clauseConj'});
        out.targets.push(cj);
      }
    }
  }
  out.lineEnd=lineEnd; out.baseY=BASE_Y;

  out.targets.forEach(t=>{
    const g=out.geom.get(t.id); if(!g)return;
    const ys=g.box?[g.box.y,g.box.y+g.box.h]:[g.line.y1,g.line.y2,g.textY+8];
    maxDepth=Math.max(maxDepth,Math.max.apply(null,ys)-y);
    topY=Math.min(topY,Math.min.apply(null,ys)-20);
    const xs=g.box?[g.box.x]:[g.line.x1,g.line.x2];
    minX=Math.min(minX,Math.min.apply(null,xs));
  });
  out.width=Math.max(760,lineEnd+40);
  out.minX=Math.min(0,minX-30);
  out.top=Math.min(0,topY-BASE_Y)+BASE_Y-BASE_Y;
  out.topY=topY;
  // Span from the highest content down to the deepest, not from y=0: a tall
  // fork lifts its upper arm well above the baseline.
  out.height=Math.max(300,(BASE_Y+maxDepth)-Math.min(0,out.topY)+56);
  return out;
}

/* ============================================================ expectations
   Nothing about dividers or forks is hand-authored: the six sentences already
   carry a `slot` per token, and subject/verb/object/complement membership
   implies exactly which pair each divider separates. Collapsing a compound into
   ONE cell first is what lets a divider be graded against the whole fork -- in
   "Ben and Clara carried", the S|V divider may fairly be drawn from either
   Ben or Clara. */
const ZONE={subject:'S', verb:'V', object:'O', complement:'C'};
const ZONE_DIVIDER={SV:'sv', VO:'do', VC:'complement'};

const SLOT_RANK={subject:0, verb:1, object:2, complement:2};
function expectedModel(){
  const s=sentence();
  // Baseline order is DIAGRAM order, not sentence order. In an inverted or
  // interrogative sentence ("Are you ready?", "Down the road rumbled a truck")
  // the subject's token index is higher than the verb's, yet the subject still
  // sits first on the line. Sort by clause, then slot, then token -- so token
  // order only breaks ties inside one slot, where it is a genuine compound.
  const onLine=s.expected.filter(e=>ZONE[e.slot]).slice().sort((a,b)=>
    ((a.clause||0)-(b.clause||0))||(SLOT_RANK[a.slot]-SLOT_RANK[b.slot])||(a.t-b.t));
  const cells=[];
  onLine.forEach(e=>{
    const cl=e.clause||0;
    const last=cells[cells.length-1];
    // Same slot AND same clause means a compound; the second clause of a
    // compound sentence has its own subject and verb, not a fork.
    if(last&&last.slot===e.slot&&last.clause===cl)last.toks.push(e.t);
    else cells.push({slot:e.slot, toks:[e.t], clause:cl});
  });
  // A cell holding several words is one of two different things. Joined by a
  // conjunction it is a COMPOUND -- two stacked fork arms ("Ben and Clara").
  // Otherwise it is a PHRASE: consecutive words filling one spot side by side,
  // which is what a verb phrase like "has been helping" is.
  cells.forEach(c=>{
    c.phrase=c.toks.length>1&&c.toks.every((t,i)=>i===0||t===c.toks[i-1]+1);
  });
  const dividers=[];
  for(let i=0;i<cells.length-1;i++){
    if(cells[i].clause!==cells[i+1].clause)continue;      // no divider across clauses
    const k=ZONE[cells[i].slot]+ZONE[cells[i+1].slot];
    if(ZONE_DIVIDER[k])
      dividers.push({kind:ZONE_DIVIDER[k], left:cells[i].toks.slice(), right:cells[i+1].toks.slice()});
  }
  const conj=s.expected.find(e=>e.slot==='conj');
  const modConj=s.expected.find(e=>e.slot==='modConj');
  const attach={}, roles={};
  s.expected.forEach(e=>{
    roles[e.t]=e.role;
    if(ZONE[e.slot])attach[e.t]='line';
    else if(e.slot==='conj'||e.slot==='clauseConj')attach[e.t]='conj';
    else if(e.slot==='modConj')attach[e.t]='conj@'+e.parent;
    else if(e.slot==='prepObject')attach[e.t]='prepObject@'+e.parent;
    else if(e.slot==='prep')attach[e.t]='prep@'+e.parent;
    else if(e.slot==='indirect')attach[e.t]='indirect@'+e.parent;
    else if(e.slot==='interj')attach[e.t]='interj';
    else attach[e.t]='mod@'+e.parent;
  });
  const clauseStart=cells.findIndex(c=>c.clause===1);
  return {cells, dividers, attach, roles, clauseStart,
          clauseConjToken:(s.expected.find(e=>e.slot==='clauseConj')||{}).t,
          order:cells.map(c=>c.toks.slice()),
          conjToken:conj?conj.t:null, modConjToken:modConj?modConj.t:null};
}

/* ============================================================ grading */
function studentAttach(){
  const map={};
  state.nodes.forEach(n=>{
    if(n.attach==='line'){map[n.tokenIndex]='line';return;}
    // An interjection hangs off nothing, so it has no head token to name.
    if(n.attach==='interj'){map[n.tokenIndex]='interj';return;}
    const p=nodeById(n.parentId);
    const pt=p?p.tokenIndex:'?';
    // Naming the HEAD TOKEN is what makes "under the wrong noun" detectable:
    // mod@4 and mod@0 are different answers, where a bare "mod" would not be.
    map[n.tokenIndex]=n.attach+'@'+pt;
  });
  // A conjunction on a fork guide, or joining two clauses, is addressed as
  // plain 'conj' -- it has no head word to hang from.
  state.line.forEach(c=>{
    if(isFork(c)&&c.conjId){
      const cj=nodeById(c.conjId);
      if(cj)map[cj.tokenIndex]='conj';
    }
  });
  if(state.clauseConj){
    const cc=nodeById(state.clauseConj);
    if(cc)map[cc.tokenIndex]='conj';
  }
  return map;
}
/* Longest increasing subsequence: flags the minimum set of words that must
   move, instead of cascading a single misplacement onto everything after it. */
function lisKeep(seq){
  if(!seq.length)return new Set();
  const tails=[], idx=[], prev=new Array(seq.length).fill(-1);
  seq.forEach((v,i)=>{
    let lo=0,hi=tails.length;
    while(lo<hi){const mid=(lo+hi)>>1; if(tails[mid]<v)lo=mid+1; else hi=mid;}
    tails[lo]=v; idx[lo]=i;
    prev[i]=lo>0?idx[lo-1]:-1;
  });
  const keep=new Set();
  let k=idx[tails.length-1];
  while(k>=0){keep.add(k);k=prev[k];}
  return keep;
}
function grade(){
  const exp=expectedModel();
  const stu=studentAttach();
  const words={}, tokens=sentence().tokens;

  // where each token is expected on the line (its cell index)
  const expCellOf={}; exp.order.forEach((toks,i)=>toks.forEach(t=>{expCellOf[t]=i;}));

  // student's baseline sequence, by cell
  const stuCells=state.line.map(c=>cellTokens(c));
  const stuCellOf={}; stuCells.forEach((toks,i)=>toks.forEach(t=>{stuCellOf[t]=i;}));

  // Order is a property of CELLS, not of words: the two arms of a compound
  // share one spot and have no left-to-right order between them, so grade one
  // entry per cell or a fork reads as a step backwards every time.
  const seq=[], seqCells=[];
  stuCells.forEach(toks=>{
    const known=toks.filter(t=>expCellOf[t]!=null);
    if(!known.length)return;
    // a cell is "at" the expected position of the arms it holds
    seq.push(Math.min.apply(null,known.map(t=>expCellOf[t])));
    seqCells.push(known);
  });
  const keep=lisKeep(seq);
  const outOfOrder=new Set();
  seqCells.forEach((toks,i)=>{if(!keep.has(i))toks.forEach(t=>outOfOrder.add(t));});

  for(let t=0;t<tokens.length;t++){
    const e=exp.attach[t], s=stu[t];
    if(e==null&&s==null){words[t]='ok';continue;}
    if(e==null){words[t]='extra';continue;}
    if(s==null){words[t]='missing';continue;}
    if(e!==s){words[t]='misplaced';continue;}
    if(outOfOrder.has(t)){words[t]='outOfOrder';continue;}
    words[t]=(roleOf(t)===exp.roles[t])?'ok':'wrongRole';
  }

  // dividers: match by CELL MEMBERSHIP, three passes, so "right spot wrong
  // shape" reads differently from "right shape wrong spot".
  const used=new Set(), divs={};
  const stuDiv=state.dividers.map(d=>{
    const L=nodeById(d.leftId), R=nodeById(d.rightId);
    return {d, lt:L?L.tokenIndex:null, rt:R?R.tokenIndex:null};
  }).filter(x=>x.lt!=null&&x.rt!=null);
  const pairHits=(e,x)=>
    (e.left.includes(x.lt)&&e.right.includes(x.rt))||(e.left.includes(x.rt)&&e.right.includes(x.lt));
  stuDiv.forEach(x=>{
    const i=exp.dividers.findIndex((e,i)=>!used.has(i)&&e.kind===x.d.kind&&pairHits(e,x));
    if(i>=0){used.add(i);divs[x.d.id]='ok';}
  });
  // Ordering alone cannot separate these two, because both are "one half
  // right". Decide by WHICH HALF: a divider standing in a gap that genuinely
  // needs one is the right spot with the wrong shape; a divider standing where
  // no divider belongs is the right shape in the wrong spot.
  stuDiv.forEach(x=>{ if(divs[x.d.id])return;
    const byPair=exp.dividers.findIndex((e,i)=>!used.has(i)&&pairHits(e,x));
    if(byPair>=0){used.add(byPair);divs[x.d.id]='wrongType';return;}
    const byKind=exp.dividers.findIndex((e,i)=>!used.has(i)&&e.kind===x.d.kind);
    if(byKind>=0){used.add(byKind);divs[x.d.id]='misplaced';}
  });
  stuDiv.forEach(x=>{ if(!divs[x.d.id])divs[x.d.id]='extra'; });
  const missingDiv=exp.dividers.filter((e,i)=>!used.has(i));

  // forks: expected compounds are multi-token cells that are NOT verb phrases.
  // "has been helping" fills one spot but is not a compound, so it must not be
  // demanded as one -- nor reported as a stray compound when built correctly.
  const expForks=exp.cells.filter(c=>c.toks.length>1&&!c.phrase).map(c=>c.toks);
  const stuForks=state.line.filter(c=>isFork(c)).map(c=>cellTokens(c)).filter(t=>t.length>1);
  const forkIssues=[];
  expForks.forEach(want=>{
    const got=stuForks.find(g=>g.length===want.length&&want.every(t=>g.includes(t)));
    if(!got)forkIssues.push({want, kind:'missing'});
  });
  stuForks.forEach(got=>{
    const ok=expForks.some(want=>want.length===got.length&&want.every(t=>got.includes(t)));
    if(!ok)forkIssues.push({want:got, kind:'extra'});
  });

  return {words, divs, missingDiv, forkIssues, exp};
}

/* ============================================================ render */
const TOOLS=[
  {id:'div:sv',        label:'S | V',  hint:'Subject / verb divider (crosses the line)'},
  {id:'div:do',        label:'V | DO', hint:'Direct object divider (stops at the line)'},
  {id:'div:complement',label:'V \\ PN', hint:'Predicate word divider (slanted)'},
  {id:'fork',          label:'Compound', hint:'Split a spot in two (click again to turn it)'},
  {id:'phrase',        label:'Same spot', hint:'Add a helping verb beside a word'},
  {id:'conj',          label:'Join with',hint:'Pick the joining word, then the two it joins'},
  {id:'interj',        label:'Set apart', hint:'Put a word on its own line (interjection)'}
];
function toolArmed(id){return state.sel&&state.sel.kind==='tool'&&state.sel.tool===id;}

function renderRoleToolbar(){
  const btns=DIAGRAM_ROLES.map(r=>{
    const on=state.sel&&state.sel.kind==='role'&&state.sel.role===r.id;
    return '<button class="role-btn '+(on?'selected':'')+'" data-action="role" data-value="'+r.id+'">'+
      '<strong>'+esc(r.id)+'</strong><span>'+esc(r.label)+'</span></button>';
  }).join('');
  return '<div class="role-toolbar">'+btns+'</div>';
}
function renderToolbar(){
  const btns=TOOLS.map(t=>
    '<button class="role-btn '+(toolArmed(t.id)?'selected':'')+'" data-action="tool" data-value="'+t.id+'">'+
    '<strong>'+esc(t.label)+'</strong><span>'+esc(t.hint)+'</span></button>').join('');
  return '<div class="role-toolbar">'+btns+'</div>';
}
function renderBank(){
  const s=sentence(), v=state.feedback?state.feedback.words:null;
  return '<div class="word-bank">'+s.tokens.map((tok,i)=>{
    const placed=!!nodeForToken(i), role=roleOf(i);
    const cls=['word-token'];
    if(state.sel&&state.sel.kind==='word'&&state.sel.tokenIndex===i)cls.push('selected');
    if(state.conjWord===i)cls.push('selected');   // armed as the joining word
    if(placed)cls.push('placed');
    if(isSynthetic(i))cls.push('synthetic');
    if(v&&v[i])cls.push('v-'+v[i]);
    const chip=role?'<span class="chip '+ROLE_MAP[role].className+'">'+esc(role)+'</span>':'';
    return '<button class="'+cls.join(' ')+'" data-action="word" data-index="'+i+'">'+
      '<span class="word-text">'+esc(tok)+'</span><span class="role-chips">'+chip+'</span></button>';
  }).join('')+'</div>';
}
function vclass(t){
  const v=state.feedback?state.feedback.words[t]:null;
  return (v&&v!=='missing'&&v!=='extra')?' v-'+v:'';
}
function vstroke(t){
  const v=state.feedback?state.feedback.words[t]:null;
  if(v==='ok')return ' stroke="#217044"';
  if(v==='wrongRole')return ' stroke="#b7791f"';
  if(v==='misplaced'||v==='outOfOrder'||v==='extra')return ' stroke="#a3372a"';
  return '';
}
function vfill(t){
  const v=state.feedback?state.feedback.words[t]:null;
  if(v==='ok')return ' fill="#217044"';
  if(v==='wrongRole')return ' fill="#b7791f"';
  if(v==='misplaced'||v==='outOfOrder'||v==='extra')return ' fill="#a3372a"';
  return '';
}
function renderTargetSvg(n,g){
  const label=esc(tokenText(n.tokenIndex));
  const pend=state.pending===n.id?' selected':'';
  if(g.hit==='box'){
    // A conjunction written ON the dashed guide needs no drawn box -- the
    // broken line either side already frames it. Only the free-standing kind
    // (a fork's conjunction) gets a border.
    const plate=g.bare?''
      :'<rect class="word-box'+vclass(n.tokenIndex)+'" x="'+g.box.x+'" y="'+g.box.y+'" width="'+g.box.w+'" height="'+g.box.h+'" rx="6"></rect>';
    return '<g class="diagram-target'+pend+'" data-action="node" data-node="'+n.id+'">'+
      '<rect class="target-hit" x="'+(g.box.x-6)+'" y="'+(g.box.y-6)+'" width="'+(g.box.w+12)+'" height="'+(g.box.h+12)+'" rx="6"></rect>'+
      plate+
      '<text class="diagram-text small-text" x="'+g.textX+'" y="'+g.textY+'"'+vfill(n.tokenIndex)+'>'+label+'</text></g>';
  }
  if(g.hit==='slant'){
    const L=g.line, pad=15, tail=(g.attach==='prep')?10:0;
    const fx=L.x2+(L.x1-L.x2)*(tail/Math.max(1,L.y2-L.y1)), fy=L.y2-tail;
    const pts=[[L.x1+pad,L.y1+5],[L.x1-pad,L.y1+5],[fx-pad,fy],[fx+pad,fy]]
      .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    return '<g class="diagram-target'+pend+'" data-action="node" data-node="'+n.id+'">'+
      '<polygon class="target-hit" points="'+pts+'"></polygon>'+
      '<line class="diagram-line" x1="'+L.x1+'" y1="'+L.y1+'" x2="'+L.x2+'" y2="'+L.y2+'"'+vstroke(n.tokenIndex)+'></line>'+
      '<text class="diagram-text small-text" x="'+g.textX+'" y="'+g.textY+'" transform="rotate('+g.rotation.toFixed(1)+' '+g.textX+' '+g.textY+')"'+vfill(n.tokenIndex)+'>'+label+'</text></g>';
  }
  // One word of a verb phrase: its hit target is just its own span, not the
  // whole shared segment, or the words fight over each other's clicks.
  if(g.hit==='word'){
    return '<g class="diagram-target'+pend+'" data-action="node" data-node="'+n.id+'">'+
      '<rect class="target-hit" x="'+g.span.x+'" y="'+(g.textY-18)+'" width="'+g.span.w+'" height="'+(g.line.y1-g.textY+22)+'" rx="5"></rect>'+
      '<text class="diagram-text" x="'+g.textX+'" y="'+g.textY+'"'+vfill(n.tokenIndex)+'>'+label+'</text></g>';
  }
  const L=g.line, top=(g.hit==='arm')?g.textY-12:Math.min(L.y1,g.textY)-16;
  const left=(g.hit==='arm')?L.x1+34:L.x1+2;
  // An indirect object owns the slant that carries it down from the verb, so it
  // draws its own stem; a prep object's stem is the preposition's slant.
  const stem=g.stem?'<line class="diagram-line" x1="'+g.stem.x1+'" y1="'+g.stem.y1+'" x2="'+g.stem.x2+'" y2="'+g.stem.y2+'"'+vstroke(n.tokenIndex)+'></line>':'';
  // Every arm word -- an indirect object OR the object of a preposition -- sits
  // ON a horizontal line. Without it the word floats under the slant and its
  // own modifiers appear to hang off nothing.
  const shelf=(g.hit==='arm')
    ?'<line class="diagram-line" x1="'+L.x1+'" y1="'+L.y1+'" x2="'+L.x2+'" y2="'+L.y2+'"'+vstroke(n.tokenIndex)+'></line>':'';
  return '<g class="diagram-target'+pend+'" data-action="node" data-node="'+n.id+'">'+
    '<rect class="target-hit" x="'+left+'" y="'+top+'" width="'+Math.max(28,L.x2-left-2)+'" height="'+(L.y1-top)+'" rx="5"></rect>'+
    stem+shelf+
    '<text class="diagram-text" x="'+g.textX+'" y="'+g.textY+'"'+vfill(n.tokenIndex)+'>'+label+'</text></g>';
}
/* An empty fork arm: the line is already drawn, so add a dashed slot on it that
   says "a word goes here" and can be clicked. */
function renderOpenArm(a){
  return '<g class="ghost-g" data-action="fillarm" data-arm="'+a.forkId+':'+a.arm+'">'+
    '<rect class="ghost" x="'+(a.mid-42)+'" y="'+(a.y-24)+'" width="84" height="22" rx="5"></rect>'+
    '<text class="ghost-label" x="'+a.mid+'" y="'+(a.y-9)+'">word here</text></g>';
}
function renderDividerSvg(D){
  const d=D.d, y=D.y, x=D.dx;
  const v=state.feedback?state.feedback.divs[d.id]:null;
  const col=v==='ok'?'#217044':v==='wrongType'?'#b7791f':v?'#a3372a':'#263241';
  const dash=D.adjacent?'':' stroke-dasharray="5 4"';
  let line;
  if(d.kind==='sv')            line='<line x1="'+x+'" y1="'+(y-DIVIDER_H)+'" x2="'+x+'" y2="'+(y+DIVIDER_H)+'"';
  else if(d.kind==='do')       line='<line x1="'+x+'" y1="'+(y-DIVIDER_H)+'" x2="'+x+'" y2="'+y+'"';
  else                         line='<line x1="'+(x-14)+'" y1="'+(y-DIVIDER_H)+'" x2="'+(x+6)+'" y2="'+y+'"';
  return '<g class="diagram-target" data-action="divider" data-div="'+d.id+'">'+
    '<rect class="target-hit" x="'+(x-16)+'" y="'+(y-DIVIDER_H-6)+'" width="32" height="'+(DIVIDER_H*2+12)+'" rx="5"></rect>'+
    line+' stroke="'+col+'" stroke-width="2.4" stroke-linecap="round"'+dash+'></line></g>';
}
function renderCanvas(){
  const L=layout();
  state._L=L;
  const lines=L.lines.map(l=>'<line class="'+l.cls+'" x1="'+l.x1+'" y1="'+l.y1+'" x2="'+l.x2+'" y2="'+l.y2+'"></line>').join('');
  const divs=L.dividers.map(renderDividerSvg).join('');
  const targets=L.targets.map(n=>{const g=L.geom.get(n.id);return g?renderTargetSvg(n,g):'';}).join('');
  const openArms=L.slotsOpen.map(renderOpenArm).join('');
  // one wide strip over the baseline: click it to drop the carried word there
  const armed=state.sel&&state.sel.kind==='word';
  const strip=armed?'<rect class="baseline-hit" data-action="baseline" x="'+(L.minX)+'" y="'+(L.baseY-22)+'" width="'+(L.width-L.minX)+'" height="44" fill="rgba(36,93,143,.05)"></rect>':'';
  const top=Math.min(0,L.topY)-10;   // a little air above the tallest arm
  const vb=L.minX+' '+top+' '+(L.width-L.minX)+' '+(L.height-top);
  return '<div class="diagram-wrap"><svg class="diagram-svg" id="canvas" viewBox="'+vb+'" '+
    'width="'+(L.width-L.minX)+'" height="'+(L.height-top)+'" preserveAspectRatio="xMidYMin meet" '+
    'role="img" aria-label="Sentence diagram">'+strip+lines+divs+targets+openArms+'</svg></div>';
}
function renderFeedback(){
  const f=state.feedback; if(!f)return '';
  const wrong=Object.entries(f.words).filter(([t,v])=>v!=='ok');
  const badDiv=Object.entries(f.divs).filter(([id,v])=>v!=='ok');
  const clean=!wrong.length&&!badDiv.length&&!f.missingDiv.length&&!f.forkIssues.length;
  if(clean)return '<div class="feedback all-ok"><strong>Correct.</strong> Every word, divider and compound is right.</div>';
  const names={wrongRole:'right place, but check the label',misplaced:'in the wrong place',
    outOfOrder:'in the wrong order on the line',extra:'should not be on the diagram',
    missing:'still needs to go on the diagram'};
  let html='<div class="feedback"><strong>Check again.</strong><ul>';
  wrong.forEach(([t,v])=>{html+='<li><b>'+esc(tokenText(t))+'</b> &mdash; '+names[v]+'</li>';});
  badDiv.forEach(([id,v])=>{
    const d=state.dividers.find(x=>x.id===id); if(!d)return;
    const a=nodeById(d.leftId), b=nodeById(d.rightId);
    const where=(a&&b)?(' between <b>'+esc(tokenText(a.tokenIndex))+'</b> and <b>'+esc(tokenText(b.tokenIndex))+'</b>'):'';
    html+='<li>The divider'+where+' &mdash; '+
      (v==='wrongType'?'right spot, wrong kind of divider':v==='misplaced'?'right kind, wrong spot':'is not needed')+'</li>';
  });
  f.missingDiv.forEach(e=>{
    html+='<li>You still need a <b>'+(e.kind==='sv'?'subject / verb':e.kind==='do'?'direct object':'predicate')+
      '</b> divider between <b>'+esc(tokenText(e.left[e.left.length-1]))+'</b> and <b>'+esc(tokenText(e.right[0]))+'</b></li>';
  });
  f.forkIssues.forEach(fi=>{
    const w=fi.want.map(t=>esc(tokenText(t))).join(' and ');
    html+='<li>'+(fi.kind==='missing'?'<b>'+w+'</b> should share one spot as a compound':
      '<b>'+w+'</b> should not be a compound')+'</li>';
  });
  return html+'</ul></div>';
}
function toolHint(){
  if(!state.sel)return 'Tag a word’s job, put words on the line, then add the dividers.';
  if(state.sel.kind==='role')return 'Click each word that is a '+ROLE_MAP[state.sel.role].label.toLowerCase()+'. The tool stays on.';
  if(state.sel.kind==='word')return 'Click the line to put it there, click a word to hang it underneath, or an empty arm to fill it.';
  if(state.sel.kind==='tool'){
    if(state.sel.tool==='fork')return 'Click a word on the line to split its spot in two. Click a compound again to turn it the other way.';
    if(state.sel.tool==='interj')return 'Click the interjection in the word list to set it on its own line.';
    if(state.sel.tool==='phrase')return state.conjWord==null
      ?'Click the helping verb in the word list, then the verb it goes with.'
      :'Now click the word on the line that "'+tokenText(state.conjWord)+'" joins.';
    if(state.sel.tool==='conj'){
      if(state.conjWord==null)return 'Click the joining word (like "and") in the word list.';
      if(!state.pending)return 'Now click the FIRST word that "'+tokenText(state.conjWord)+'" joins.';
      return 'Now click the SECOND word.';
    }
    return state.pending?'Now click the word on the RIGHT of the divider.':'Click the word on the LEFT of the divider.';
  }
  return '';
}
function render(){
  const s=sentence();
  document.getElementById('count').textContent='Sentence '+(state.index+1)+' of '+SENTENCES.length;
  document.getElementById('app').innerHTML=
  '<div class="section">'+
    '<h2>'+esc(s.sentence)+'</h2>'+
    '<p class="directions">Build the whole diagram yourself. Nothing is drawn for you, and you can put anything anywhere &mdash; press Check when you think it is right.</p>'+
    '<div class="step"><span class="step-label">Jobs</span><span class="step-hint">Pick a job, then click every word that does it.</span></div>'+
    renderRoleToolbar()+
    '<div class="step"><span class="step-label">Words</span><span class="step-hint">Click a word, then click the line or a word on the diagram.</span></div>'+
    renderBank()+
    '<div class="step"><span class="step-label">Lines</span><span class="step-hint">Pick a divider, then click the two words it goes between.</span></div>'+
    renderToolbar()+
    renderCanvas()+
    '<div class="hint">'+esc(state.hint||toolHint())+'</div>'+
    renderFeedback()+
    '<div class="toolbar">'+
      '<button class="primary" data-action="check">Check my diagram</button>'+
      '<button data-action="clear">Start over</button>'+
      '<button data-action="reveal">Show answer</button>'+
    '</div>'+
    '<div class="legend"><span><b>Tip:</b> with nothing picked, click a word or a divider to take it off.</span></div>'+
  '</div>';
}

/* ============================================================ interaction */
function svgX(e){
  const svg=document.getElementById('canvas');
  if(!svg||!svg.createSVGPoint)return null;
  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const m=svg.getScreenCTM(); if(!m)return null;
  return p.matrixTransform(m.inverse()).x;
}
function insertIndexFor(x){
  const L=state._L; if(!L)return state.line.length;
  let i=0;
  L.gaps.forEach(g=>{ if(x>g.x)i=g.index; });
  return Math.min(i,state.line.length);
}
function clearSel(){state.sel=null;state.pending=null;}

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const action=btn.dataset.action;
  state.feedback=null; state.hint='';

  if(action==='role'){
    const r=btn.dataset.value;
    // The role stays armed after tagging, so several words can be tagged in a
    // row -- tagging one word no longer discards another word's selection.
    state.sel=(state.sel&&state.sel.kind==='role'&&state.sel.role===r)?null:{kind:'role',role:r};
    state.pending=null;
  }
  else if(action==='tool'){
    const t=btn.dataset.value;
    state.sel=toolArmed(t)?null:{kind:'tool',tool:t};
    state.pending=null;
    if(t==='conj'||t==='phrase')state.conjWord=null;   // each one starts fresh
  }
  else if(action==='word'){
    const i=Number(btn.dataset.index);
    if(state.sel&&state.sel.kind==='role'){
      state.roles[i]=(state.roles[i]===state.sel.role)?undefined:state.sel.role;
      if(state.roles[i]===undefined)delete state.roles[i];
      // deliberately keep the role armed
    }else if(state.sel&&state.sel.kind==='tool'&&
             (state.sel.tool==='conj'||state.sel.tool==='phrase')&&state.conjWord==null){
      // A two-part tool waiting for its word from the bank: this is it.
      state.conjWord=i; state.pending=null;
    }else if(state.sel&&state.sel.kind==='tool'&&state.sel.tool==='interj'){
      // An interjection attaches to nothing, so there is no second click: one
      // word, straight onto its own line. Stays armed like the role tools.
      if(!nodeForToken(i))addNode(i,'interj',null);
      else state.hint='"'+tokenText(i)+'" is already on the diagram.';
    }else if(nodeForToken(i)){
      const n=nodeForToken(i), kids=childrenOf(n.id).length;
      removeNode(n.id);
      clearSel();
      state.hint='Took "'+tokenText(i)+'" off'+(kids?' (and the '+kids+' word'+(kids>1?'s':'')+' under it)':'')+'.';
    }else{
      state.sel={kind:'word',tokenIndex:i}; state.pending=null;
    }
  }
  else if(action==='baseline'){
    if(state.sel&&state.sel.kind==='word'){
      const x=svgX(e);
      const at=(x==null)?state.line.length:insertIndexFor(x);
      const n=addNode(state.sel.tokenIndex,'line',null);
      state.line.splice(at,0,n.id);
      clearSel();
    }
  }
  else if(action==='node'){
    const n=nodeById(btn.dataset.node);
    if(!n)return;
    if(state.sel&&state.sel.kind==='word'){
      // attach under whatever was clicked -- right or wrong, no filtering
      const t=state.sel.tokenIndex;
      const r=roleOf(t);
      const attach=(r==='OP'&&roleOf(n.tokenIndex)==='PREP')?'prepObject':
                   (r==='PREP')?'prep':
                   (r==='IO')?'indirect':'mod';
      addNode(t,attach,n.id);
      clearSel();
    }else if(state.sel&&state.sel.kind==='tool'&&state.sel.tool==='phrase'){
      // "Same spot" -> a word from the bank, then the word on the line it joins.
      // The two share one segment, which is how a verb phrase is diagrammed.
      if(state.conjWord==null){
        state.hint='Pick the word to add from the word list first.';
      }else{
        const ci=cellIndexOfNode(n.id);
        if(ci>=0){
          const w=addNode(state.conjWord,'line',null);
          const cell=state.line[ci];
          // The words of a verb phrase are written in SENTENCE order ("has been
          // helping"), not in the order the student happened to add them, so
          // keep the run sorted by token index.
          const bySentence=ids=>ids.slice().sort((a,b)=>{
            const na=nodeById(a), nb=nodeById(b);
            return (na?na.tokenIndex:0)-(nb?nb.tokenIndex:0);
          });
          if(isPhrase(cell)){
            cell.ids=bySentence(cell.ids.concat([w.id]));
          }else if(!isFork(cell)){
            state.line[ci]={id:newId('p'),kind:'phrase',ids:bySentence([cell,w.id])};
          }else{
            // a fork arm: put it beside that arm, inside the arm
            state.hint='Add helping verbs to a plain spot, not to a compound arm.';
            removeNode(w.id);
          }
        }
        state.conjWord=null; clearSel();
      }
    }else if(state.sel&&state.sel.kind==='tool'){
      const tool=state.sel.tool;
      if(tool==='fork'){
        const ci=cellIndexOfNode(n.id);
        if(ci>=0&&!isFork(state.line[ci])){
          state.line[ci]={id:newId('f'),kind:'fork',arms:[n.id,null],conjId:null};
          state.hint='Now click a word, then click the empty arm to fill it.';
        }else if(ci>=0&&isFork(state.line[ci])){
          // Already a compound: clicking it again turns the V around, so the
          // split can point either way whatever the app guessed.
          const cell=state.line[ci];
          cell.flip=!forkFlipped(cell,ci,state.line.length);
          state.hint='Turned the compound the other way.';
        }
        clearSel();
      }else if(tool==='conj'){
        // Join with -> the conjunction -> the two words it joins.
        if(state.conjWord==null){
          state.hint='Click the joining word (like "and") in the word list first.';
          return;
        }
        if(!state.pending){state.pending=n.id; state.hint='';}
        else if(state.pending!==n.id){
          const t=state.conjWord;
          const a=nodeById(state.pending), b=n;
          const ci=cellIndexOfNode(a.id), cj=cellIndexOfNode(b.id);
          if(ci>=0&&ci===cj&&isFork(state.line[ci])){
            // both words are arms of one compound: the conjunction rides its guide
            const cn=addNode(t,'conj',null); state.line[ci].conjId=cn.id;
          }else if(a.parentId&&a.parentId===b.parentId){
            // two modifiers under the same word
            addNode(t,'conj',a.parentId);
          }else{
            // anything else: hang it off the first word clicked, and let Check judge
            addNode(t,'conj',a.parentId||null);
          }
          state.conjWord=null; clearSel();
        }
      }else{
        // divider tools: two clicks, both on words
        if(!state.pending){state.pending=n.id;}
        else if(state.pending!==n.id){
          const kind=tool.split(':')[1];
          state.dividers.push({id:newId('d'),kind:kind,leftId:state.pending,rightId:n.id});
          state.sel={kind:'tool',tool:tool}; state.pending=null;   // stay armed
        }
      }
    }else{
      removeNode(n.id);
      state.hint='Took "'+tokenText(n.tokenIndex)+'" off.';
    }
  }
  else if(action==='fillarm'){
    const [fid,ai]=btn.dataset.arm.split(':');
    if(state.sel&&state.sel.kind==='word'){
      const cell=state.line.find(c=>isFork(c)&&c.id===fid);
      if(cell){const n=addNode(state.sel.tokenIndex,'line',null); cell.arms[Number(ai)]=n.id;}
      clearSel();
    }
  }
  else if(action==='divider'){
    if(!state.sel){removeDivider(btn.dataset.div); state.hint='Took that divider off.';}
  }
  else if(action==='check'){state.feedback=grade(); clearSel();}
  else if(action==='clear'){
    const i=state.index; state=freshState(i);
  }
  else if(action==='reveal'){revealAnswer();}
  else if(action==='next'||action==='prev'){
    save();
    const d=action==='next'?1:-1;
    state=load((state.index+d+SENTENCES.length)%SENTENCES.length);
  }
  else return;
  save(); render();
});

/* Build the correct diagram, including dividers and forks, from the derived
   expectation -- so "Show answer" exercises exactly what Check grades. */
function revealAnswer(){
  const i=state.index; state=freshState(i);
  const exp=expectedModel(), s=sentence();
  const idOf={};
  exp.order.forEach((toks,ci)=>{
    const ids=toks.map(t=>{const n=addNode(t,'line',null); idOf[t]=n.id; state.roles[t]=exp.roles[t]; return n.id;});
    if(ids.length<2){state.line.push(ids[0]); return;}
    // consecutive words in one spot are a verb phrase, not a compound
    state.line.push(exp.cells[ci]&&exp.cells[ci].phrase
      ?{id:newId('p'),kind:'phrase',ids:ids}
      :{id:newId('f'),kind:'fork',arms:ids.slice(0,2),conjId:null});
  });
  // attachments, parents before children
  if(exp.clauseStart>0)state.clauseStarts=[exp.clauseStart];
  // An interjection has no parent to wait for, so it never enters the loop.
  s.expected.filter(e=>e.slot==='interj').forEach(e=>{
    const n=addNode(e.t,'interj',null); idOf[e.t]=n.id; state.roles[e.t]=e.role;
  });
  const rest=s.expected.filter(e=>!ZONE[e.slot]&&e.slot!=='conj'&&e.slot!=='modConj'&&
                                  e.slot!=='clauseConj'&&e.slot!=='interj');
  let guard=0;
  while(rest.length&&guard++<50){
    for(let k=rest.length-1;k>=0;k--){
      const e=rest[k];
      if(idOf[e.parent]!=null){
        const attach=e.slot==='prep'?'prep':e.slot==='prepObject'?'prepObject':
                     e.slot==='indirect'?'indirect':'mod';
        const n=addNode(e.t,attach,idOf[e.parent]); idOf[e.t]=n.id;
        state.roles[e.t]=e.role; rest.splice(k,1);
      }
    }
  }
  exp.dividers.forEach(d=>{
    const L=idOf[d.left[d.left.length-1]], R=idOf[d.right[0]];
    if(L&&R)state.dividers.push({id:newId('d'),kind:d.kind,leftId:L,rightId:R});
  });
  const cj=s.expected.find(e=>e.slot==='conj');
  if(cj){
    const fork=state.line.find(c=>isFork(c));
    const n=addNode(cj.t,'conj',fork?null:null); state.roles[cj.t]=cj.role;
    if(fork)fork.conjId=n.id;
  }
  const mc=s.expected.find(e=>e.slot==='modConj');
  if(mc&&idOf[mc.parent]!=null){
    const n=addNode(mc.t,'conj',idOf[mc.parent]); state.roles[mc.t]=mc.role;
  }
  const cc=s.expected.find(e=>e.slot==='clauseConj');
  if(cc){
    const n=addNode(cc.t,'conj',null); state.roles[cc.t]=cc.role;
    state.clauseConj=n.id;
  }
  state.hint='This is the finished diagram.';
}

/* ============================================================ boot */
(function init(){
  let start=0;
  try{const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
      if(Number.isInteger(all._last))start=Math.min(all._last,SENTENCES.length-1);}catch(e){}
  state=load(start);
  render();
})();
</script>

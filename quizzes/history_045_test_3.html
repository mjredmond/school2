</style></head><body><main><h1 id="title"></h1><p>Spell answers accurately and capitalize proper names. Master every recall item and confirm each map review to unlock the multiple-choice quiz.</p><div class="modes"><button id="studyMode">Study mode</button><button id="quizMode">Multiple-choice quiz</button><button id="toughMode" class="secondary">Toughest questions</button></div><div class="toolbar"><button id="skipStudy" class="secondary">Skip to quiz</button><button id="export" class="secondary">Export progress</button><label><button id="importButton" class="secondary" type="button">Import progress</button><input id="importFile" class="hidden" type="file" accept="application/json"></label><button id="reset" class="secondary">Reset progress</button></div><div id="content"></div></main><script id="study-data" type="application/json">{"id":"abeka_5_history_43_q9_45_t3_lesson_045_test_3","title":"History, Lesson 045, T3, Ch. 1–6","questions":[{"num":"1","page":"33","question":"One of the greatest cities of ancient times that was also a trading post in North Africa was what city?","type":"auto","answer":"Carthage","choices":["Carthage","Nineveh","Babylon","Jerusalem"]},{"num":"2","page":"49","question":"Who was the Babylonian ruler who wrote 300 laws for the everyday life of Babylonians?","type":"auto","answer":"Hammurabi","choices":["Hammurabi","Nebuchadnezzar","Sennacherib","Darius I"],"accept":["King Hammurabi"]},{"num":"3","page":"73","question":"The what Accords was the peace agreement in which several countries recognized Israel as an independent country?","type":"auto","answer":"Abraham","choices":["Abraham","Oslo","Camp David","Dayton"],"accept":["Abraham Accords"]},{"num":"4","page":"86","question":"A line of rulers in the same family that succeed each other is called what?","type":"auto","answer":"dynasty","choices":["dynasty","republic","theocracy","empire"],"accept":["Dynasty"]},{"num":"5","page":"100","question":"One of the largest shifting-sand deserts in the world is the what Desert?","type":"auto","answer":"Taklamakan","choices":["Taklamakan","Gobi","Kalahari","Atacama"],"accept":["Taklamakan Desert"]},{"num":"6","page":"107","question":"A what monarchy is one in which nine sultans take turns ruling for five years?","type":"auto","answer":"rotating","choices":["rotating","absolute","constitutional","hereditary"],"accept":["Rotating"]},{"num":"7","page":"116","question":"The largest of the three ancient Asian river valley cultures was the what River Valley civilization?","type":"auto","answer":"Yellow","choices":["Yellow","Indus","Tigris","Nile"]},{"num":"8","page":"15","question":"A government ruled by religious authority is called what?","type":"auto","answer":"theocracy","choices":["democracy","dictatorship","republic","theocracy"],"accept":["Theocracy"]},{"num":"9","page":"25","question":"What was the first known civilization to develop and use writing?","type":"auto","answer":"Sumerians","choices":["Assyrians","Chinese","Israelites","Sumerians"]},{"num":"10","page":"77","question":"The three countries in the South Caucasus are Georgia, what country, and Azerbaijan?","type":"auto","answer":"Armenia","choices":["Armenia","Iran","Iraq","Turkey"]},{"num":"11","page":"88","question":"The Taj Mahal was a tomb built for the wife of a ruler of what country?","type":"auto","answer":"India","choices":["Bangladesh","India","Nepal","Pakistan"]},{"num":"12","page":"100","question":"What multicontinental chain of volcanoes along the Pacific coasts experiences frequent earthquakes?","type":"auto","answer":"Ring of Fire","choices":["Angkor Wat","Great Wall of China","Kampong Ayer","Ring of Fire"],"accept":["Pacific Ring of Fire"]},{"num":"13","page":"103","question":"Before World War II, French Indochina included what country, Cambodia, and Vietnam?","type":"auto","answer":"Laos","choices":["Brunei","Indonesia","Laos","Myanmar"]},{"num":"14","page":"125","question":"What was the site of a 1989 protest against Communism in China?","type":"auto","answer":"Tiananmen Square","choices":["Hagia Sofia Square","Hong Kong Square","Medina Square","Tiananmen Square"]},{"num":"15","page":"A2","question":"What term means the greatest distance around the earth?","type":"auto","answer":"circumference","choices":["circumference","diameter","globe","hemisphere"],"accept":["Circumference"]},{"num":"16","page":"A3","question":"The Western Hemisphere contains the continents of North America and what other continent?","type":"auto","answer":"South America","choices":["Africa","Asia","Europe","South America"]},{"num":"17","page":"A3","question":"Two important lines of latitude in the Northern Hemisphere are what line and the Tropic of Cancer?","type":"auto","answer":"Arctic Circle","choices":["Antarctic Circle","Arctic Circle","Prime Meridian","Tropic of Capricorn"]},{"num":"18","page":"A5","question":"What group of lines goes up and down and from side to side, forming squares or boxes on a map?","type":"auto","answer":"grid","choices":["compass rose","distance scale","grid","map key"],"accept":["Grid"]},{"num":"19","page":"6","question":"The study of the earth's surface, climate, countries, people, and cultures is called what?","type":"auto","answer":"geography","choices":["geography","geology","archaeology","astronomy"],"accept":["Geography"]},{"num":"20","page":"21","question":"A group of people who share a culture is called what?","type":"auto","answer":"civilization","choices":["civilization","dynasty","empire","colony"],"accept":["Civilization"]},{"num":"21","page":"52","question":"Who was the Jewish captive trained to serve the king of Babylon?","type":"auto","answer":"Daniel","choices":["Daniel","Joseph","Moses","Samuel"]},{"num":"22","page":"60","question":"What peninsula connects Africa to Asia?","type":"auto","answer":"Sinai","choices":["Sinai","Arabian","Malay","Korean"],"accept":["Sinai Peninsula"]},{"num":"23","page":"93","question":"What is the world's highest mountain peak?","type":"auto","answer":"Mount Everest","choices":["Mount Everest","Mount Hermon","Mount Ararat","Mount Damavand"],"accept":["Everest"]},{"num":"24","page":"107","question":"What is the third-largest island in the world?","type":"auto","answer":"Borneo","choices":["Borneo","Luzon","Java","Sumatra"]},{"num":"25","page":"120","question":"Who was the Venetian trader who explored China?","type":"auto","answer":"Marco Polo","choices":["Marco Polo","Ferdinand Magellan","Vasco da Gama","Christopher Columbus"],"accept":["Polo"]},{"num":"26","page":"128","question":"Who was the fierce Mongol ruler who united the Mongol tribes?","type":"auto","answer":"Genghis Khan","choices":["Genghis Khan","Kublai Khan","Timur","Attila the Hun"],"accept":["Genghis"]},{"num":"27","page":"68","question":"What country in the ancient world was known for its cedar trees?","type":"auto","answer":"Lebanon","choices":["Lebanon","Syria","Jordan","Iraq"]},{"num":"28","page":"71","question":"What is the largest Middle Eastern country?","type":"auto","answer":"Saudi Arabia","choices":["Saudi Arabia","Iran","Iraq","Oman"]},{"num":"29","page":"88–89","question":"What country is known for its caste system?","type":"auto","answer":"India","choices":["India","Bhutan","Maldives","Cambodia"]},{"num":"30","page":"93","question":"What country is known as the \"Kingdom of the Thunder Dragon\"?","type":"auto","answer":"Bhutan","choices":["Bhutan","Nepal","Cambodia","Laos"]},{"num":"31","page":"94","question":"What country used cowrie shells as currency?","type":"auto","answer":"Maldives","choices":["Maldives","Bhutan","Lebanon","Cambodia"]},{"num":"32","page":"104","question":"In what country was the Khmer Empire the earliest known empire?","type":"auto","answer":"Cambodia","choices":["Cambodia","Laos","Myanmar","Thailand"]},{"num":"33","page":"109","question":"In what country did Mount Pinatubo erupt in 1991?","type":"auto","answer":"Philippines","choices":["Philippines","Indonesia","Japan","Papua New Guinea"]},{"num":"34","page":"66, 68","question":"What is the capital of Syria?","type":"auto","answer":"Damascus","choices":["Damascus","Ankara","Bangkok","Jakarta"]},{"num":"35","page":"75–76","question":"What is the capital of Turkey?","type":"auto","answer":"Ankara","choices":["Ankara","Damascus","Seoul","Taipei"]},{"num":"36","page":"87, 89","question":"What is the capital of India?","type":"auto","answer":"New Delhi","choices":["New Delhi","Bangkok","Jakarta","Seoul"]},{"num":"37","page":"103, 105","question":"What is the capital of Thailand?","type":"auto","answer":"Bangkok","choices":["Bangkok","Taipei","Ankara","New Delhi"]},{"num":"38","page":"111, 114","question":"What is the capital of South Korea?","type":"auto","answer":"Seoul","choices":["Seoul","Bangkok","Damascus","Jakarta"]},{"num":"39","page":"125–126","question":"What is the capital of Taiwan?","type":"auto","answer":"Taipei","choices":["Taipei","Ankara","New Delhi","Seoul"]},{"num":"40","page":"A62","question":"Be able to identify a plain on a physical-geography diagram.","type":"map"},{"num":"41","page":"A62","question":"Be able to identify a peninsula on a physical-geography diagram.","type":"map"},{"num":"42","page":"A62","question":"Be able to identify altitude on a physical-geography diagram.","type":"map"},{"num":"43","page":"A62","question":"Be able to identify a canyon on a physical-geography diagram.","type":"map"},{"num":"44","page":"A62","question":"Be able to identify a geyser on a physical-geography diagram.","type":"map"},{"num":"45","page":"A62","question":"Be able to identify an isthmus on a physical-geography diagram.","type":"map"},{"num":"46","page":"A31","question":"Be able to identify Japan on an East Asia map.","type":"map"},{"num":"47","page":"A31","question":"Be able to identify Vietnam on an East Asia map.","type":"map"},{"num":"48","page":"A31","question":"Be able to identify China on an East Asia map.","type":"map"},{"num":"49","page":"A31","question":"Be able to identify Philippines on an East Asia map.","type":"map"},{"num":"50","page":"A31","question":"Be able to identify North Korea on an East Asia map.","type":"map"},{"num":"51","page":"A31","question":"Be able to identify Mongolia on an East Asia map.","type":"map"}]}</script><script>
const STUDY=JSON.parse(document.getElementById('study-data').textContent),VERSION='40d9ef31b2f8',KEY='abeka-practice:'+STUDY.id+':'+VERSION,SKIP_PASSWORD='abc123';
const fresh=()=>({answers:{},reviews:{},stats:{study:{},quiz:{}},quiz:{queue:[],current:null,started:false},tough:{queue:[],current:null,started:false,cleared:[]}});let state=fresh();
function load(){try{const value=JSON.parse(localStorage.getItem(KEY));if(value&&value.stats&&value.stats.study&&value.stats.quiz)state={...fresh(),...value,stats:{...fresh().stats,...value.stats}}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function byNum(n){return STUDY.questions.find(q=>q.num===String(n))}function auto(){return STUDY.questions.filter(q=>q.type==='auto')}function stat(mode,n){const group=state.stats[mode],s=group[n]||(group[n]={correct:0,wrong:0,format:0,spelling:0});return s}function mastered(q){return (stat('study',q.num).correct||0)>0}function unlocked(){return STUDY.questions.every(q=>q.type==='auto'?mastered(q):state.reviews[q.num])}
function norm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}function distance(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function accepted(q){return [q.answer].concat(q.accept||[])}function caseNorm(s){return s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'')}function dropArticle(s){return s.replace(/^\s*(?:a|an|the)\s+/i,'')}function grade(q,value){const all=accepted(q);if(all.some(x=>value===x))return 'correct';const c=caseNorm(value);if(all.some(x=>c===caseNorm(x)))return 'correct';const ca=caseNorm(dropArticle(value));if(ca&&all.some(x=>ca===caseNorm(dropArticle(x))))return 'correct';const a=norm(value);if(all.some(x=>a===norm(x)))return 'format';let best='wrong';for(const x of all){const b=norm(x);const threshold=b.length<=4?1:b.length<=10?2:Math.min(4,Math.floor(b.length*.2));if(a&&distance(a,b)<=threshold){best='spelling';break}}return best}function text(result){return {correct:'Correct — mastered!',format:'Formatting error — check capitalization, punctuation, spacing, or accents.',spelling:'Spelling error — check the spelling carefully.',wrong:'Not correct. Try again.'}[result]}function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function feedback(el,result){el.className='feedback '+result;el.textContent=text(result)}function controls(){const ready=unlocked(),button=document.getElementById('quizMode');button.disabled=!ready;button.title=ready?'':'Master every study item first.'}function studyCount(){return auto().filter(mastered).length}
function renderStudy(){controls();const root=document.getElementById('content');root.innerHTML='';const status=document.createElement('div');status.className=unlocked()?'status mastered':'status lock';status.textContent=unlocked()?'Study phase complete. Multiple-choice quiz is unlocked.':'Mastered '+studyCount()+' of '+auto().length+' recall questions. Also confirm every map/written prompt.';root.append(status);STUDY.questions.forEach(q=>{const c=document.createElement('section');c.className='card '+(q.type==='auto'&&mastered(q)?'mastered':state.reviews[q.num]?'reviewed':'');c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');if(q.type==='auto'){if(mastered(q)){c.innerHTML+='<p class="correct"><strong>Mastered</strong></p>'}else{const input=document.createElement('input');input.type='text';input.value=state.answers[q.num]||'';input.setAttribute('aria-label','Answer for question '+q.num);input.oninput=()=>{state.answers[q.num]=input.value;save()};const submit=document.createElement('button');submit.textContent='Check answer';const f=document.createElement('div');const check=()=>{if(!input.value){f.className='feedback wrong';f.textContent='Enter an answer first.';return}const result=grade(q,input.value);stat('study',q.num)[result]++;save();feedback(f,result);if(result==='correct')setTimeout(renderStudy,450)};submit.onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};c.append(input,submit,f)}}else{const note=document.createElement('p');note.textContent=q.type==='map'?'Map-identification item: review it on a map, then confirm.':'Written-response item: review your response independently, then confirm.';const review=document.createElement('button');review.className='secondary';review.textContent=state.reviews[q.num]?'Reviewed':'I reviewed this';review.onclick=()=>{state.reviews[q.num]=!state.reviews[q.num];save();renderStudy()};c.append(note,review)}root.append(c)})}
function renderQuiz(){controls();const root=document.getElementById('content');if(!unlocked()){root.innerHTML='<div class="lock">Quiz mode is locked until every study answer is exact and all self-review prompts are confirmed.</div>';return}if(!state.quiz.started){resetQuizStats();state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save()}if(!state.quiz.current)state.quiz.current=state.quiz.queue.shift()||null;root.innerHTML='';const completed=auto().filter(q=>(stat('quiz',q.num).correct||0)>0).length;root.innerHTML='<div class="status">Quiz correct: '+completed+' of '+auto().length+'. Choose the correct answer before moving to the next question.</div>';if(!state.quiz.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>Quiz complete!</h2><p>Use Toughest questions to review what took the most attempts.</p>';const restart=document.createElement('button');restart.textContent='Start another quiz';restart.onclick=()=>{resetQuizStats();state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save();renderQuiz()};done.append(restart);root.append(done);return}const q=byNum(state.quiz.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const f=document.createElement('div');shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{const result=choice===q.answer?'correct':'wrong';stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){state.quiz.current=null;save();setTimeout(renderQuiz,500)}else{save()}};c.append(b)});c.append(f);root.append(c)}
function toughRows(){return auto().map(q=>{const b=stat('quiz',q.num);const current=b.wrong+b.format+b.spelling;const previous=(state.toughHistory||{})[q.num]||0;const quiz=current+previous;return {q,quiz,total:quiz}}).filter(row=>row.total).sort((a,b)=>b.total-a.total)}function resetQuizStats(){state.toughHistory=state.toughHistory||{};Object.entries(state.stats.quiz||{}).forEach(([number,b])=>{state.toughHistory[number]=(state.toughHistory[number]||0)+(b.wrong||0)+(b.format||0)+(b.spelling||0)});state.stats.quiz={};state.tough={queue:[],current:null,started:false,cleared:[]};save()}function startTough(){const nums=toughRows().map(r=>r.q.num);state.tough={queue:shuffle(nums),current:null,started:true,cleared:[]};save();renderTough()}function renderTough(){controls();const root=document.getElementById('content');const rows=toughRows();root.innerHTML='';if(!rows.length){root.innerHTML='<section class="card"><h2>Toughest questions</h2><p>No quiz mistakes recorded yet. Take a quiz, then come back to practice any missed questions.</p></section>';return}const t=state.tough||(state.tough={queue:[],current:null,started:false,cleared:[]});if(!t.started){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Toughest questions</h2><p>'+rows.length+' question'+(rows.length===1?'':'s')+' missed across your quizzes, hardest first.</p><ol>'+rows.map(row=>'<li><strong>'+row.q.num+'.</strong> '+row.q.question+' <small>— '+row.total+' miss'+(row.total===1?'':'es')+' across quizzes</small></li>').join('')+'</ol>';const go=document.createElement('button');go.className='primary';go.textContent='Drill these '+rows.length+' question'+(rows.length===1?'':'s');go.onclick=startTough;card.append(go);root.append(card);return}if(!t.current){t.current=t.queue.shift()||null;save()}const remaining=t.queue.length+(t.current?1:0);const status=document.createElement('div');status.className='status';status.textContent=t.current?('Cleared '+t.cleared.length+' of '+(t.cleared.length+remaining)+'. A miss goes back into the queue.'):'';root.append(status);if(!t.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>All clear!</h2><p>Every tough question answered correctly.</p>';const again=document.createElement('button');again.textContent='Drill again';again.onclick=startTough;const back=document.createElement('button');back.className='secondary';back.textContent='Back to the list';back.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};done.append(again,back);root.append(done);return}const q=byNum(t.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const f=document.createElement('div');let answered=false;shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{if(answered)return;answered=true;const result=choice===q.answer?'correct':'wrong';stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){if(t.cleared.indexOf(q.num)<0)t.cleared.push(q.num);t.current=null;save();setTimeout(renderTough,550)}else{const pos=Math.floor(Math.random()*(t.queue.length+1));t.queue.splice(pos,0,q.num);t.current=null;save();setTimeout(renderTough,900)}};c.append(b)});const quit=document.createElement('button');quit.className='secondary';quit.textContent='Stop drilling';quit.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};c.append(f,quit);root.append(c)}
function setMode(mode){if(mode==='quiz'&&!unlocked()){renderStudy();return}document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));document.getElementById(mode+'Mode').classList.add('active');if(mode==='study')renderStudy();else if(mode==='quiz')renderQuiz();else renderTough()}function skipStudy(){if(prompt('Enter the password to skip directly to quiz mode:')!==SKIP_PASSWORD){alert('Incorrect password.');return}auto().forEach(q=>{stat('study',q.num).correct=1});STUDY.questions.filter(q=>q.type!=='auto').forEach(q=>{state.reviews[q.num]=true});save();setMode('quiz')}document.getElementById('title').textContent=STUDY.title;document.getElementById('studyMode').onclick=()=>setMode('study');document.getElementById('quizMode').onclick=()=>setMode('quiz');document.getElementById('toughMode').onclick=()=>setMode('tough');document.getElementById('skipStudy').onclick=skipStudy;document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({studyId:STUDY.id,version:VERSION,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=STUDY.id+'_progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(value.studyId!==STUDY.id||value.version!==VERSION||!value.state)throw Error();state={...fresh(),...value.state};save();setMode('study')}catch(error){alert('This progress file belongs to a different study or is invalid.')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(confirm('Reset all saved answers and statistics?')){localStorage.removeItem(KEY);state=fresh();setMode('study')}};load();setMode('study');
</script></body></html>

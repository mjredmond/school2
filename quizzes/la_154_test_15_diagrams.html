<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abeka Language 4 Test 15 Practice</title>
  <style>
    :root {
      --bg: #f4f1eb;
      --surface: #fffdf8;
      --ink: #1e242c;
      --muted: #65707d;
      --line: #d7d0c4;
      --blue: #2f5f98;
      --green: #357a54;
      --amber: #9b6a17;
      --red: #a83e36;
      --shadow: 0 18px 44px rgba(38, 43, 51, .14);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(47, 95, 152, .08), transparent 260px),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin: -22px -22px 18px;
      padding: 18px 22px;
      background: rgba(244, 241, 235, .95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 1.1rem + 1.2vw, 2.25rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
    }

    .btn:hover {
      border-color: #9aa6b3;
    }

    .btn.primary {
      border-color: #244f83;
      color: #fff;
      background: var(--blue);
    }

    .btn.danger {
      border-color: rgba(168, 62, 54, .45);
      color: var(--red);
    }

    .score-panel {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 18px;
    }

    .score-tile {
      min-height: 74px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 6px 20px rgba(38, 43, 51, .06);
    }

    .score-tile strong {
      display: block;
      font-size: 1.3rem;
      line-height: 1;
    }

    .score-tile span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .83rem;
    }

    .section {
      margin: 0 0 22px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .88);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px dotted #beb5a8;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0;
    }

    .directions {
      margin: 5px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .section-count {
      min-width: 72px;
      padding: 6px 9px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-size: .85rem;
      font-weight: 700;
      text-align: center;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .item-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--surface);
    }

    .item-card.wide {
      grid-column: 1 / -1;
    }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .item-num {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      font-weight: 800;
    }

    .tag {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #f8f4ed;
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .prompt {
      margin: 0 0 10px;
      line-height: 1.48;
    }

    .sentence-line {
      margin: 8px 0 12px;
      padding: 10px;
      border: 1px solid #ddd4c7;
      border-radius: var(--radius);
      background: #fbf7ef;
      line-height: 1.8;
    }

    .token-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .token-btn {
      min-height: 34px;
      border: 1px solid #bfc7d1;
      border-radius: 7px;
      padding: 5px 9px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
    }

    .token-btn.selected {
      border-color: #234f83;
      color: #fff;
      background: var(--blue);
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 10px;
    }

    .mode-btn {
      min-height: 36px;
      border: 1px solid #bfc7d1;
      border-radius: 8px;
      padding: 7px 11px;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .mode-btn.active {
      border-color: #244f83;
      color: #fff;
      background: var(--blue);
    }

    .comma-mark {
      display: inline-block;
      min-width: .45em;
      color: var(--red);
      font-weight: 900;
    }

    .comma-before {
      margin-right: 2px;
    }

    .comma-after {
      margin-left: 1px;
    }

    .token-btn.selected .comma-mark {
      color: #ffe08a;
    }

    .token-btn.phrase-token {
      border-color: #c99a35;
      background: #fff4d9;
    }

    .token-btn.object-token {
      box-shadow: inset 0 -4px 0 rgba(155, 77, 47, .65);
    }

    .token-btn.pending-token {
      outline: 3px solid rgba(47, 95, 152, .28);
      outline-offset: 2px;
    }

    .token-btn.bold-token span.word-text {
      font-weight: 900;
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    .mark-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
      min-height: 34px;
      align-items: center;
    }

    .mark-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: #fff;
      color: var(--ink);
      font-size: .84rem;
      line-height: 1.2;
    }

    .chip-delete {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--red);
      cursor: pointer;
      font-weight: 900;
      line-height: 1;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .field-grid.single {
      grid-template-columns: 1fr;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    label,
    .field-title {
      color: #394553;
      font-size: .84rem;
      font-weight: 800;
    }

    select,
    input[type="text"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid #bac2cc;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
    }

    .checks {
      display: grid;
      gap: 7px;
      margin-top: 6px;
    }

    .checks label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--ink);
      font-weight: 500;
      line-height: 1.35;
    }

    .checks input {
      width: 17px;
      height: 17px;
      margin-top: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .feedback {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: var(--radius);
      line-height: 1.4;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      border: 1px solid rgba(53, 122, 84, .35);
      color: #1e573a;
      background: rgba(53, 122, 84, .08);
    }

    .feedback.bad {
      border: 1px solid rgba(168, 62, 54, .35);
      color: #7c2d27;
      background: rgba(168, 62, 54, .08);
    }

    .answer {
      display: none;
      margin-top: 10px;
      padding: 11px;
      border-left: 4px solid var(--amber);
      background: #fff8e9;
      line-height: 1.45;
    }

    .answer.show {
      display: block;
    }

    .answer strong {
      color: #704a0f;
    }

    .role-table {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .role-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 160px;
      gap: 8px;
      align-items: center;
    }

    .role-word {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #ddd4c7;
      border-radius: 8px;
      background: #fbf7ef;
      font-weight: 700;
    }

    .diagram-wrap {
      overflow-x: auto;
      margin-top: 10px;
      border: 1px solid #ddd4c7;
      border-radius: var(--radius);
      background: #fff;
    }

    .diagram-svg {
      display: block;
      width: 760px;
      max-width: none;
      height: 330px;
    }

    .diagram-line {
      stroke: #263241;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }

    .diagram-guide {
      stroke: #6e7b8a;
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      fill: none;
    }

    .diagram-text {
      font-size: 18px;
      font-family: Georgia, "Times New Roman", serif;
      fill: #1c2633;
      text-anchor: middle;
    }

    .small-text {
      font-size: 14px;
      fill: #4d5967;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
      color: var(--muted);
      font-size: .84rem;
    }

    .pill {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .score-panel,
      .items,
      .field-grid {
        grid-template-columns: 1fr;
      }

      .item-card.wide {
        grid-column: auto;
      }
    }

    @media (max-width: 560px) {
      .app-shell {
        padding: 14px;
      }

      .topbar {
        margin: -14px -14px 14px;
        padding: 14px;
      }

      .section {
        padding: 12px;
      }

      .role-row {
        grid-template-columns: 1fr;
      }
    }
  
    /* Test 15 integrated diagram controls */
    .sentence { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .role-toolbar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
    .role-btn { min-height: 42px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; background: #fff; cursor: pointer; }
    .role-btn strong { display: block; font-size: 13px; }
    .role-btn span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; line-height: 1.15; }
    .role-btn.selected { border-color: var(--blue); background: #edf4ff; box-shadow: 0 0 0 2px rgba(47, 95, 152, .18); }
    .word-bank { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .word-token { position: relative; display: inline-flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; min-width: 58px; min-height: 50px; border: 1px solid #c8d3df; border-radius: 6px; padding: 7px 8px 6px; background: #fff; cursor: pointer; user-select: none; }
    .word-token:hover { border-color: var(--blue); }
    .word-token.active-role { outline: 2px solid rgba(47, 95, 152, .28); }
    .word-token.used-word { background: #f2f7ef; border-color: rgba(53, 122, 84, .55); }
    .role-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 110px; min-height: 18px; }
    .chip { display: inline-flex; align-items: center; min-height: 18px; border-radius: 999px; padding: 1px 5px; color: #fff; font-size: 10px; font-weight: 800; }
    .role-s { background: var(--blue); }
    .role-av { background: var(--green); }
    .role-lv { background: #087f8c; }
    .role-bv { background: #596477; }
    .role-do { background: var(--amber); }
    .role-pn { background: #7b3f76; }
    .role-pa { background: #a34863; }
    .role-adj { background: #6b7d2a; }
    .role-adv { background: #8a5c1a; }
    .role-conj { background: #4b6f91; }
    .role-prep { background: #4f46a5; }
    .role-op { background: #9b4d2f; }
    .role-omit { background: #6b7280; }
    .diagram-target { cursor: pointer; pointer-events: all; }
    .target-hit { fill: transparent; stroke: transparent; }
    .mod-slot { fill: #f8fafc; stroke: #667085; stroke-width: 1; stroke-dasharray: 4 3; }
    .diagram-target.filled .mod-slot { stroke-dasharray: none; }
    .diagram-target:hover .target-hit, .diagram-target.selected .target-hit { fill: rgba(155, 106, 23, .12); stroke: var(--amber); stroke-width: 3; }
    .diagram-target.filled rect:not(.target-hit) { stroke-width: 2.5; }
    .diagram-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
    .diagram-choice { min-height: 106px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: #fff; cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
    .diagram-choice:hover { border-color: var(--blue); background: #f7fbff; }
    .diagram-choice.selected { border-color: var(--blue); background: #edf4ff; box-shadow: 0 0 0 2px rgba(47, 95, 152, .18); }
    .diagram-choice svg { display: block; width: 100%; height: 94px; }
    @media (max-width: 900px) { .role-toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .role-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Language 4 - Test 15 - Lesson 154</p>
        <h1>Sentence Diagramming and Grammar Practice</h1>
        <p class="subtitle">Practice the added Test 15 topics: conjunction commas, prepositional phrases, sentence patterns, adverb/preposition choices, and diagramming with conjunctions.</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="toggleAnswersBtn" type="button">Show Answers</button>
        <button class="btn danger" id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <section class="score-panel" aria-label="Progress summary">
      <div class="score-tile"><strong id="scoreCorrect">0</strong><span>Correct</span></div>
      <div class="score-tile"><strong id="scoreChecked">0</strong><span>Checked</span></div>
      <div class="score-tile"><strong id="scoreTotal">0</strong><span>Total Items</span></div>
      <div class="score-tile"><strong id="scorePercent">0%</strong><span>Accuracy</span></div>
    </section>

    <main id="sections"></main>
  </div>

  <script>
const STORAGE_KEY = "abeka_la_test15_single_page_v7";
const PATTERNS = ["S AV", "S AV DO", "S LV PN", "S LV PA", "S BV"];
const ROLES = [
  { id: "S", label: "Subject", className: "role-s" },
  { id: "AV", label: "Action Verb", className: "role-av" },
  { id: "LV", label: "Linking Verb", className: "role-lv" },
  { id: "BV", label: "Being Verb", className: "role-bv" },
  { id: "DO", label: "Direct Object", className: "role-do" },
  { id: "PN", label: "Pred. Nom.", className: "role-pn" },
  { id: "PA", label: "Pred. Adj.", className: "role-pa" },
  { id: "ADJ", label: "Adjective", className: "role-adj" },
  { id: "ADV", label: "Adverb", className: "role-adv" },
  { id: "CONJ", label: "Conjunction", className: "role-conj" },
  { id: "PREP", label: "Preposition", className: "role-prep" },
  { id: "OP", label: "Obj. Prep.", className: "role-op" },
  { id: "OMIT", label: "Prep phrase word", className: "role-omit" }
];
const ROLE_MAP = Object.fromEntries(ROLES.map(role => [role.id, role]));
const BASIC_STRUCTURES = ["simple", "av-do", "compound-subject-do", "compound-verb"];
const SHAPES = [
  { id: "simple", label: "Simple subject and predicate" },
  { id: "simple-subjectmod", label: "Simple subject and predicate with subject modifier" },
  { id: "simple-adv", label: "Simple subject and predicate with adverb" },
  { id: "av-do", label: "Action verb with direct object" },
  { id: "av-do-subjectmod", label: "Action verb with direct object and subject modifier" },
  { id: "av-do-objectmod", label: "Action verb with direct object and object modifier" },
  { id: "av-do-adv", label: "Action verb with direct object and adverb" },
  { id: "csdo-basic", label: "Compound subject with direct object" },
  { id: "csdo-subject-object-adv", label: "Compound subject, direct object, and three modifiers" },
  { id: "csdo-object2-adv", label: "Compound subject, direct object, two object modifiers, and adverb" },
  { id: "csdo-subject2-object", label: "Compound subject, direct object, two subject modifiers, and object modifier" },
  { id: "cv-basic", label: "Compound action verbs" },
  { id: "cv-subject1mod", label: "Compound action verbs with one subject modifier" },
  { id: "cv-subject2mods", label: "Compound action verbs with two subject modifiers" },
  { id: "cv-with-object", label: "Compound action verbs with direct object divider" }
];
const SHAPE_MAP = Object.fromEntries(SHAPES.map(shape => [shape.id, shape]));
const DETAIL_CHOICES = {
  simple: ["simple", "simple-subjectmod", "simple-adv"],
  "av-do": ["av-do", "av-do-subjectmod", "av-do-objectmod", "av-do-adv"],
  "compound-subject-do": ["csdo-basic", "csdo-subject-object-adv", "csdo-object2-adv", "csdo-subject2-object"],
  "compound-verb": ["cv-basic", "cv-subject1mod", "cv-subject2mods", "cv-with-object"]
};
const DATA = [
  { id: "conjunctions", title: "Conjunctions and Commas", countLabel: "6 items", type: "conjunctions", directions: "Circle each conjunction. Use Add Before or Add After, then click a word to place a comma mark.", items: [
    { id: "c1", num: 1, skill: "series plus opening word", tokens: ["Today", "we", "packed", "sandwiches", "apples", "and", "cookies"], conjunctions: [5], commaBoundaries: [1, 4, 5], answer: "Today, we packed sandwiches, apples, and cookies." },
    { id: "c2", num: 2, skill: "compound sentence", tokens: ["Olivia", "swept", "the", "porch", "and", "Daniel", "washed", "the", "windows"], conjunctions: [4], commaBoundaries: [4], answer: "Olivia swept the porch, and Daniel washed the windows." },
    { id: "c3", num: 3, skill: "joined modifiers", tokens: ["The", "morning", "was", "cloudy", "but", "pleasant"], conjunctions: [4], commaBoundaries: [], answer: "The morning was cloudy but pleasant." },
    { id: "c4", num: 4, skill: "compound sentence", tokens: ["We", "waited", "for", "an", "hour", "but", "the", "bus", "never", "came"], conjunctions: [5], commaBoundaries: [5], answer: "We waited for an hour, but the bus never came." },
    { id: "c5", num: 5, skill: "choice with or", tokens: ["Would", "you", "like", "lemonade", "or", "water", "with", "lunch"], conjunctions: [4], commaBoundaries: [], answer: "Would you like lemonade or water with lunch?" },
    { id: "c6", num: 6, skill: "series of verbs", tokens: ["The", "children", "laughed", "jumped", "and", "splashed", "beside", "the", "dock"], conjunctions: [4], commaBoundaries: [3, 4], answer: "The children laughed, jumped, and splashed beside the dock." }
  ] },
  { id: "prepositions", title: "Prepositional Phrases", countLabel: "4 items", type: "phrases", directions: "Use Mark Phrase, then click the first and last word. Use Object of Prep. to mark each object.", objectsRequired: true, items: [
    { id: "p1", num: 7, tokens: ["The", "choir", "practiced", "after", "chapel", "in", "the", "music", "room"], phraseRanges: [[3, 4], [5, 8]], objects: [4, 8] },
    { id: "p2", num: 8, tokens: ["Before", "breakfast", "Sarah", "fed", "the", "calves"], phraseRanges: [[0, 1]], objects: [1] },
    { id: "p3", num: 9, tokens: ["The", "flashlight", "fell", "under", "the", "back", "seat"], phraseRanges: [[3, 6]], objects: [6] },
    { id: "p4", num: 10, tokens: ["Near", "the", "playground", "the", "families", "waited", "for", "shade"], phraseRanges: [[0, 2], [6, 7]], objects: [2, 7] }

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalize(value) {
  return String(value ?? "")
    .toLowerCase()
    .replace(/<[^>]*>/g, "")
    .replace(/[^a-z0-9,\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();

function sortNumbers(values) {
  return [...new Set((values || []).map(Number).filter(Number.isFinite))].sort((a, b) => a - b);
}

function sameSet(actual, expected) {
  const a = sortNumbers(actual).map(String);
  const e = sortNumbers(expected).map(String);
  return a.length === e.length && a.every((value, index) => value === e[index]);
}

function sameRanges(actual, expected) {
  const pack = ranges => (ranges || [])
    .map(range => [Number(range[0]), Number(range[1])].sort((a, b) => a - b).join("-"))
    .sort();
  const a = pack(actual);
  const e = pack(expected);
  return a.length === e.length && a.every((value, index) => value === e[index]);
}

function phraseText(item, range) {

function tokenInRanges(index, ranges) {
  return (ranges || []).some(range => {

    return index >= start && index <= end;

// Shapes hard-code the structural lines of their own skeleton. When the chosen
// shape has a branch this sentence does not use, that branch was drawn as a bare
// diagonal with nothing on it. Mark every slanted line long enough to carry a
// word but with no place on it, so no arm reads as leading nowhere.
function markUnusedSlants(svg) {
  const taken = [];
  [...svg.matchAll(/<rect class="(?:mod-slot|slot-unused)"[^>]*transform="rotate\([-\d.]+ ([-\d.]+) ([-\d.]+)\)"/g)]
    .forEach(m => taken.push([+m[1], +m[2]]));
  [...svg.matchAll(/<rect(?![^>]*target-hit)[^>]*x="([-\d.]+)" y="([-\d.]+)" width="([\d.]+)" height="([\d.]+)"/g)]
    .forEach(m => taken.push([+m[1] + +m[3] / 2, +m[2] + +m[4] / 2]));
  const near = (x, y) => taken.some(t => Math.hypot(t[0] - x, t[1] - y) < 46);
  let add = "";
  [...svg.matchAll(/<line class="diagram-line" x1="([-\d.]+)" y1="([-\d.]+)" x2="([-\d.]+)" y2="([-\d.]+)"><\/line>/g)]
    .forEach(m => {
      const x1 = +m[1], y1 = +m[2], x2 = +m[3], y2 = +m[4];
      const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
      if (dx <= 3 || dy <= 3) return;
      // Connector arms joining a baseline to a branch never carry a word.
      if (Math.hypot(dx, dy) < 72) return;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      if (near(mx, my)) return;
      let d = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
      if (d > 90) d -= 180; else if (d < -90) d += 180;
      const w = Math.min(82, Math.hypot(dx, dy) - 6);
      taken.push([mx, my]);
      add += `<rect class="slot-unused" x="${mx - w / 2}" y="${my - 12}" width="${w}" height="24" rx="6" transform="rotate(${d.toFixed(2)} ${mx} ${my})"></rect>`;
    });
  return add ? svg.replace("</svg>", add + "</svg>") : svg;
}

  let slantDeg = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const index = Number(button.dataset.index);
      if (answer.mode === "object") {
        const objects = new Set(answer.objects || []);
        if (objects.has(index)) objects.delete(index);

      } else if (answer.mode === "phrase") {
        if (answer.phraseStart === undefined || answer.phraseStart === null) {

        } else {
          const range = [answer.phraseStart, index].sort((a, b) => a - b);
          const packed = range.join("-");
          const ranges = answer.phrases || [];
          if (!ranges.some(existing => [existing[0], existing[1]].sort((a, b) => a - b).join("-") === packed)) {

    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const index = Number(button.dataset.index);
      answer.phrases = (answer.phrases || []).filter((_, current) => current !== index);
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='delete-object']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const index = Number(button.dataset.index);
      answer.objects = (answer.objects || []).filter(value => Number(value) !== index);
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='pattern-choice']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      answer.pattern = answer.pattern === button.dataset.pattern ? "" : button.dataset.pattern;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='advprep-choice']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      answer.type = answer.type === button.dataset.value ? "" : button.dataset.value;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-role-mode']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      answer.selectedRole = button.dataset.role;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-role-token']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      if (!answer.roles) answer.roles = {};
      const index = Number(button.dataset.index);
      const selectedRole = answer.selectedRole || "S";
      if (selectedRole === "CLEAR") {
        ROLES.forEach(role => answer.roles[role.id] = (answer.roles[role.id] || []).filter(value => Number(value) !== index));
      } else {
        const set = new Set(answer.roles[selectedRole] || []);
        if (set.has(index)) set.delete(index);
        else set.add(index);
        answer.roles[selectedRole] = sortNumbers([...set]);
      }
      markDirty(button.dataset.item);
    });
  });
  document.querySelectorAll("[data-action='diagram-pattern']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      answer.pattern = answer.pattern === button.dataset.pattern ? "" : button.dataset.pattern;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-basic']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const next = answer.basicShape === button.dataset.basic ? "" : button.dataset.basic;
      answer.basicShape = next;
      answer.shape = "";
      answer.assignments = {};
      answer.selectedWord = null;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-shape']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const next = answer.shape === button.dataset.shape ? "" : button.dataset.shape;
      answer.shape = next;
      if (next) answer.basicShape = basicShapeForDetail(next);
      answer.assignments = {};
      answer.selectedWord = null;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-word']").forEach(button => {
    button.addEventListener("click", () => {
      const answer = getAnswer(button.dataset.item);
      const index = Number(button.dataset.index);
      answer.selectedWord = answer.selectedWord === index ? null : index;
      markDirty(button.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='diagram-target']").forEach(target => {
    target.addEventListener("click", () => {
      const answer = getAnswer(target.dataset.item);
      if (!answer.assignments) answer.assignments = {};
      const selected = answer.selectedWord;
      if (selected === undefined || selected === null) {
        delete answer.assignments[target.dataset.slot];
      } else {
        answer.assignments[target.dataset.slot] = [Number(selected)];
        answer.selectedWord = null;
      }
      answer.selectedTarget = target.dataset.slot;
      markDirty(target.dataset.item);
    });
  });

  document.querySelectorAll("[data-action='check']").forEach(button => {
    button.addEventListener("click", () => {
      checkItem(button.dataset.item);
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-action='clear']").forEach(button => {
    button.addEventListener("click", () => {
      delete state.answers[button.dataset.item];
      delete state.checked[button.dataset.item];
      saveState();
      render();
    });
  });
}

function findItem(itemId) {
  return allItems().find(entry => entry.item.id === itemId);
}

function checkItem(itemId) {
  const entry = findItem(itemId);
  if (!entry) return;
  let result;
  if (entry.section.type === "conjunctions") result = checkConjunction(entry.item);
  else if (entry.section.type === "phrases") result = checkPhrases(entry.item, true, false);
  else if (entry.section.type === "patterns") result = checkPhrases(entry.item, false, true);
  else if (entry.section.type === "advprep") result = checkAdvPrep(entry.item);
  else result = checkDiagram(entry.item);
  state.checked[itemId] = result;
}

function checkConjunction(item) {
  const answer = getAnswer(item.id);
  const conjunctionOk = sameSet(answer.tokens || [], item.conjunctions);
  const commaOk = sameSet(commaBoundaryList(answer.commaMarks || []), item.commaBoundaries);
  const parts = [];
  if (!conjunctionOk) parts.push("conjunction");
  if (!commaOk) parts.push("comma placement");
  return {
    correct: conjunctionOk && commaOk,
    message: conjunctionOk && commaOk ? "Correct." : `Check the ${parts.join(" and ")}.`
  };
}

function checkPhrases(item, requireObjects, requirePattern) {
  const answer = getAnswer(item.id);
  const phraseOk = sameRanges(answer.phrases || [], item.phraseRanges || []);
  const objectOk = !requireObjects || sameSet(answer.objects || [], expectedObjects(item));
  const patternOk = !requirePattern || answer.pattern === item.pattern;
  const parts = [];
  if (!phraseOk) parts.push("prepositional phrase marks");
  if (!objectOk) parts.push("object of the preposition marks");
  if (!patternOk) parts.push("sentence pattern");
  return {
    correct: phraseOk && objectOk && patternOk,
    message: phraseOk && objectOk && patternOk ? "Correct." : `Check the ${parts.join(" and ")}.`
  };
}

function checkAdvPrep(item) {
  const answer = getAnswer(item.id);
  const phraseOk = sameRanges(answer.phrases || [], item.phraseRanges || []);
  const typeOk = answer.type === item.answer;
  const parts = [];
  if (!phraseOk) parts.push("prepositional phrase marks");
  if (!typeOk) parts.push("Adv./Prep. choice");
  return {
    correct: phraseOk && typeOk,
    message: phraseOk && typeOk ? "Correct." : `Check the ${parts.join(" and ")}.`
  };
}
function checkDiagram(item) {
  const answer = getAnswer(item.id);
  const roles = answerRoles(answer);
  const roleErrors = [];
  ROLES.forEach(role => {
    const actual = roles[role.id];
    const expected = expectedRoleSet(item, role.id);
    if (!sameSet(actual, expected)) roleErrors.push(role.id);
  });
  const patternOk = answer.pattern === item.pattern;
  const basicOk = answer.basicShape === basicShapeForDetail(item.shape);
  const shapeOk = answer.shape === item.shape;
  const slotErrors = [];
  item.slots.forEach(slot => {
    const actual = (answer.assignments && answer.assignments[slot.id]) || [];
    if (!sameSet(actual, slot.expected)) slotErrors.push(slot.label);
  });
  const parts = [];
  if (roleErrors.length) parts.push(`roles (${roleErrors.slice(0, 5).join(", ")}${roleErrors.length > 5 ? "..." : ""})`);
  if (!patternOk) parts.push("sentence pattern");
  if (!basicOk) parts.push("basic diagram structure");
  if (!shapeOk) parts.push("detailed diagram version");
  if (slotErrors.length) parts.push(`diagram placements (${slotErrors.slice(0, 4).join(", ")}${slotErrors.length > 4 ? "..." : ""})`);
  const correct = !roleErrors.length && patternOk && basicOk && shapeOk && !slotErrors.length;
  return {
    correct,
    message: correct ? "Correct." : `Check the ${parts.join(" and ")}.`
  };
}

function renderScores() {
  const total = allItems().length;
  const checked = Object.keys(state.checked).length;
  const correct = Object.values(state.checked).filter(result => result.correct).length;
  const percent = checked ? Math.round((correct / checked) * 100) : 0;
  document.getElementById("scoreCorrect").textContent = correct;
  document.getElementById("scoreChecked").textContent = checked;
  document.getElementById("scoreTotal").textContent = total;
  document.getElementById("scorePercent").textContent = `${percent}%`;
}

document.getElementById("toggleAnswersBtn").addEventListener("click", () => {
  state.showAnswers = !state.showAnswers;
  saveState();
  render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset Test 15 practice progress?")) return;
  state = { answers: {}, checked: {}, showAnswers: false };
  saveState();
  render();
});

render();
</script>

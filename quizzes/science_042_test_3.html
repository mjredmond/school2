</style></head><body><main><h1 id="title"></h1><p>Spell answers accurately and capitalize proper names. Master every recall item and confirm each diagram and written review to unlock the multiple-choice quiz.</p><div class="modes"><button id="studyMode">Study mode</button><button id="quizMode">Multiple-choice quiz</button><button id="toughMode" class="secondary">Toughest questions</button></div><div class="toolbar"><button id="skipStudy" class="secondary">Skip to quiz</button><button id="export" class="secondary">Export progress</button><label><button id="importButton" class="secondary" type="button">Import progress</button><input id="importFile" class="hidden" type="file" accept="application/json"></label><button id="reset" class="secondary">Reset progress</button></div><div id="content"></div></main><script id="study-data" type="application/json">{"id":"abeka_5_science_42_t3_lesson_042_test_3","title":"Science, Lesson 042, T3, Ch. 1–5","questions":[{"num":"1","page":"4","question":"What is the second step of the scientific method?","type":"auto","answer":"form a hypothesis","choices":["form a hypothesis","observe and state the problem","experiment and gather data","report results"],"accept":["Form a hypothesis","hypothesis","Hypothesis","formulating a hypothesis","Formulating a hypothesis"]},{"num":"2","page":"12","question":"A table, diagram, or chart that shows data in a visually organized manner is called what?","type":"auto","answer":"concept map","choices":["concept map","hypothesis","experiment","conclusion"],"accept":["Concept map"]},{"num":"3","page":"27","question":"A set of beliefs that shapes what someone believes to be true is called what?","type":"auto","answer":"worldview","choices":["worldview","theory","hypothesis","scientific law"],"accept":["Worldview"]},{"num":"4","page":"38","question":"Earth belongs to which group of planets?","type":"auto","answer":"inner","choices":["inner","outer","dwarf","gas giant"],"accept":["Inner","inner planets","Inne he atmosphere to the earth's surface as rain, sleet, snow, or hail?","type":"auto","answer":"precipitation","choices":["evaporation","condensation","precipitation","infiltration"],"accept":["Precipitation"]},{"num":"31","page":"14","question":"What part of a graph represents a certain fraction, or part, of the whole?","type":"auto","answer":"sector","choices":["interval","point","sector","trend"],"accept":["Sector"]},{"num":"32","page":"21","question":"What instrument is used to separate parts of a mixture?","type":"auto","answer":"strainer","choices":["funnel","scale","strainer","thermometer"],"accept":["Strainer"]},{"num":"33","page":"26","question":"What is the study of God's creation beyond our atmosphere?","type":"auto","answer":"astronomy","choices":["astronomy","geology","meteorology","oceanography"],"accept":["Astronomy"]},{"num":"34","page":"76","question":"Be able to identify a domed mountain on a mountain-formation diagram.","type":"map"},{"num":"35","page":"100","question":"Coal is what type of rock?","type":"auto","answer":"sedimentary rock","choices":["precious stone","igneous rock","metamorphic rock","sedimentary rock"],"accept":["Sedimentary rock","sedimentary","Sedimentary"]},{"num":"36","page":"102","question":"What is the use of hot springs to generate electricity called?","type":"auto","answer":"geothermal energy","choices":["geothermal energy","hydropower","solar energy","wind power"],"accept":["Geothermal energy"]},{"num":"37","page":"124","question":"A low area of land near the coast that floods with the tide is called what?","type":"auto","answer":"salt marsh","choices":["barrier island","hydrothermal vent","sandbar","salt marsh"],"accept":["Salt marsh"]},{"num":"38","page":"156, 158","question":"Be able to identify stratus clouds in pictures of cloud types.","type":"map"},{"num":"39","page":"179","question":"What is the low-pressure area around which a hurricane rotates called?","type":"auto","answer":"eye","choices":["eye","eye wall","natural disaster","storm surge"],"accept":["Eye","hurricane eye","Hurricane eye","eye of the hurricane","Eye of the hurricane"]},{"num":"40","page":"141–143","question":"Be able to identify the exosphere on a diagram of the atmosphere.","type":"map"},{"num":"41","page":"141–143","question":"Be able to identify the thermosphere on a diagram of the atmosphere.","type":"map"},{"num":"42","page":"141–143","question":"Be able to identify the mesosphere on a diagram of the atmosphere.","type":"map"},{"num":"43","page":"141–143","question":"Be able to identify the stratosphere on a diagram of the atmosphere.","type":"map"},{"num":"44","page":"141–143","question":"Be able to identify the troposphere on a diagram of the atmosphere.","type":"map"},{"num":"45","page":"117–118","question":"Be able to identify high tide on a tide diagram.","type":"map"},{"num":"46","page":"117–118","question":"Be able to identify neap tide on a tide diagram.","type":"map"},{"num":"47","page":"117–118","question":"Be able to identify spring tide on a tide diagram.","type":"map"},{"num":"48","page":"117–118","question":"Be able to identify low tide on a tide diagram.","type":"map"},{"num":"49","page":"174, 179","question":"Be able to identify a tornado in a natural-disaster picture.","type":"map"},{"num":"50","page":"174, 179","question":"Be able to identify a hurricane in a natural-disaster picture.","type":"map"},{"num":"51","page":"122–124","question":"Be able to identify salt marsh on a coastal-zone diagram.","type":"map"},{"num":"52","page":"122–124","question":"Be able to identify estuary on a coastal-zone diagram.","type":"map"},{"num":"53","page":"122–124","question":"Be able to identify barrier islands on a coastal-zone diagram.","type":"map"},{"num":"54","page":"122–124","question":"Be able to identify shore on a coastal-zone diagram.","type":"map"},{"num":"55","page":"122–124","question":"Be able to identify sandbar on a coastal-zone diagram.","type":"map"},{"num":"56","page":"122–124","question":"Be able to identify coastal dunes on a coastal-zone diagram.","type":"map"},{"num":"57","page":"122–124","question":"Be able to identify longshore drift on a coastal-zone diagram.","type":"map"},{"num":"58","page":"128–131","question":"Be able to identify a trench on an ocean-floor diagram.","type":"map"},{"num":"59","page":"128–131","question":"Be able to identify a hydrothermal vent on an ocean-floor diagram.","type":"map"},{"num":"60","page":"128–131","question":"Be able to identify a mid-ocean ridge on an ocean-floor diagram.","type":"map"}]}</script><script>
const STUDY=JSON.parse(document.getElementById('study-data').textContent),VERSION='93522cfc3755',KEY='abeka-practice:'+STUDY.id+':'+VERSION,SKIP_PASSWORD='abc123';
const fresh=()=>({answers:{},reviews:{},stats:{study:{},quiz:{}},quiz:{queue:[],current:null,started:false},tough:{queue:[],current:null,started:false,cleared:[]}});let state=fresh();
function load(){try{const value=JSON.parse(localStorage.getItem(KEY));if(value&&value.stats&&value.stats.study&&value.stats.quiz)state={...fresh(),...value,stats:{...fresh().stats,...value.stats}}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function byNum(n){return STUDY.questions.find(q=>q.num===String(n))}function auto(){return STUDY.questions.filter(q=>q.type==='auto')}function stat(mode,n){const group=state.stats[mode],s=group[n]||(group[n]={correct:0,wrong:0,format:0,spelling:0});return s}function mastered(q){return (stat('study',q.num).correct||0)>0}function unlocked(){return STUDY.questions.every(q=>q.type==='auto'?mastered(q):state.reviews[q.num])}
function norm(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}function distance(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function accepted(q){return [q.answer].concat(q.accept||[])}function caseNorm(s){return s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'')}function dropArticle(s){return s.replace(/^\s*(?:a|an|the)\s+/i,'')}function grade(q,value){const all=accepted(q);if(all.some(x=>value===x))return 'correct';const c=caseNorm(value);if(all.some(x=>c===caseNorm(x)))return 'correct';const ca=caseNorm(dropArticle(value));if(ca&&all.some(x=>ca===caseNorm(dropArticle(x))))return 'correct';const a=norm(value);if(all.some(x=>a===norm(x)))return 'format';let best='wrong';for(const x of all){const b=norm(x);const threshold=b.length<=4?1:b.length<=10?2:Math.min(4,Math.floor(b.length*.2));if(a&&distance(a,b)<=threshold){best='spelling';break}}return best}function text(result){return {correct:'Correct — mastered!',format:'Formatting error — check capitalization, punctuation, spacing, or accents.',spelling:'Spelling error — check the spelling carefully.',wrong:'Not correct. Try again.'}[result]}function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function feedback(el,result){el.className='feedback '+result;el.textContent=text(result)}function controls(){const ready=unlocked(),button=document.getElementById('quizMode');button.disabled=!ready;button.title=ready?'':'Master every study item first.'}function studyCount(){return auto().filter(mastered).length}
function renderStudy(){controls();const root=document.getElementById('content');root.innerHTML='';const status=document.createElement('div');status.className=unlocked()?'status mastered':'status lock';status.textContent=unlocked()?'Study phase complete. Multiple-choice quiz is unlocked.':'Mastered '+studyCount()+' of '+auto().length+' recall questions. Also confirm every diagram and written prompt.';root.append(status);STUDY.questions.forEach(q=>{const c=document.createElement('section');c.className='card '+(q.type==='auto'&&mastered(q)?'mastered':state.reviews[q.num]?'reviewed':'');c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');if(q.type==='auto'){if(mastered(q)){c.innerHTML+='<p class="correct"><strong>Mastered</strong></p>'}else{const input=document.createElement('input');input.type='text';input.value=state.answers[q.num]||'';input.setAttribute('aria-label','Answer for question '+q.num);input.oninput=()=>{state.answers[q.num]=input.value;save()};const submit=document.createElement('button');submit.textContent='Check answer';const f=document.createElement('div');const check=()=>{if(!input.value){f.className='feedback wrong';f.textContent='Enter an answer first.';return}const result=grade(q,input.value);stat('study',q.num)[result]++;save();feedback(f,result);if(result==='correct')setTimeout(renderStudy,450)};submit.onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};c.append(input,submit,f)}}else{const note=document.createElement('p');note.textContent=q.type==='map'?'Diagram-identification item: study the referenced textbook diagram or picture, then confirm.':'Written-response item: review your response independently, then confirm.';const review=document.createElement('button');review.className='secondary';review.textContent=state.reviews[q.num]?'Reviewed':'I reviewed this';review.onclick=()=>{state.reviews[q.num]=!state.reviews[q.num];save();renderStudy()};c.append(note,review)}root.append(c)})}
function renderQuiz(){controls();const root=document.getElementById('content');if(!unlocked()){root.innerHTML='<div class="lock">Quiz mode is locked until every study answer is exact and all self-review prompts are confirmed.</div>';return}if(!state.quiz.started){resetQuizStats();state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save()}if(!state.quiz.current)state.quiz.current=state.quiz.queue.shift()||null;root.innerHTML='';const completed=auto().filter(q=>(stat('quiz',q.num).correct||0)>0).length;root.innerHTML='<div class="status">Quiz correct: '+completed+' of '+auto().length+'. Choose the correct answer before moving to the next question.</div>';if(!state.quiz.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>Quiz complete!</h2><p>Use Toughest questions to review what took the most attempts.</p>';const restart=document.createElement('button');restart.textContent='Start another quiz';restart.onclick=()=>{resetQuizStats();state.quiz={queue:shuffle(auto().map(q=>q.num)),current:null,started:true};save();renderQuiz()};done.append(restart);root.append(done);return}const q=byNum(state.quiz.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const f=document.createElement('div');shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{const result=choice===q.answer?'correct':'wrong';stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){state.quiz.current=null;save();setTimeout(renderQuiz,500)}else{save()}};c.append(b)});c.append(f);root.append(c)}
function toughRows(){return auto().map(q=>{const b=stat('quiz',q.num);const current=b.wrong+b.format+b.spelling;const previous=(state.toughHistory||{})[q.num]||0;const quiz=current+previous;return {q,quiz,total:quiz}}).filter(row=>row.total).sort((a,b)=>b.total-a.total)}function resetQuizStats(){state.toughHistory=state.toughHistory||{};Object.entries(state.stats.quiz||{}).forEach(([number,b])=>{state.toughHistory[number]=(state.toughHistory[number]||0)+(b.wrong||0)+(b.format||0)+(b.spelling||0)});state.stats.quiz={};state.tough={queue:[],current:null,started:false,cleared:[]};save()}function startTough(){const nums=toughRows().map(r=>r.q.num);state.tough={queue:shuffle(nums),current:null,started:true,cleared:[]};save();renderTough()}function renderTough(){controls();const root=document.getElementById('content');const rows=toughRows();root.innerHTML='';if(!rows.length){root.innerHTML='<section class="card"><h2>Toughest questions</h2><p>No quiz mistakes recorded yet. Take a quiz, then come back to practice any missed questions.</p></section>';return}const t=state.tough||(state.tough={queue:[],current:null,started:false,cleared:[]});if(!t.started){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Toughest questions</h2><p>'+rows.length+' question'+(rows.length===1?'':'s')+' missed across your quizzes, hardest first.</p><ol>'+rows.map(row=>'<li><strong>'+row.q.num+'.</strong> '+row.q.question+' <small>— '+row.total+' miss'+(row.total===1?'':'es')+' across quizzes</small></li>').join('')+'</ol>';const go=document.createElement('button');go.className='primary';go.textContent='Drill these '+rows.length+' question'+(rows.length===1?'':'s');go.onclick=startTough;card.append(go);root.append(card);return}if(!t.current){t.current=t.queue.shift()||null;save()}const remaining=t.queue.length+(t.current?1:0);const status=document.createElement('div');status.className='status';status.textContent=t.current?('Cleared '+t.cleared.length+' of '+(t.cleared.length+remaining)+'. A miss goes back into the queue.'):'';root.append(status);if(!t.current){const done=document.createElement('section');done.className='card mastered';done.innerHTML='<h2>All clear!</h2><p>Every tough question answered correctly.</p>';const again=document.createElement('button');again.textContent='Drill again';again.onclick=startTough;const back=document.createElement('button');back.className='secondary';back.textContent='Back to the list';back.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};done.append(again,back);root.append(done);return}const q=byNum(t.current),c=document.createElement('section');c.className='card';c.innerHTML='<div class="question">'+q.num+'. '+q.question+'</div>'+(q.page?'<div class="page">Page(s): '+q.page+'</div>':'');const f=document.createElement('div');let answered=false;shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{if(answered)return;answered=true;const result=choice===q.answer?'correct':'wrong';stat('quiz',q.num)[result]++;feedback(f,result);if(result==='correct'){if(t.cleared.indexOf(q.num)<0)t.cleared.push(q.num);t.current=null;save();setTimeout(renderTough,550)}else{const pos=Math.floor(Math.random()*(t.queue.length+1));t.queue.splice(pos,0,q.num);t.current=null;save();setTimeout(renderTough,900)}};c.append(b)});const quit=document.createElement('button');quit.className='secondary';quit.textContent='Stop drilling';quit.onclick=()=>{state.tough={queue:[],current:null,started:false,cleared:[]};save();renderTough()};c.append(f,quit);root.append(c)}
function setMode(mode){if(mode==='quiz'&&!unlocked()){renderStudy();return}document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));document.getElementById(mode+'Mode').classList.add('active');if(mode==='study')renderStudy();else if(mode==='quiz')renderQuiz();else renderTough()}function skipStudy(){if(prompt('Enter the password to skip directly to quiz mode:')!==SKIP_PASSWORD){alert('Incorrect password.');return}auto().forEach(q=>{stat('study',q.num).correct=1});STUDY.questions.filter(q=>q.type!=='auto').forEach(q=>{state.reviews[q.num]=true});save();setMode('quiz')}document.getElementById('title').textContent=STUDY.title;document.getElementById('studyMode').onclick=()=>setMode('study');document.getElementById('quizMode').onclick=()=>setMode('quiz');document.getElementById('toughMode').onclick=()=>setMode('tough');document.getElementById('skipStudy').onclick=skipStudy;document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({studyId:STUDY.id,version:VERSION,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=STUDY.id+'_progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(value.studyId!==STUDY.id||value.version!==VERSION||!value.state)throw Error();state={...fresh(),...value.state};save();setMode('study')}catch(error){alert('This progress file belongs to a different study or is invalid.')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(confirm('Reset all saved answers and statistics?')){localStorage.removeItem(KEY);state=fresh();setMode('study')}};load();setMode('study');
</script></body></html>

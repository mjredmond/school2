const app=document.getElementById('app');
const score=document.getElementById('score');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const boldMarkup=s=>String(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
// Each quiz keeps its own run so switching quiz type never mixes answers or scores.
const runs={};
let currentQuiz=(PRACTICE.quizzes||[])[0]?.id||'';
function quizById(id){return (PRACTICE.quizzes||[]).find(q=>q.id===id);}
function run(){return runs[currentQuiz]||(runs[currentQuiz]=freshRun(currentQuiz));}
function allItems(quizId=currentQuiz){return (quizById(quizId)?.sections||[]).flatMap(section=>(section.items||[]).map(item=>({section,item})));}
function findItem(id){return allItems().find(x=>x.item.id===id)?.item;}
function shuffle(list){const out=[...list];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function freshRun(quizId){
  const r={variant:{},order:{},answers:{},checkedAll:false,checkedItems:{},showAnswers:false,wrongAttempts:{},revealedAnswers:{}};
  for(const {item} of allItems(quizId)){
    r.variant[item.id]=Math.floor(Math.random()*Math.max(1,(item.variants||[]).length));
    r.order[item.id]=shuffle((item.variants[r.variant[item.id]]||{}).choices||[]);
    r.answers[item.id]=defaultAnswer();
  }
  return r;
}
function defaultAnswer(){return{choice:null};}
function activeVariant(item){return (item.variants||[])[run().variant[item.id]]||{};}
// The key is stored as the answer text, so shuffling the choices can never move it.
function isCorrect(item,v,a){return !!a&&a.choice!==null&&a.choice!==undefined&&String(a.choice)===String(v.answer);}
function isItemChecked(item){return run().checkedAll||!!run().checkedItems[item.id];}
function answerUnlocked(id){return (run().wrongAttempts[id]||0)>=5||!!run().revealedAnswers[id];}
function shouldShowAnswer(id){return !!run().revealedAnswers[id]||(run().showAnswers&&answerUnlocked(id));}
function recordCheck(item){const r=run();const ok=isCorrect(item,activeVariant(item),r.answers[item.id]);r.wrongAttempts[item.id]=ok?0:(r.wrongAttempts[item.id]||0)+1;return ok;}
function renderItem(item){
  const r=run(),v=activeVariant(item),a=r.answers[item.id]||defaultAnswer();
  const checked=isItemChecked(item),ok=isCorrect(item,v,a);
  const cls=checked?(ok?' correct':' missed'):'';
  const wrong=r.wrongAttempts[item.id]||0;
  const order=r.order[item.id]||v.choices||[];
  const choices=`<div class="options">${order.map(c=>`<button class="${a.choice===c?'selected':''}" data-action="choice" data-id="${esc(item.id)}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  const feedback=checked?`<span class="feedback">${ok?'Correct':'Try again'}</span>`:'';
  const tries=checked&&!ok&&wrong>0?`<span class="pill">Wrong tries: ${Math.min(wrong,5)}/5</span>`:'';
  const reveal=!shouldShowAnswer(item.id)&&answerUnlocked(item.id)?`<button data-action="reveal-answer" data-id="${esc(item.id)}">Show Answer</button>`:'';
  const answer=shouldShowAnswer(item.id)?`<div class="answer"><strong>Answer:</strong> ${esc(v.answer)}</div>`:'';
  const page=item.page?`<div class="page">Textbook page(s): ${esc(item.page)}</div>`:'';
  return `<article class="item${cls}" id="${esc(item.id)}"><div class="stem"><div class="num">${esc(item.num)}.</div><div class="prompt">${boldMarkup(esc(v.prompt||''))}</div></div>${page}${choices}<div class="item-tools"><button data-action="check-item" data-id="${esc(item.id)}">${checked?'Check Again':'Check'}</button>${feedback}${tries}${reveal}</div>${answer}</article>`;
}
function render(){
  document.getElementById('subtitle').textContent=PRACTICE.subtitle||'';
  document.getElementById('quizSwitch').innerHTML=(PRACTICE.quizzes||[]).map(q=>`<button role="tab" aria-selected="${q.id===currentQuiz}" class="${q.id===currentQuiz?'active':''}" data-action="switch-quiz" data-value="${esc(q.id)}">${esc(q.title)}</button>`).join('');
  const quiz=quizById(currentQuiz)||{};
  document.getElementById('quizNote').textContent=quiz.description||'';
  app.innerHTML=(quiz.sections||[]).map(section=>`<section class="section"><h2>${esc(section.title)}</h2>${section.directions?`<p class="directions">${esc(section.directions)}</p>`:''}${(section.items||[]).map(renderItem).join('')}</section>`).join('');
  const r=run(),items=allItems(),checked=items.filter(({item})=>isItemChecked(item));
  if(checked.length){const good=checked.filter(({item})=>isCorrect(item,activeVariant(item),r.answers[item.id])).length;const unchecked=items.length-checked.length;score.innerHTML=`<div class="section"><strong>${r.checkedAll?'Score':'Checked'}:</strong> ${good} correct of ${checked.length} checked${unchecked?` (${unchecked} unchecked)`:''}</div>`;}
  else score.innerHTML='';
}
app.addEventListener('click',event=>{
  const btn=event.target.closest('[data-action]');
  if(!btn)return;
  const id=btn.dataset.id,action=btn.dataset.action,r=run();
  if(action==='choice'){r.answers[id]={choice:btn.dataset.value};}
  if(action==='check-item'){const item=findItem(id);if(item){r.checkedItems[id]=true;recordCheck(item);}r.showAnswers=false;}
  if(action==='reveal-answer'&&answerUnlocked(id))r.revealedAnswers[id]=true;
  render();
});
document.getElementById('quizSwitch').addEventListener('click',event=>{
  const btn=event.target.closest('[data-action="switch-quiz"]');
  if(!btn||btn.dataset.value===currentQuiz)return;
  currentQuiz=btn.dataset.value;render();window.scrollTo(0,0);
});
document.getElementById('checkAllBtn').addEventListener('click',()=>{const r=run();r.checkedAll=true;r.showAnswers=false;for(const {item} of allItems())recordCheck(item);render();});
document.getElementById('resetBtn').addEventListener('click',()=>{runs[currentQuiz]=freshRun(currentQuiz);render();window.scrollTo(0,0);});
document.getElementById('answersBtn').addEventListener('click',()=>{const r=run();r.showAnswers=!r.showAnswers;render();});
render();
</script>
